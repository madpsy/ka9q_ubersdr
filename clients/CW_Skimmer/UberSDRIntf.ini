; UberSDR Interface Configuration File
; This file should be placed in the same directory as UberSDRIntf.dll
;
; Configuration format:
; [Server]
; Host = IP address or hostname of the ka9q-radio server
; Port = WebSocket port number (typically 8080)
; debug_rec = Enable 10-second WAV recording on start (0=false, 1=true)
; min_margin = Reduced-depth IQ compression, in dB (default 26; 0=off, or 15-60)
;
; [Calibration]
; FrequencyOffset = Frequency correction in Hz (can be positive or negative)
; swap_iq = Swap I and Q channels (0=no swap, 1=swap, default=1)
;
; Examples:
; Host=127.0.0.1    (localhost)
; Host=192.168.1.100 (LAN address)
; Host=radio.example.com (hostname)
; Port=8080
; debug_rec=0       (disable WAV recording)
; debug_rec=1       (enable WAV recording)
; min_margin=26     (the default - quantisation floor 26 dB under the noise)
; min_margin=0      (turn it off - lossless, bit-exact IQ)
; FrequencyOffset=0   (no correction)
; FrequencyOffset=100 (add 100 Hz to all frequencies)
; FrequencyOffset=-50 (subtract 50 Hz from all frequencies)
; swap_iq=1           (swap I and Q - default behavior)

[Server]
Host=ubersdr.local
Port=8080
debug_rec=0

; Reduced-depth IQ compression. ON BY DEFAULT at 26 dB, including on an ini that
; has no min_margin line at all - set it to 0 for the bit-exact stream.
;
; It trades a little of the receiver's own noise floor for a much smaller stream.
; At 26 dB the trade is about 0.01 dB of noise floor, which is two orders of
; magnitude below what a receiver's own readings can resolve, for roughly half
; the bytes.
;
; The value is a MARGIN in dB, not a bit depth: how far below the band's own
; noise floor the compression's noise must stay. The server picks the bit depth
; needed to honour it afresh for every packet, so the setting means the same
; thing on a dead 6 m band as it does on crowded medium wave.
;
; Valid values:
;   26       The default, and the measured transparent setting: every FT8 decode
;            survives it with its reported strength intact.
;   15 - 60  Lower asks for more compression, higher for less.
;   0        Off. Lossless, bit-exact IQ.
;
; Anything else - out of range, or not a number - is REFUSED, and the stream
; falls back to lossless with the reason written to the log. It is not rounded
; into range: the server would clamp a bad value into a working but different
; stream, and nothing downstream would ever say so. This matches the
; --min-margin option in the HPSDR bridge and the min_margin argument in the
; SoapySDR driver, which are strict for the same reason.
;
; Why this is safe for skimming. The compression adds white noise, and Skimmer's
; narrow CW filters attenuate white noise exactly as they attenuate the band's
; own - so the penalty does not grow as the bandwidth narrows, and a weak signal
; is no harder to dig out than it was. At 15 the added noise would raise the
; measured floor by 0.14 dB; at the default 26 it is about 0.01 dB.
;
; What varies is the saving, and it varies with the band rather than the
; setting: measured at 20 dB, about 60% on a quiet band but only 16% on one
; carrying strong broadcast carriers, because a strong signal in the passband
; forces a finer quantiser. Expect no useful saving above about 40.
;
; When to turn it off. It cannot be undone, so set min_margin=0 for IQ you
; intend to record, archive, or take absolute noise-floor measurements from: a
; hundredth of a decibel that moves with an ini setting is the kind of bias that
; poisons long-term comparisons, even though it is inaudible and costs no spots.
;
; Requires UberSDR 0.1.64 or later on the server. An older server ignores the
; parameter and streams losslessly rather than failing.
min_margin=26

[Calibration]
; Frequency offset in Hz - use this to correct systematic frequency errors
; If CW Skimmer spots are consistently off by a fixed amount, adjust this value
; Positive values shift frequencies higher, negative values shift lower
FrequencyOffset=0

; I/Q swap setting - controls whether I and Q channels are swapped
; Default: 1 (swap enabled)
swap_iq=1
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- img-src carries the map: OpenStreetMap's tile hosts, plus the data: URIs
         Leaflet's own stylesheet uses for its controls. Everything else stays on
         'self' — the page fetches nothing itself, the main process does. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org">
    <title>UberSDR — receivers</title>
    <link rel="stylesheet" href="chooser.css">
</head>
<body>
    <header>
        <div class="brand">
            <h1>UberSDR</h1>
            <span class="tagline">choose a receiver</span>
        </div>
        <form id="add-form" autocomplete="off">
            <input id="add-input" type="text" spellcheck="false"
                   placeholder="host, host:port or https://receiver.example.org">
            <button type="submit" id="add-btn">Connect</button>
        </form>
    </header>

    <div id="add-status" class="status" hidden></div>

    <nav class="tabs" role="tablist" aria-label="Where to find a receiver">
        <button id="tab-saved" class="tab" role="tab" aria-controls="panel-saved" aria-selected="false">
            Saved<span id="tab-saved-count" class="tab-count"></span>
        </button>
        <button id="tab-lan" class="tab" role="tab" aria-controls="panel-lan" aria-selected="false">
            Local network<span id="tab-lan-count" class="tab-count"></span>
        </button>
        <button id="tab-dir" class="tab" role="tab" aria-controls="panel-dir" aria-selected="false">
            Public directory<span id="tab-dir-count" class="tab-count"></span>
        </button>
        <label class="option" id="shared-prefs"
               title="On by default: every receiver opens with the same theme, layout, panels and shortcuts, and a change made in one carries over to receivers opened after it. Windows already open pick changes up when reloaded. Frequency, filter, squelch and volume always stay with each receiver. Turn this off to give every receiver settings of its own — nothing is discarded either way.">
            <input type="checkbox" id="shared-prefs-box" checked>
            <span>Share settings between receivers</span>
        </label>
    </nav>

    <main>
        <section id="panel-saved" class="panel" role="tabpanel" aria-labelledby="tab-saved" hidden>
            <div class="section-head">
                <h2>Saved receivers</h2>
                <select id="saved-sort" title="What comes first in this list">
                    <option value="used">most visited</option>
                    <option value="recent">most recent</option>
                </select>
            </div>
            <div id="saved-list" class="list"></div>
            <div id="saved-empty" class="empty" hidden>Receivers you connect to appear here.</div>
        </section>

        <section id="panel-lan" class="panel" role="tabpanel" aria-labelledby="tab-lan" hidden>
            <div class="section-head">
                <h2>Local network</h2>
                <button id="lan-scan" class="ghost">Scan</button>
                <span id="lan-status" class="section-status"></span>
            </div>
            <div id="lan-list" class="list"></div>
        </section>

        <section id="panel-dir" class="panel" role="tabpanel" aria-labelledby="tab-dir" hidden>
            <div class="dir-layout">
                <div class="dir-column">
                    <div class="dir-toolbar">
                        <input id="dir-filter" type="text" spellcheck="false" autocomplete="off"
                               placeholder="Filter by callsign, name or place…">
                        <div class="sort-row">
                            <span class="sort-label">Sort</span>
                            <button id="dir-sort-distance" class="chip" data-sort="distance">Distance</button>
                            <button id="dir-sort-listeners" class="chip" data-sort="listeners">Free slots</button>
                            <button id="dir-sort-snr" class="chip" data-sort="snr">Conditions</button>
                            <button id="dir-sort-name" class="chip" data-sort="name">Name</button>
                            <button id="dir-refresh" class="ghost icon-btn" title="Refresh the directory">⟳</button>
                        </div>
                    </div>
                    <div id="dir-list" class="list dir-list"></div>
                    <div id="dir-status" class="section-status dir-status"></div>
                </div>

                <div class="dir-map-column">
                    <div id="dir-map" class="map"></div>
                    <div id="map-fallback" class="empty" hidden>
                        No map: the Leaflet bundle is not staged — run build.sh.
                    </div>
                    <div class="map-foot">
                        <span id="home-status" class="section-status"></span>
                        <button id="home-set" class="ghost" type="button">Set my location…</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="footer"></footer>

    <script src="chooser.js"></script>
</body>
</html>

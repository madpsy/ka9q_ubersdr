<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- img-src carries the map: OpenStreetMap's tile hosts, plus the data: URIs
         Leaflet's own stylesheet uses for its controls. Everything else stays on
         'self' — the page fetches nothing itself, the main process does. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org">
    <title>UberSDR — receivers</title>
    <link rel="stylesheet" href="chooser.css">
</head>
<body>
    <header>
        <div class="brand">
            <!-- The mark, and the way to the project. Staged beside this file
                 by build.sh (generated, git-ignored) rather than committed a
                 second time — clients/electron/assets/icon.png is the one copy.

                 An ordinary link: both hosts send an external URL to the
                 system browser rather than loading it here — Electron through
                 setWindowOpenHandler and will-navigate (main.js), Android
                 through Capacitor's launchIntent — so neither needs telling
                 that a chooser window is not a browser. -->
            <a class="mark" href="https://ubersdr.org" target="_blank" rel="noopener"
               title="ubersdr.org">
                <img src="icon.png" alt="UberSDR" width="26" height="26">
            </a>
            <h1>UberSDR</h1>
            <span class="tagline">choose a receiver</span>
        </div>
        <!-- Settings, at the far end of the header rather than in a tab: none
             of it is about finding a receiver, and all of it is about what
             happens after you have. -->
        <button id="settings-open" class="ghost icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <!-- Every panel's Connect reports here, not only the Custom tab's, so it
         stays outside all of them: a receiver that refuses from the Saved list
         must be able to say so without the reason being inside a tab that is
         shut. -->
    <div id="add-status" class="status" hidden></div>

    <nav class="tabs" role="tablist" aria-label="Where to find a receiver">
        <button id="tab-saved" class="tab" role="tab" aria-controls="panel-saved" aria-selected="false">
            Saved<span id="tab-saved-count" class="tab-count"></span>
        </button>
        <button id="tab-dir" class="tab" role="tab" aria-controls="panel-dir" aria-selected="false">
            Public directory<span id="tab-dir-count" class="tab-count"></span>
        </button>
        <button id="tab-lan" class="tab" role="tab" aria-controls="panel-lan" aria-selected="false">
            Local network<span id="tab-lan-count" class="tab-count"></span>
        </button>
        <button id="tab-custom" class="tab" role="tab" aria-controls="panel-custom" aria-selected="false">
            Custom<span id="tab-custom-count" class="tab-count"></span>
        </button>
    </nav>

    <main>
        <section id="panel-saved" class="panel" role="tabpanel" aria-labelledby="tab-saved" hidden>
            <div class="section-head">
                <h2>Saved receivers</h2>
                <select id="saved-sort" title="What comes first in this list">
                    <option value="used">most visited</option>
                    <option value="recent">most recent</option>
                </select>
            </div>
            <div id="saved-list" class="list"></div>
        </section>

        <section id="panel-lan" class="panel" role="tabpanel" aria-labelledby="tab-lan" hidden>
            <div class="section-head">
                <h2>Local network</h2>
                <button id="lan-scan" class="ghost">Scan</button>
                <span id="lan-status" class="section-status"></span>
            </div>
            <div id="lan-list" class="list"></div>
        </section>

        <!-- An address typed in by hand: the fourth place a receiver can come
             from, and a tab like the other three rather than a form above them
             all. It was in the header, which said "type an address" to everyone
             who opened the app and mostly meant "not this" — the three lists
             answer the question far more often than the box does. -->
        <section id="panel-custom" class="panel" role="tabpanel" aria-labelledby="tab-custom" hidden>
            <div class="section-head">
                <h2>Connect by address</h2>
            </div>
            <form id="add-form" autocomplete="off">
                <input id="add-input" type="text" spellcheck="false"
                       placeholder="host, host:port or https://receiver.example.org">
                <button type="submit" id="add-btn">Connect</button>
            </form>
            <p class="empty">
                A hostname on its own is tried over HTTPS, then plain HTTP on
                port 80 and 8080. A receiver that answers is saved, and appears
                under Saved from then on.
            </p>
        </section>

        <section id="panel-dir" class="panel" role="tabpanel" aria-labelledby="tab-dir" hidden>
            <div class="dir-layout">
                <div class="dir-column">
                    <div class="dir-toolbar">
                        <input id="dir-filter" type="text" spellcheck="false" autocomplete="off"
                               placeholder="Filter by callsign, name or place…">
                        <!-- No "Sort" label: four chips in a row, one of them
                             always lit, is already a sort control, and the word
                             cost a chip's worth of width on a phone.

                             The lit one carries an arrow saying which way it
                             runs, and pressing it again turns it round. Neither
                             the arrow nor the tooltip is written here: both come
                             from setDirSort, which is the one place that knows
                             which chip is lit and which way it is pointing. -->
                        <div class="sort-row">
                            <button id="dir-sort-distance" class="chip" data-sort="distance">Distance</button>
                            <button id="dir-sort-listeners" class="chip" data-sort="listeners">Users</button>
                            <button id="dir-sort-snr" class="chip" data-sort="snr">Conditions</button>
                            <button id="dir-sort-name" class="chip" data-sort="name">Name</button>
                            <button id="dir-refresh" class="ghost icon-btn" title="Refresh the directory">⟳</button>
                        </div>
                    </div>
                    <!-- Fills as the list is pulled down past its top — see
                         pullToRefresh. Outside #dir-list rather than in it
                         because renderDirectory replaces that element's whole
                         contents on every draw, and aria-hidden because it is
                         feedback on a gesture: whoever cannot see it cannot have
                         made it, and "Refreshing…" is already on the status line
                         under the list. -->
                    <div id="dir-pull" class="pull" aria-hidden="true"></div>
                    <div id="dir-list" class="list dir-list"></div>
                    <div id="dir-status" class="section-status dir-status"></div>
                </div>

                <div class="dir-map-column">
                    <div id="dir-map" class="map"></div>
                    <div id="map-fallback" class="empty" hidden>
                        No map: the Leaflet bundle is not staged — run build.sh.
                    </div>
                    <div class="map-foot">
                        <span id="home-status" class="section-status"></span>
                        <button id="home-set" class="ghost" type="button">Set my location…</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="chooser.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
    <title>Select serial port</title>
    <!-- The chooser's palette and control styles, so the two windows are
         recognisably the same application. serial.css adds only the list. -->
    <link rel="stylesheet" href="../chooser/chooser.css">
    <link rel="stylesheet" href="serial.css">
</head>
<body class="serial">
    <header>
        <div class="brand">
            <h1>Select serial port</h1>
            <span class="tagline" id="subtitle">choose the device to hand to the receiver page</span>
        </div>
    </header>

    <main>
        <div id="port-list" class="list" role="listbox" aria-label="Serial ports"></div>
        <div id="port-empty" class="empty" hidden>
            No serial ports found. Plug the device in — this list updates on its own.
        </div>
    </main>

    <footer>
        <span id="hint">Enter connects · Esc cancels</span>
        <button id="cancel" class="ghost">Cancel</button>
    </footer>

    <script src="serial.js"></script>
</body>
</html>

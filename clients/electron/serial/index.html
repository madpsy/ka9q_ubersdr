<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
    <title>Select serial port</title>
    <!-- The chooser's palette and control styles, so the two windows are
         recognisably the same application. serial.css adds only the list. -->
    <link rel="stylesheet" href="../chooser/chooser.css">
    <link rel="stylesheet" href="serial.css">
</head>
<body class="serial">
    <header>
        <div class="brand">
            <!-- Reworded from serial.js when the picker is for a USB (HID)
                 device instead; serial is the default so the first paint is
                 right for the common case. -->
            <h1 id="heading">Select a serial port</h1>
            <!-- Filled in from the request: which page asked, and how many
                 devices are attached. Empty until then rather than carrying
                 placeholder text that flashes and is replaced. -->
            <span class="tagline" id="subtitle"></span>
        </div>
    </header>

    <main>
        <!-- Always present rather than appearing once the list is long enough:
             a box that materialises because somebody plugged a dongle in shifts
             the list down under the pointer, mid-decision. -->
        <div class="filter">
            <input id="filter" type="text" autocomplete="off" spellcheck="false"
                   placeholder="Filter by name, path or USB ID" aria-label="Filter devices"
                   aria-controls="port-list">
        </div>

        <!-- One listbox, driven by the arrow keys, with the selection held on
             the container rather than on whichever row happens to have focus. -->
        <div id="port-list" class="list" role="listbox" tabindex="0" aria-label="Devices"></div>
        <!-- Two different nothings — no devices at all, and none matching what
             was typed — so the text is written from serial.js. -->
        <div id="port-empty" class="empty" hidden>
            <div class="empty-title" id="empty-title"></div>
            <div class="empty-body" id="empty-body"></div>
        </div>
    </main>

    <footer>
        <span id="hint"></span>
        <button id="cancel" type="button" class="ghost">Cancel</button>
        <button id="connect" type="button" disabled>Connect</button>
    </footer>

    <script src="serial.js"></script>
</body>
</html>

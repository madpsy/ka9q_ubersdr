                    const dist = Math.hypot(dx, dy);
                    if (dist < 12) { // 12px threshold = tap
                        // Map canvas fraction linearly across the visible Hz range (1 Hz resolution)
                        const startHz = this.meta.start + this.zoomStart * (this.meta.end - this.meta.start);
                        const endHz   = this.meta.start + this.zoomEnd   * (this.meta.end - this.meta.start);
                        const freqHz  = Math.round(startHz + ts.frac * (endHz - startHz));
                        startAudioAt(freqHz, this.name);
                    }
                }
                this._touchTapStart = null;
                this._touchPanLast  = null;
            }
        };

        stack.addEventListener('touchstart', onTouchStart, { passive: false });
        stack.addEventListener('touchmove',  onTouchMove,  { passive: false });
        stack.addEventListener('touchend',   onTouchEnd);
    }

    // Called by SSE decoder with new float32 dBFS array
    applyFrame(data, flags) {
        const binCount = this.meta.bin_count;

        if (flags === 0x03) {
            // Full uint8 frame
            if (data.length !== binCount) return;
            if (!this.bins || this.bins.length !== binCount) {
                this.bins = new Uint8Array(binCount);
            }
            this.bins.set(data);
        } else if (flags === 0x04) {
            // Delta uint8 frame
            if (!this.bins) return; // need full frame first
            // data is a Uint8Array of [idx_lo, idx_hi, val] triples
            const count = (data[0] | (data[1] << 8));
            for (let i = 0; i < count; i++) {
                const off = 2 + i * 3;
                const idx = data[off] | (data[off+1] << 8);
                const val = data[off+2];
                if (idx < this.bins.length) this.bins[idx] = val;
            }
        } else {
            return;
        }

        // Commit here, on the arrival itself, rather than from the render loop.
        // Deferring to rAF meant a boolean "new data" flag: if two frames landed
        // between two animation frames the first was silently coalesced away, so
        // the measured inter-arrival gap doubled and the interpolation clock
        // drifted off the real data rate.  Committing on arrival makes the two
        // rates independent — a slow frame can drop a *render*, never a sample.
        this._commitFrame();
        this.dirty = true;
    }

    _startRenderLoop() {
        const loop = () => {
            // Re-colour the cached waterfall if the palette changed.
            if (this._wfPaletteVersion !== _paletteVersion) {
                this._wfPaletteVersion = _paletteVersion;
                this._rebuildWfCache();
                this.dirty = true;
            }
            // Render every frame while interpolating between arrivals; once the
            // trace has settled on the latest frame there is nothing to animate,
            // so fall back to drawing only when something marks us dirty.
            const animating = this._interpFrac() < 1;
            if (this.dirty || animating) {
                this._draw();
                this.dirty = false;
            }
            this.animFrame = requestAnimationFrame(loop);
        };
        this.animFrame = requestAnimationFrame(loop);
    }

    // ── Effective dB range for this panel ────────────────────────────────────
    // Manual mode uses the shared inputs; auto mode uses this band's own
    // computed range, falling back to the shared values until it has settled.
    get dbLo() {
        return (dbAuto && this._autoMin !== null) ? this._autoMin : dbMin;
    }
    get dbHi() {
        if (!dbAuto || this._autoMax === null) return dbMax;
        // The minimum span is enforced here rather than inside the smoothing, so
        // changing it takes effect on the very next frame without perturbing the
        // EMA — and so it always widens upward, leaving the floor where it is.
        return Math.max(this._autoMax, this._autoMin + dbAutoMinSpan);
    }

    // Recompute this band's auto range from the sorted frame.  Returns true if
    // the *applied* range actually moved, which forces a cache repaint.
    _updateAutoRange(sorted, n, now) {
        const pct = f => sorted[Math.min(n - 1, Math.max(0, Math.round(f * (n - 1))))];
        const noise  = pct(AUTO_NOISE_PCT);
        const strong = pct(AUTO_SIGNAL_PCT);

        // The floor is the anchor: placed just under the noise, then left alone.
        // Only the signal ceiling is tracked here — the guaranteed minimum span
        // is applied by the dbHi accessor, so it can never drag the floor up.
        let tMin = noise - AUTO_NOISE_MARGIN;
        tMin = Math.max(-160, Math.min(-40, tMin));
        const tMax = Math.min(0, strong + AUTO_HEADROOM);

        // Long EMA — this is what stops the scale chasing traffic.
        if (this._autoMinEma === null) {
            this._autoMinEma = tMin;
            this._autoMaxEma = tMax;
        } else {
            this._autoMinEma += (tMin - this._autoMinEma) * AUTO_EMA;
            this._autoMaxEma += (tMax - this._autoMaxEma) * AUTO_EMA;
        }

        // Seed immediately on the first frame so there is no visible settling
        // ramp when auto mode is switched on.
        if (this._autoMin === null) {
            this._autoMin = Math.round(this._autoMinEma / AUTO_STEP) * AUTO_STEP;
            this._autoMax = Math.round(this._autoMaxEma / AUTO_STEP) * AUTO_STEP;
            this._autoLastChange = now;
            return true;
        }

        // Hysteresis: only move once the smoothed target has drifted past the
        // deadband, and then only by one step toward it.  Walking rather than
        // snapping is what bounds the slew rate — a large genuine shift is
        // tracked as a slow glide instead of one visible jump.  The deadband
        // exceeds the step, so the residual after a move cannot re-trigger one
        // and the range settles instead of oscillating.
        if (now - this._autoLastChange < AUTO_MIN_INTERVAL) return false;
        const stepToward = (applied, target) =>
            applied + Math.sign(target - applied) * AUTO_STEP;

        let changed = false;
        if (Math.abs(this._autoMinEma - this._autoMin) >= AUTO_DEADBAND) {
            this._autoMin = stepToward(this._autoMin, this._autoMinEma);
            changed = true;
        }
        if (Math.abs(this._autoMaxEma - this._autoMax) >= AUTO_DEADBAND) {
            this._autoMax = stepToward(this._autoMax, this._autoMaxEma);
            changed = true;
        }
        if (changed) this._autoLastChange = now;
        return changed;
    }

    // Progress [0,1] through the current inter-arrival gap.
    _interpFrac() {
        if (_reduceMotion || !this._lastRowTime) return 1;
        const dt = Date.now() - this._lastRowTime;
        return Math.max(0, Math.min(1, dt / this._rowPeriod));
    }

    // Smoothstep — eases in and out of each data frame so the trace doesn't
    // change direction abruptly at arrival boundaries.
    _ease(t) { return t * t * (3 - 2 * t); }

    // ── Commit one arrived data frame ────────────────────────────────────────
    // Everything that must happen exactly once per arrival lives here: stats,
    // peak-hold, waterfall history and the offscreen row write.  The per-frame
    // renderer stays cheap because none of this runs at display rate.
    _commitFrame() {
        const bins = this.bins;
        if (!bins) return;
        const n = bins.length;

        // ── Roll current → previous ──────────────────────────────────────────
        // The new baseline is where the trace *actually is right now*, not the
        // previous frame's target.  Those differ whenever the gap came in
        // shorter than the estimate: the blend is still short of 1, so resetting
        // the baseline to the old target teleports the trace forward by the
        // remainder.  Under ordinary jitter that happens on most frames, which
        // is what made every band appear to bounce.  Continuing from the
        // displayed value makes the trace continuous by construction — a wrong
        // period estimate can then only make it lag, never jump.
        if (!this._curVals || this._curVals.length !== n) {
            this._prevVals = new Float32Array(n);
            this._curVals  = new Float32Array(n);
            this._lerpVals = new Float32Array(n);
            for (let i = 0; i < n; i++) this._curVals[i] = bins[i] - 256;
            this._prevVals.set(this._curVals);
        } else {
            // Uses the old _lastRowTime — must run before the timing block below.
            const held = this._ease(this._interpFrac());
            if (held >= 1) {
                this._prevVals.set(this._curVals);
            } else {
                const prev = this._prevVals, cur = this._curVals;
                for (let i = 0; i < n; i++) prev[i] += (cur[i] - prev[i]) * held;
            }
        }
        for (let i = 0; i < n; i++) this._curVals[i] = bins[i] - 256;

        // ── Inter-arrival period ─────────────────────────────────────────────
        // This is the interpolation clock, so a wrong value shows up as *level*
        // error: too long and the trace never finishes travelling to the real
        // value before the next frame resets its baseline, which reads as every
        // band bouncing.  So only plausible gaps update it.  A gap far from the
        // running estimate is a stall, a scheduling hiccup or a throttled tab —
        // folding those in is what poisoned the old EMA.
        const now = Date.now();
        const gap = this._lastRowTime ? (now - this._lastRowTime) : null;
        this._lastRowTime = now;

        if (gap !== null && gap >= ROW_PERIOD_MIN && gap <= ROW_PERIOD_MAX) {
            if (!this._rowPeriodSeeded) {
                this._rowPeriod = gap;          // first real measurement
                this._rowPeriodSeeded = true;
                this._rowOutliers = 0;
            } else if (gap >= this._rowPeriod * 0.6 && gap <= this._rowPeriod * 1.7) {
                this._rowPeriod += (gap - this._rowPeriod) * 0.2;
                this._rowOutliers = 0;
            } else if (++this._rowOutliers >= 4) {
                // Persistently outside the window — the real rate has changed
                // (server reconfigured, or we settled on a wrong value), so
                // re-seed instead of rejecting for ever.
                this._rowPeriod = gap;
                this._rowOutliers = 0;
            }
        }
        this._rowPeriod = Math.max(ROW_PERIOD_MIN, Math.min(ROW_PERIOD_MAX, this._rowPeriod));

        // (No explicit catch-up after a stall is needed: a long gap drives the
        // blend above to 1, so the baseline already equals the last frame.)

        // Stats over the full band, written straight to the DOM — once per
        // arrival, so the render loop never touches layout.
        const sorted = Float32Array.from(this._curVals).sort();
        this._statP5   = sorted[Math.floor(n * 0.05)];
        this._statPeak = sorted[n - 1];
        const elP5   = document.getElementById(`stat-p5-${this.name}`);
        const elPeak = document.getElementById(`stat-peak-${this.name}`);
        if (elP5)   elP5.textContent   = this._statP5.toFixed(1);
        if (elPeak) elPeak.textContent = this._statPeak.toFixed(1);

        // ── Auto dB range ────────────────────────────────────────────────────
        // Always tracked, even in manual mode, so the smoothing is already
        // settled if auto gets switched on.
        const rangeMoved = this._updateAutoRange(sorted, n, now);
        if (rangeMoved && dbAuto) this._rangeChanged();

        // ── Peak-hold buffer ─────────────────────────────────────────────────
        if (!this._peakHold || this._peakHold.length !== n) {
            this._peakHold    = new Float32Array(n).fill(-256);
            this._peakHoldAge = new Uint16Array(n);
        }
        for (let i = 0; i < n; i++) {
            const v = this._curVals[i];
            if (v >= this._peakHold[i]) {
                this._peakHold[i]    = v;
                this._peakHoldAge[i] = 0;
            } else {
                this._peakHoldAge[i]++;
                if (this._peakHoldAge[i] > this._peakHoldMax) {
                    this._peakHold[i]    = v;
                    this._peakHoldAge[i] = 0;
                }
            }
        }
        this._peaksZoomKey = ''; // force marker recompute on the next draw

        // ── Waterfall history + offscreen row ────────────────────────────────
        // Build the cache *before* pushing, so that if it has to repaint from
        // history it does not also paint the row we are about to write into the
        // ring — which would show the newest row twice and shift everything.
        this._ensureWfCache(n);

        // History holds raw dBFS, not normalised levels.  Normalising at write
        // time would bake the current range into the stored rows, so any later
        // range change (auto or manual) would leave a visible seam between old
        // and new rows.  Keeping it raw lets the whole waterfall be re-coloured.
        const rowData = new Float32Array(this._curVals);
        this.waterfallRows.push(rowData);
        this.waterfallTimes.push(now);
        if (this.waterfallRows.length > this.maxRows) {
            this.waterfallRows.shift();
            this.waterfallTimes.shift();
        }

        // Ring grows upward: the newest row sits one slot *above* the previous
        // head, so display order (newest first) is simply head → end → wrap.
        this._wfHead = (this._wfHead - 1 + this.maxRows) % this.maxRows;
        this._writeWfRow(rowData, this._wfHead);

        this._computeTickPositions(now);
    }

    // ── Waterfall time-axis tick positions ───────────────────────────────────
    // Recomputed once per real arrival from the rows' actual timestamps, which
    // gives an exact position — but "exact" still means it reflects genuine
    // jitter in real inter-arrival gaps, and rows can arrive every ~100ms.
    // Recomputing and redrawing at that raw value every arrival means the tick
    // visibly shifts up to ~10 times a second, which reads as jumping even
    // though each individual value is correct.  So the raw measurement is
    // fed through a slow low-pass filter (_tickSmoothed) keyed by tick label;
    // the render loop only ever draws the smoothed value, which settles down
    // and stops moving once the real arrival rate is steady, and only drifts
    // if the rate genuinely changes.  No per-frame term at all — the display
    // only updates on arrival, per the requirement that once it settles it
    // should stop adjusting.
    _computeTickPositions(now) {
        const times  = this.waterfallTimes;
        const nRows  = times.length;
        const positions = [];
        if (nRows > 1) {
            const tickStep = 10; // seconds between ticks
            const rowAge = new Float64Array(nRows);
            for (let r = 0; r < nRows; r++) {
                rowAge[r] = (now - times[nRows - 1 - r]) / 1000;
            }
            // rowAge[0] = age of newest row, rowAge[nRows-1] = oldest
            if (!this._tickSmoothed) this._tickSmoothed = new Map();
            let nextTick = tickStep;
            for (let r = 1; r < nRows && nextTick <= rowAge[nRows - 1] + tickStep; r++) {
                if (rowAge[r] >= nextTick) {
                    const ageA = rowAge[r - 1];
                    const ageB = rowAge[r];
                    const tf = (ageB > ageA) ? (nextTick - ageA) / (ageB - ageA) : 0;
                    const target = r - 1 + tf;

                    const prev = this._tickSmoothed.get(nextTick);
                    const smoothed = (prev === undefined) ? target : prev + (target - prev) * 0.1;
                    this._tickSmoothed.set(nextTick, smoothed);

                    positions.push({ nextTick, rowPos: smoothed });
                    nextTick += tickStep;
                }
            }
            // Drop smoothing state for ticks that have scrolled out of range,
            // so they don't linger and reappear stale if they come back.
            for (const key of this._tickSmoothed.keys()) {
                if (!positions.some(p => p.nextTick === key)) this._tickSmoothed.delete(key);
            }
        }
        this._tickPositions = positions;
    }

    // Allocate/resize the offscreen ring buffer for a given bin count.
    _ensureWfCache(n) {
        if (this._wfOff && this._wfOff.width === n) return;
        this._wfOff    = document.createElement('canvas');
        this._wfOff.width  = n;
        this._wfOff.height = this.maxRows;
        this._wfOffCtx = this._wfOff.getContext('2d', { willReadFrequently: false });
        // Unwritten rows read as opaque black rather than transparent.
        this._wfOffCtx.fillStyle = '#000';
        this._wfOffCtx.fillRect(0, 0, n, this.maxRows);
        this._wfRowPx  = this._wfOffCtx.createImageData(n, 1);
        this._wfRowBuf = new Uint32Array(this._wfRowPx.data.buffer);
        this._wfHead   = 0;
        this._wfPaletteVersion = _paletteVersion;
        this._wfInterKey = '';   // intermediate buffer is now stale
        // Re-fill from whatever history we already have.
        this._paintWfHistory();
    }

    // Colour one row of raw dBFS into the ring buffer at row index `y`,
    // normalising against the panel's current range.
    _writeWfRow(rowData, y) {
        // History can briefly hold rows from a previous bin count.
        if (rowData.length !== this._wfOff.width) return;
        const lo    = this.dbLo;
        const range = this.dbHi - lo || 1;
        const buf   = this._wfRowBuf;
        for (let i = 0; i < rowData.length; i++) {
            const norm = (rowData[i] - lo) / range;
            buf[i] = CMAP[norm <= 0 ? 0 : norm >= 1 ? 255 : Math.round(norm * 255)];
        }
        this._wfOffCtx.putImageData(this._wfRowPx, 0, y);
    }

    // The dB range moved — re-colour the whole waterfall from raw history so
    // old and new rows share one scale, and force a redraw.
    _rangeChanged() {
        this._rebuildWfCache();
        this.dirty = true;
    }

    // Repaint every stored row into the ring buffer (newest at head).
    // Composed as one full-height ImageData and blitted once — this runs on
    // every auto-range step, and doing it as maxRows separate putImageData
    // calls made for a long frame at exactly the wrong moment.
    _paintWfHistory() {
        if (!this._wfOff) return;
        const n    = this._wfOff.width;
        const rows = this.waterfallRows;
        const img  = this._wfOffCtx.createImageData(n, this.maxRows);
        const buf  = new Uint32Array(img.data.buffer);
        buf.fill(0xFF000000);          // opaque black for rows we have no data for

        const lo    = this.dbLo;
        const range = (this.dbHi - lo) || 1;
        for (let r = rows.length - 1, y = 0; r >= 0 && y < this.maxRows; r--, y++) {
            const src = rows[r];
            if (src.length !== n) continue;   // row from a previous bin count
            const base = y * n;
            for (let i = 0; i < n; i++) {
                const norm = (src[i] - lo) / range;
                buf[base + i] = CMAP[norm <= 0 ? 0 : norm >= 1 ? 255 : Math.round(norm * 255)];
            }
        }
        this._wfOffCtx.putImageData(img, 0, 0);
        this._wfHead = 0;
    }

    // Palette or dB range changed — re-colour the cache from stored raw rows.
    _rebuildWfCache() {
        if (!this._wfOff) return;
        this._paintWfHistory();          // repaints the full bitmap, blanks included
        this._wfInterKey = '';           // colours changed under the same head
    }

    // ── Palette-matched trace gradients ──────────────────────────────────────
    // Vertical gradients spanning the canvas.  Because y position *is* dB level,
    // stroking the trace with one gives every point the colour that same level
    // has in the waterfall — peaks glow in the palette's hot end, the noise floor
    // sits in its cold end — without per-sample colour changes while drawing.
    // Rebuilt only when the height or the palette changes.
    _ensureTraceGradients(h) {
        const key = `${h},${_paletteVersion}`;
        if (this._traceKey === key) return;
        this._traceKey = key;

        const ctx  = this.specCtx;
        const line = ctx.createLinearGradient(0, 0, 0, h);
        const fill = ctx.createLinearGradient(0, 0, 0, h);
        const N = 24;
        for (let i = 0; i < N; i++) {
            const p   = i / (N - 1);            // 0 = top of canvas = loudest
            const idx = Math.round((1 - p) * 255);
            line.addColorStop(p, _traceColor(idx, 1));
            // Keep the wash subtle at the noise floor and stronger over signal,
            // matching the alpha ramp the fixed blue fill used to have.
            fill.addColorStop(p, _traceColor(idx, 0.35 * (1 - p) + 0.02));
        }
        this._lineGrad = line;
        this._fillGrad = fill;
    }

    // Cached spectrum background: opaque panel fill + adaptive dB grid + labels.
    // Rebuilt only when the canvas size or the dB range changes.
    _ensureSpecBg(w, h, dMin, dMax, dRange) {
        const key = `${w},${h},${dMin},${dMax}`;
        if (this._specBgKey === key) return this._specBg;
        this._specBgKey = key;

        if (!this._specBg) this._specBg = document.createElement('canvas');
        const bg = this._specBg;
        bg.width  = w;
        bg.height = h;
        const ctx = bg.getContext('2d');

        // Opaque base — matches .spectrum-canvas's CSS background.
        ctx.fillStyle = '#0a0a0f';
        ctx.fillRect(0, 0, w, h);

        // Adaptive grid
        const niceSteps = [5, 10, 20, 25, 50, 100];
        let labelStep = niceSteps[niceSteps.length - 1];
        for (const s of niceSteps) {
            if (dRange / s <= 5) { labelStep = s; break; }
        }
        const minorStep = Math.max(5, labelStep / 2);

        ctx.font = '10px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'bottom';

        for (let db = Math.ceil(dMin / minorStep) * minorStep; db <= dMax; db += minorStep) {
            const y = h - ((db - dMin) / dRange) * h;
            const isMajor = (db % labelStep === 0);
            ctx.strokeStyle = isMajor ? '#222233' : '#161622';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
            if (isMajor && y < h - 2) {
                const label = `${db}`;
                const tw = ctx.measureText(label).width;
                ctx.fillStyle = 'rgba(10,10,15,0.65)';
                ctx.fillRect(2, y - 13, tw + 4, 12);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(label, 4, y - 2);
            }
        }
        return bg;
    }

    // ── Find top-3 local maxima in the held spectrum ─────────────────────────
    // Minimum separation: 2.5 kHz expressed in bins of the zoomed slice.
    // bin_bandwidth is Hz per bin in the full array; zn covers the zoomed
    // fraction of the full band, so scale accordingly.
    _findPeaks(n, binStart, zn, p5) {
        if (!this._peakHold) return [];
        const hzPerZoomedBin = this.meta.bin_bandwidth * (n / zn);
        const minSepBins = Math.max(4, Math.round(2500 / hzPerZoomedBin));
        const threshold  = p5 + 15;

        // Box-smooth with radius = half the minimum separation so we merge
        // adjacent bins of the same signal without washing out narrow peaks.
        // This keeps the FT8 cluster (3 kHz wide) detectable at full zoom.
        const smoothR = Math.max(1, Math.floor(minSepBins / 2));
        const smoothed = new Float32Array(zn);
        for (let i = 0; i < zn; i++) {
            let sum = 0, cnt = 0;
            for (let j = Math.max(0, i - smoothR); j <= Math.min(zn - 1, i + smoothR); j++) {
                sum += this._peakHold[binStart + j]; cnt++;
            }
            smoothed[i] = sum / cnt;
        }

        const candidates = [];
        for (let i = 1; i < zn - 1; i++) {
            const db = smoothed[i];
            if (db < threshold) continue;
            if (db >= smoothed[i - 1] && db >= smoothed[i + 1]) {
                candidates.push({ i, db });
            }
        }
        candidates.sort((a, b) => b.db - a.db);
        const peaks = [];
        for (const c of candidates) {
            if (peaks.length >= 3) break;
            if (!peaks.some(p => Math.abs(p.i - c.i) < minSepBins)) peaks.push(c);
        }
        return peaks;
    }

    _draw() {
        if (!this.bins || !this._curVals) return;
        const w = this.specCanvas.width;
        const h = this.specCanvas.height;
        if (w === 0 || h === 0) return;

        const bins   = this.bins;
        const n      = bins.length;
        const dMin   = this.dbLo;
        const dMax   = this.dbHi;
        const dRange = dMax - dMin;

        // ── Zoomed bin range ──────────────────────────────────────────────────
        const zs       = this.zoomStart;
        const ze       = this.zoomEnd;
        const binStart = Math.round(zs * (n - 1));
        const binEnd   = Math.round(ze * (n - 1));
        const zn       = Math.max(2, binEnd - binStart + 1);

        // ── Spectrum line graph ───────────────────────────────────────────────
        // The dB grid and its labels depend only on size and dB range, so they
        // are cached as an opaque background layer.  Blitting it both clears the
        // previous frame's trace and draws the grid, which keeps text rendering
        // off the per-frame path.
        const sCtx = this.specCtx;
        sCtx.drawImage(this._ensureSpecBg(w, h, dMin, dMax, dRange), 0, 0);
        this._ensureTraceGradients(h);

        // ── Interpolated dBFS values ──────────────────────────────────────────
        // Blend the previous arrival into the current one across the measured
        // inter-arrival gap.  At 4 Hz data this turns a stepped trace into a
        // continuous one without inventing detail — every keyframe is real.
        const blend = this._ease(this._interpFrac());
        const vals = this._lerpVals;
        const prev = this._prevVals, cur = this._curVals;
        if (blend >= 1) {
            vals.set(cur);
        } else {
            for (let i = 0; i < n; i++) vals[i] = prev[i] + (cur[i] - prev[i]) * blend;
        }

        // Stats — computed once per arrival, not per frame
        const p5   = this._statP5   !== null ? this._statP5   : 0;
        const peak = this._statPeak !== null ? this._statPeak : 0;

        // Spectrum fill — zoomed slice
        sCtx.beginPath();
        for (let i = 0; i < zn; i++) {
            const x  = (i / (zn - 1)) * w;
            const db = Math.max(dMin, Math.min(dMax, vals[binStart + i]));
            const y  = h - ((db - dMin) / dRange) * h;
            if (i === 0) sCtx.moveTo(x, y);
            else         sCtx.lineTo(x, y);
        }
        sCtx.lineTo(w, h);
        sCtx.lineTo(0, h);
        sCtx.closePath();
        sCtx.fillStyle = this._fillGrad;
        sCtx.fill();

        // Line on top
        sCtx.beginPath();
        for (let i = 0; i < zn; i++) {
            const x  = (i / (zn - 1)) * w;
            const db = Math.max(dMin, Math.min(dMax, vals[binStart + i]));
            const y  = h - ((db - dMin) / dRange) * h;
            if (i === 0) sCtx.moveTo(x, y);
            else         sCtx.lineTo(x, y);
        }
        sCtx.strokeStyle = this._lineGrad;
        sCtx.lineWidth = 1.2;
        sCtx.stroke();

        // Update stats
        // (written from _commitFrame — a DOM write per frame would be wasteful)

        // ── Top-3 local peak markers (peak-hold) ─────────────────────────────
        // Rather than tracking per-frame peaks (which flicker), we maintain a
        // rolling-max buffer over the last _peakHoldMax frames.  Each bin's
        // value decays by 1 frame of age per draw; a bin is only evicted once
        // it hasn't been the max for _peakHoldMax consecutive frames.
        // Peak detection runs on this stable buffer, not the raw noisy frame.
        // Gating the whole block (not just the drawing) also skips the detection
        // work while markers are switched off.  The peak-hold buffer itself keeps
        // updating in _commitFrame, so switching them back on is instant.
        if (showPeaks) {
            // Detection is driven by the peak-hold buffer (updated once per
            // arrival in _commitFrame) and by the zoom window, so it only needs
            // recomputing when one of those changes — not on every frame.
            const zoomKey = `${binStart},${zn}`;
            if (this._peaksZoomKey !== zoomKey) {
                this._peaksZoomKey = zoomKey;
                this._peaks = this._findPeaks(n, binStart, zn, p5);
            }
            const peaks = this._peaks;

            // ── Draw markers ──────────────────────────────────────────────────
            sCtx.save();
            for (const pk of peaks) {
                const x  = (pk.i / (zn - 1)) * w;
                const db = Math.max(dMin, Math.min(dMax, pk.db));
                const y  = h - ((db - dMin) / dRange) * h;

                // Faint vertical drop-line
                sCtx.strokeStyle = 'rgba(255,255,255,0.18)';
                sCtx.lineWidth   = 1;
                sCtx.setLineDash([2, 3]);
                sCtx.beginPath();
                sCtx.moveTo(x, y + 4);
                sCtx.lineTo(x, h);
                sCtx.stroke();
                sCtx.setLineDash([]);

                // Dot at peak tip
                sCtx.fillStyle = 'rgba(255,255,255,0.9)';
                sCtx.beginPath();
                sCtx.arc(x, y, 2.5, 0, Math.PI * 2);
                sCtx.fill();

                // Frequency label above dot
                const absHz = this.meta.start +
                    (this.zoomStart + (pk.i / (zn - 1)) * (this.zoomEnd - this.zoomStart)) *
                    (this.meta.end - this.meta.start);
                const label = (absHz / 1e6).toFixed(3);
                sCtx.font         = '8px monospace';
                sCtx.textBaseline = 'bottom';
                const tw = sCtx.measureText(label).width;
                let lx = x - tw / 2;
                if (lx < 2)          lx = x + 4;
                if (lx + tw > w - 2) lx = x - tw - 4;
                const ly = Math.max(10, y - 4);
                sCtx.fillStyle = '#ffffff';
                sCtx.fillText(label, lx, ly);
            }
            sCtx.restore();
        }

        // ── FT8 frequency highlight(s) ────────────────────────────────────────
        // Highlight the 3 kHz FT8 window (dial freq → dial+3 kHz, USB) for each
        // configured band. A named band has exactly one dial frequency
        // (meta.ft8_frequency); wideband spans every band at once, so it
        // carries a list instead (meta.ft8_markers, one {name, frequency} per
        // band with FT8 configured — see /api/noisefloor/config).
        const ft8List = this.meta.ft8_markers
            ? this.meta.ft8_markers
            : (this.meta.ft8_frequency > 0 ? [{ name: null, frequency: this.meta.ft8_frequency }] : []);

        if (ft8List.length > 0) {
            // Map Hz → canvas X the same way the user/audio cursor overlays do
            // (straight from meta.start/end and the zoom fraction) rather than
            // through bin indices — binStart/zn below are derived assuming
            // (n-1)-spaced bins, while bin_bandwidth is (end-start)/n, and
            // mixing the two conventions drifts further off the true dial
            // frequency the more bins there are (negligible on a ~1000-bin
            // per-band chart, ~2 kHz off on the 4096-bin wideband chart).
            const viewStartHz = this.meta.start + this.zoomStart * (this.meta.end - this.meta.start);
            const viewEndHz   = this.meta.start + this.zoomEnd   * (this.meta.end - this.meta.start);
            const viewSpanHz  = viewEndHz - viewStartHz;
            if (viewSpanHz <= 0) return;

            sCtx.save();
            for (const marker of ft8List) {
                const ft8Hz = marker.frequency;
                if (!ft8Hz || ft8Hz <= 0) continue;

                // Canvas X positions (clamped to visible area, floored to a
                // minimum visible width — see _clipHighlightX)
                const clipped = _clipHighlightX(
                    ((ft8Hz        - viewStartHz) / viewSpanHz) * w,
                    ((ft8Hz + 3000 - viewStartHz) / viewSpanHz) * w,
                    w);
                if (!clipped) continue;
                const [x1, x2] = clipped;

                // Shaded region
                sCtx.fillStyle = 'rgba(76,175,80,0.12)';
                sCtx.fillRect(x1, 0, x2 - x1, h);

                // Dial frequency vertical line
                sCtx.strokeStyle = 'rgba(76,175,80,0.6)';
                sCtx.lineWidth   = 1;
                sCtx.setLineDash([3, 3]);
                sCtx.beginPath();
                sCtx.moveTo(x1, 0);
                sCtx.lineTo(x1, h);
                sCtx.stroke();
                sCtx.setLineDash([]);

                // "FT8" label (with band name when there's more than one
                // marker on screen) at top, just right of the dial line
                sCtx.font         = '9px monospace';
                sCtx.textBaseline = 'top';
                sCtx.textAlign    = 'left';
                const label = marker.name ? `FT8 ${marker.name.toUpperCase()}` : 'FT8';
                const tw    = sCtx.measureText(label).width;
                const lx    = Math.min(x1 + 3, w - tw - 2);
                sCtx.fillStyle = 'rgba(0,0,0,0.55)';
                sCtx.fillRect(lx - 1, 1, tw + 4, 12);
                sCtx.fillStyle = 'rgba(255,255,255,0.9)';
                sCtx.fillText(label, lx + 1, 2);
            }
            sCtx.restore();
        }

        // ── Waterfall ─────────────────────────────────────────────────────────
        const wfW = this.wfCanvas.width;
        const wfH = this.wfCanvas.height;
        if (wfW === 0 || wfH === 0) return;

        const wfCtx = this.wfCtx;
        const rows  = this.waterfallRows;
        const nRows = rows.length;
        const maxR  = this.maxRows;
        const rowH  = wfH / maxR;

        if (!this._wfOff) this._ensureWfCache(n);

        // Intermediate buffer: the ring resampled horizontally to canvas width,
        // in display order (newest row first).  Kept at one pixel per data row
        // so the vertical stretch below is the only smoothed axis.
        if (!this._wfInter || this._wfInter.width !== wfW || this._wfInter.height !== maxR) {
            this._wfInter = document.createElement('canvas');
            this._wfInter.width  = wfW;
            this._wfInter.height = maxR;
            this._wfInterCtx = this._wfInter.getContext('2d');
        }
        const iCtx = this._wfInterCtx;
        const head = this._wfHead;

        // Pass 1 — horizontal only, smoothing OFF so carriers stay crisp.  The
        // zoom window falls out of the source rectangle for free.  Its result
        // only changes when a row arrives, the zoom moves or the canvas resizes,
        // so it is cached: the per-frame cost is then a single blit (pass 2).
        const interKey = `${head},${binStart},${zn},${wfW}`;
        if (this._wfInterKey !== interKey) {
            this._wfInterKey = interKey;
            iCtx.imageSmoothingEnabled = false;
            const count1 = maxR - head;
            iCtx.drawImage(this._wfOff, binStart, head, zn, count1, 0, 0, wfW, count1);
            if (head > 0) {
                iCtx.drawImage(this._wfOff, binStart, 0, zn, head, 0, count1, wfW, head);
            }
        }

        // Pass 2 — vertical stretch with smoothing ON, offset by how far we are
        // through the current inter-arrival gap.  Starting one row high means the
        // newest row slides down into place rather than popping in, which is what
        // removes the once-per-update jerk.
        const yOff = (this._interpFrac() - 1) * rowH;
        wfCtx.imageSmoothingEnabled = true;
        wfCtx.imageSmoothingQuality = 'high';
        wfCtx.drawImage(this._wfInter, 0, 0, wfW, maxR, 0, yOff, wfW, wfH);
        // The offset leaves up to one row uncovered at the bottom; repeat the
        // oldest row into it so no black sliver pulses along the bottom edge.
        if (yOff < 0) {
            wfCtx.drawImage(this._wfInter, 0, maxR - 1, wfW, 1,
                            0, yOff + wfH, wfW, rowH + 1);
        }

        // ── Waterfall time axis (left edge) ───────────────────────────────────
        // Tick row-positions are computed and smoothed once per real arrival
        // (_computeTickPositions, called from _commitFrame) — nothing here
        // depends on the current frame's time, so redrawing every frame just
        // re-paints the same, already-settled position until the next arrival
        // updates it.
        if (this._tickPositions.length) {
            wfCtx.save();
            wfCtx.font         = '9px monospace';
            wfCtx.textBaseline = 'middle';
            wfCtx.textAlign    = 'left';

            for (const { nextTick, rowPos } of this._tickPositions) {
                const y = Math.round(rowPos * rowH);

                wfCtx.strokeStyle = 'rgba(255,255,255,0.5)';
                wfCtx.lineWidth   = 1;
                wfCtx.beginPath();
                wfCtx.moveTo(0, y);
                wfCtx.lineTo(wfW, y);
                wfCtx.stroke();

                const label = `${nextTick}s`;
                const tw = wfCtx.measureText(label).width;
                wfCtx.fillStyle = 'rgba(0,0,0,0.65)';
                wfCtx.fillRect(1, y - 6, tw + 4, 12);
                wfCtx.fillStyle = 'rgba(255,255,255,0.9)';
                wfCtx.fillText(label, 3, y);
            }
            wfCtx.restore();
        }

        // ── Listener markers ──────────────────────────────────────────────────
        // Where everyone else is tuned. Drawn before the audio cursor so your own
        // marker always sits on top of theirs.
        if (showUsers && _userChannels.length > 0) {
            this._drawUserCursors(sCtx, w, h, true);
            this._drawUserCursors(wfCtx, wfW, wfH, false);
        }

        // ── Audio cursor overlay ──────────────────────────────────────────────
        // Draw carrier line + bandwidth shading on both canvases when this band
        // is the one currently being listened to.
        if (audioBandName === this.name && audioFreqHz !== null && radio && radio.isPlaying) {
            this._drawAudioCursor(sCtx, w, h, true);
            this._drawAudioCursor(wfCtx, wfW, wfH, false);
        }
    }

    // Draw a marker for every frequency other listeners are tuned to: the
    // passband shaded like the FT8 window, a dashed dial line, and the flag of
    // each country listening there. Fed by the /stats poll that already supplies
    // the Users count, so it costs no extra request.
    //
    // Listeners sharing a frequency share one marker — several flags, one line —
    // and the shading spans the widest passband among them, since they may be on
    // different modes.
    _drawUserCursors(ctx, cw, ch, showFlags = false) {
        const viewStartHz = this.meta.start + this.zoomStart * (this.meta.end - this.meta.start);
        const viewEndHz   = this.meta.start + this.zoomEnd   * (this.meta.end - this.meta.start);
        const viewSpanHz  = viewEndHz - viewStartHz;
        if (viewSpanHz <= 0) return;

        const groups = new Map();   // dial Hz → { low, high, codes[] }
        for (const c of _userChannels) {
            const freq = Number(c.frequency);
            if (!isFinite(freq) || freq <= 0) continue;

            let g = groups.get(freq);
            if (!g) { g = { low: null, high: null, codes: [] }; groups.set(freq, g); }

            // Offsets from the dial, and both are negative on LSB — so they have
            // to be compared, not assumed to straddle zero.
            const lo = Number(c.bandwidth_low);
            const hi = Number(c.bandwidth_high);
            if (isFinite(lo)) g.low  = (g.low  === null) ? lo : Math.min(g.low,  lo);
            if (isFinite(hi)) g.high = (g.high === null) ? hi : Math.max(g.high, hi);

            const cc = (c.country_code || '').toUpperCase();
            if (cc && g.codes.indexOf(cc) < 0) g.codes.push(cc);
        }
        if (groups.size === 0) return;

        ctx.save();
        ctx.font = '10px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
        ctx.textBaseline = 'top';
        ctx.textAlign    = 'left';

        // Ascending frequency, so the flag chips are laid out left to right and a
        // single right-edge per row is enough to pack them.
        const freqs = Array.from(groups.keys()).sort((a, b) => a - b);
        const chips = [];

        for (const freq of freqs) {
            const g = groups.get(freq);
            const frac = (freq - viewStartHz) / viewSpanHz;
            if (frac < -0.05 || frac > 1.05) continue;   // off-screen
            const cx = frac * cw;

            // Passband shading — same weight as the FT8 window highlight.
            if (g.low !== null && g.high !== null) {
                const clipped = _clipHighlightX(
                    ((freq + g.low  - viewStartHz) / viewSpanHz) * cw,
                    ((freq + g.high - viewStartHz) / viewSpanHz) * cw,
                    cw);
                if (clipped) {
                    const [x1, x2] = clipped;
                    ctx.fillStyle = 'rgba(126,200,227,0.12)';
                    ctx.fillRect(x1, 0, x2 - x1, ch);
                }
            }

            // Dial line — dashed, so it never reads as your own solid audio cursor.
            ctx.strokeStyle = 'rgba(126,200,227,0.65)';
            ctx.lineWidth   = 1;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(cx, 0);
            ctx.lineTo(cx, ch);
            ctx.stroke();
            ctx.setLineDash([]);

            if (!showFlags || g.codes.length === 0) continue;
            const MAX_FLAGS = 4;
            let label = g.codes.slice(0, MAX_FLAGS).map(iso2ToFlag).join('');
            if (g.codes.length > MAX_FLAGS) label += '+' + (g.codes.length - MAX_FLAGS);
            if (label) chips.push({ cx: cx, label: label, w: ctx.measureText(label).width });
        }

        // Flags — spectrum canvas only, starting below the FT8 label (y 1–13).
        // Two listeners a few hundred Hz apart put their chips at nearly the same
        // x, so each chip drops to the first row where it does not overlap one
        // already placed. Stacking down is the only free direction: the line
        // itself cannot move without lying about the frequency.
        if (showFlags && chips.length > 0) {
            const BASE_Y = 15, CHIP_H = 13, ROW_H = 15, GAP = 3;
            const maxRows = Math.max(1, Math.floor((ch - BASE_Y) / ROW_H));
            const rowEnds = [];   // right edge of the last chip placed in each row

            for (const chip of chips) {
                const lx = Math.max(1, Math.min(chip.cx + 3, cw - chip.w - 2));
                const x1 = lx - 1;
                const x2 = lx + chip.w + 3;

                let row = 0;
                while (row < maxRows - 1 && rowEnds[row] !== undefined && x1 < rowEnds[row] + GAP) {
                    row++;
                }
                rowEnds[row] = x2;

                const y = BASE_Y + row * ROW_H;
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(x1, y, chip.w + 4, CHIP_H);
                ctx.fillStyle = 'rgba(255,255,255,0.92)';
                ctx.fillText(chip.label, lx + 1, y + 1);
            }
        }

        ctx.restore();
    }

    // Draw carrier line + bandwidth shading on a canvas context.
    // Uses the same linear Hz→pixel mapping as the click handler.
    _drawAudioCursor(ctx, cw, ch, showLabel = false) {
        // Visible Hz range (matches click/touch/tooltip mapping exactly)
        const viewStartHz = this.meta.start + this.zoomStart * (this.meta.end - this.meta.start);
        const viewEndHz   = this.meta.start + this.zoomEnd   * (this.meta.end - this.meta.start);
        const viewSpanHz  = viewEndHz - viewStartHz;
        if (viewSpanHz <= 0) return;

        // Carrier position as canvas-fraction using linear Hz mapping
        const carrierFrac = (audioFreqHz - viewStartHz) / viewSpanHz;
        if (carrierFrac < -0.05 || carrierFrac > 1.05) return; // off-screen

        const cx = carrierFrac * cw;

        // Bandwidth edges (Hz offsets from carrier, from MinimalRadio)
        const bwLow  = radio.bandwidthLow  ?? -2850;   // Hz offset (negative = below carrier)
        const bwHigh = radio.bandwidthHigh ??  2850;

        const clippedBW = _clipHighlightX(
            ((audioFreqHz + bwLow  - viewStartHz) / viewSpanHz) * cw,
            ((audioFreqHz + bwHigh - viewStartHz) / viewSpanHz) * cw,
            cw);

        // Bandwidth shading
        if (clippedBW) {
            const [x1, x2] = clippedBW;
            ctx.fillStyle = 'rgba(229,115,115,0.28)';
            ctx.fillRect(x1, 0, x2 - x1, ch);
        }

        // Carrier line
        ctx.save();
        ctx.strokeStyle = '#e57373';
        ctx.lineWidth   = 1.5;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(cx, 0);
        ctx.lineTo(cx, ch);
        ctx.stroke();

        // Dial frequency label — spectrum canvas only, sits just below the FT8 label
        // (FT8 label occupies y=1..13, this sits at y=15)
        if (showLabel) {
            ctx.font         = '9px monospace';
            ctx.textBaseline = 'top';
            ctx.textAlign    = 'left';
            const dialLabel = (audioFreqHz / 1000).toFixed(1) + ' kHz';
            const dlw = ctx.measureText(dialLabel).width;
            const dlx = (cx + 3 + dlw > cw) ? cx - dlw - 4 : cx + 3;  // flip left if near right edge
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(dlx - 1, 29, dlw + 4, 12);
            ctx.fillStyle = '#e57373';
            ctx.fillText(dialLabel, dlx + 1, 30);
        }

        ctx.restore();
    }

    _drawHoverLine(frac) {
        const ctx = this.overlayCtx;
        const ow  = this.overlayCanvas.width;
        const oh  = this.overlayCanvas.height;
        if (ow === 0 || oh === 0) return;
        ctx.clearRect(0, 0, ow, oh);
        const x = frac * ow;
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth   = 1;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, oh);
        ctx.stroke();
        ctx.restore();
    }

    _clearHoverLine() {
        const ctx = this.overlayCtx;
        const ow  = this.overlayCanvas.width;
        const oh  = this.overlayCanvas.height;
        if (ow === 0 || oh === 0) return;
        ctx.clearRect(0, 0, ow, oh);
    }

    _onSpecHover(e) {
        if (!this.bins) return;
        const rect = this.specCanvas.getBoundingClientRect();
        const frac = (e.clientX - rect.left) / rect.width;
        // Frequency: linear interpolation across visible Hz range (1 Hz resolution)
        const startHz = this.meta.start + this.zoomStart * (this.meta.end - this.meta.start);
        const endHz   = this.meta.start + this.zoomEnd   * (this.meta.end - this.meta.start);
        const hz      = Math.round(startHz + frac * (endHz - startHz));
        // dB: still looked up from the nearest bin
        const n        = this.bins.length;
        const binStart = Math.round(this.zoomStart * (n - 1));
        const binEnd   = Math.round(this.zoomEnd   * (n - 1));
        const zn       = Math.max(2, binEnd - binStart + 1);
        const binIdx   = Math.min(n - 1, Math.max(0, binStart + Math.round(frac * (zn - 1))));
        const db  = this.bins[binIdx] - 256;
        const mhz = (hz / 1e6).toFixed(4);
        _positionTooltip(`${mhz} MHz  ${db.toFixed(1)} dBFS`, e.clientX, e.clientY);
    }

    _onWfHover(e) {
        if (!this.bins) return;
        const rect  = this.wfCanvas.getBoundingClientRect();
        const fracX = (e.clientX - rect.left) / rect.width;
        const fracY = (e.clientY - rect.top)  / rect.height;

        // Frequency: linear interpolation across visible Hz range (1 Hz resolution)
        const startHz = this.meta.start + this.zoomStart * (this.meta.end - this.meta.start);
        const endHz   = this.meta.start + this.zoomEnd   * (this.meta.end - this.meta.start);
        const hz      = Math.round(startHz + fracX * (endHz - startHz));
        const mhz     = (hz / 1e6).toFixed(4);
        // dB: still looked up from the nearest bin
        const n        = this.bins.length;
        const binStart = Math.round(this.zoomStart * (n - 1));
        const binEnd   = Math.round(this.zoomEnd   * (n - 1));
        const zn       = Math.max(2, binEnd - binStart + 1);
        const binIdx   = Math.min(n - 1, Math.max(0, binStart + Math.round(fracX * (zn - 1))));

        // Y → row index within actual stored rows (newest = top = index 0)
        const rows    = this.waterfallRows;
        const times   = this.waterfallTimes;
        const nRows   = rows.length;
        if (nRows === 0) return;
        // Map canvas Y fraction → row index 0 (newest) .. nRows-1 (oldest).
        // Must use the same mapping as the renderer — maxRows slots, shifted by
        // the current scroll offset — or the readout points at the wrong row.
        const rowIdx = Math.min(nRows - 1, Math.max(0,
            Math.round(fracY * this.maxRows - this._interpFrac() + 1)));
        const rowDataIdx = nRows - 1 - rowIdx;
        // Age: use actual stored timestamp for accuracy
        const ageSec = Math.round((Date.now() - (times[rowDataIdx] ?? Date.now())) / 1000);
        const ageStr = ageSec <= 0 ? 'now'
                     : ageSec === 1 ? '1 s ago'
                     : `${ageSec} s ago`;
        let dbStr = '--';
        if (rowDataIdx >= 0 && rowDataIdx < nRows) {
            // History is raw dBFS, so this is the measured value rather than one
            // reconstructed from a normalised level at the current range.
            const db = rows[rowDataIdx][Math.min(binIdx, n - 1)];
            dbStr = db.toFixed(1) + ' dBFS';
        }

        _positionTooltip(`${mhz} MHz  ${dbStr}  (${ageStr})`, e.clientX, e.clientY);
    }

    destroy() {
        if (this.animFrame) cancelAnimationFrame(this.animFrame);
        if (this.el && this.el.parentNode) this.el.parentNode.removeChild(this.el);
    }
}

// ── SSE binary8 decoder ───────────────────────────────────────────────────────
function decodeSSEEvent(b64data) {
    // base64 → Uint8Array
    const bin = atob(b64data);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);

    if (buf.length < 22) return null;
    const magic = String.fromCharCode(buf[0], buf[1], buf[2], buf[3]);
    if (magic !== 'SPEC') return null;

    const flags = buf[5];
    // payload starts at offset 22
    const payload = buf.subarray(22);
    return { flags, payload };
}

// ── SSE connection management ─────────────────────────────────────────────────
function buildSSEUrl() {
    const params = [...activeBands].map(b => `band=${encodeURIComponent(b)}`).join('&');
    return `/api/noisefloor/spectrum/stream${params ? '?' + params : ''}`;
}

// Reconnect state — exponential backoff capped at 30 s
let _sseRetryDelay  = 2000;   // ms, doubles on each failure up to _sseRetryMax
const _sseRetryMax  = 30000;
let _sseRetryTimer  = null;   // pending setTimeout handle
let _sseConnected   = false;  // true once we receive at least one event

function _cancelRetry() {
    if (_sseRetryTimer !== null) {
        clearTimeout(_sseRetryTimer);
        _sseRetryTimer = null;
    }
}

function _scheduleReconnect() {
    _cancelRetry();
    if (activeBands.size === 0) return;
    const delay = _sseRetryDelay;
    setStatus('error', `Connection lost — retrying in ${Math.round(delay / 1000)} s…`);
    _sseRetryTimer = setTimeout(() => {
        _sseRetryTimer = null;
        connectSSE();
    }, delay);
    // Exponential backoff
    _sseRetryDelay = Math.min(_sseRetryMax, _sseRetryDelay * 2);
}

function connectSSE() {
    // Cancel any pending retry
    _cancelRetry();

    // Close existing connection
    if (sse) { sse.close(); sse = null; }

    // Reset bandwidth counters on each (re)connect so stale figures don't persist.
    _bpsAccum = 0; _bpsLastTime = 0; _bpsCurrent = null;
    _sseConnected = false;

    if (activeBands.size === 0) {
        setStatus('wait', 'No bands selected');
        return;
    }

    // Only show "Connecting…" if we weren't already live — avoids a flash
    // when toggling bands while the stream is running.
    if (!_sseConnected) setStatus('wait', 'Connecting…');

    sse = new EventSource(buildSSEUrl());

    // onopen fires as soon as the HTTP connection is established.
    sse.onopen = () => {
        _sseConnected = true;
        _sseRetryDelay = 2000;
        _touchLastEvent();
        _updateStatusText();
    };

    sse.addEventListener('spectrum', e => {
        _touchLastEvent();
        if (!_sseConnected) {
            _sseConnected = true;
            _sseRetryDelay = 2000;
        }

        const band = e.lastEventId;
        const panel = panels[band];
        if (!panel) return;

        const decoded = decodeSSEEvent(e.data);
        if (!decoded) return;

        panel.applyFrame(decoded.payload, decoded.flags);

        // Accumulate bytes for kbps display (updated by the 1s status timer)
        _bpsAccum += e.data.length;
        const now = performance.now();
        if (_bpsLastTime === 0) _bpsLastTime = now;
        const elapsed = now - _bpsLastTime;
        if (elapsed >= 1000) {
            const kbps = (_bpsAccum * 8 / elapsed).toFixed(1); // bits/ms = kbps
            _bpsCurrent = `${kbps} kbps`;
            _bpsAccum = 0;
            _bpsLastTime = now;
        }
    });

    sse.addEventListener('heartbeat', () => {
        _touchLastEvent();
        if (!_sseConnected) {
            _sseConnected = true;
            _sseRetryDelay = 2000;
        }
    });

    sse.onerror = () => {
        // Close immediately — don't let the browser silently retry on its own
        // schedule, which can produce duplicate connections.
        if (sse) { sse.close(); sse = null; }
        _sseConnected = false;
        _scheduleReconnect();
    };
}

// Update the status text once per second from a timer — decoupled from data events
// so the "Live" indicator doesn't flicker when connectSSE() is called mid-stream.
function _updateStatusText() {
    // Always tick the UTC clock regardless of connection state
    const now = new Date();
    const hh = String(now.getUTCHours()).padStart(2, '0');
    const mm = String(now.getUTCMinutes()).padStart(2, '0');
    const ss = String(now.getUTCSeconds()).padStart(2, '0');
    const clockEl = document.getElementById('utc-clock');
    if (clockEl) clockEl.textContent = `${hh}:${mm}:${ss} UTC`;

    // Local time — shown only when we have a timezone offset from the server
    const localEl = document.getElementById('local-clock');
    if (localEl && _localTzOffsetMin !== null) {
        const localMs  = now.getTime() + _localTzOffsetMin * 60 * 1000;
        const localNow = new Date(localMs);
        const lhh = String(localNow.getUTCHours()).padStart(2, '0');
        const lmm = String(localNow.getUTCMinutes()).padStart(2, '0');
        const lss = String(localNow.getUTCSeconds()).padStart(2, '0');
        localEl.textContent = `${lhh}:${lmm}:${lss} Local`;
        localEl.style.display = '';
    }

    if (!sse || sse.readyState === EventSource.CLOSED) return; // error path handles its own text
    if (sse.readyState === EventSource.CONNECTING) {
        setStatus('wait', 'Connecting…');
        return;
    }
    // OPEN
    const kbpsStr = _bpsCurrent ? ` · ${_bpsCurrent}` : '';
    setStatus('live', `Live${kbpsStr}`);
}

let _statusTimer = null;
function _startStatusTimer() {
    if (_statusTimer !== null) return;
    _updateStatusText(); // tick immediately so clock shows at once
    _statusTimer = setInterval(_updateStatusText, 1000);
}

// ── Band selection ────────────────────────────────────────────────────────────
function rebuildPanels() {
    // Remove panels for deselected bands
    for (const name of Object.keys(panels)) {
        if (!activeBands.has(name)) {
            // Audio previewing this band goes with it: the panel carrying the
            // tuned cursor and the ■ Stop button is about to disappear, so
            // leaving it playing would strand audio with no way to stop it.
            if (audioBandName === name) stopAudio();
            panels[name].destroy();
            delete panels[name];
        }
    }

    // Add panels for newly selected bands. Wideband isn't in allBands (see
    // WIDEBAND_NAME) so it's handled explicitly, and always placed first.
    if (activeBands.has(WIDEBAND_NAME) && !panels[WIDEBAND_NAME]) {
        panels[WIDEBAND_NAME] = new BandPanel(WIDEBAND_NAME, bandMeta[WIDEBAND_NAME]);
    }
    for (const name of allBands) {
        if (activeBands.has(name) && !panels[name]) {
            panels[name] = new BandPanel(name, bandMeta[name]);
        }
    }

    // Re-order DOM nodes in the grid to match allBands frequency order, with
    // wideband (if active) always leading. appendChild moves an existing node
    // to the end, so iterating in order produces the correct final sequence
    // regardless of prior order.
    const grid = document.getElementById('grid');
    if (panels[WIDEBAND_NAME] && panels[WIDEBAND_NAME].el) {
        grid.appendChild(panels[WIDEBAND_NAME].el);
    }
    for (const name of allBands) {
        if (panels[name] && panels[name].el) {
            grid.appendChild(panels[name].el);
        }
    }

    // Show/hide no-data message
    document.getElementById('no-data').style.display =
        activeBands.size === 0 ? 'block' : 'none';

    // Card size depends on how many bands are showing, so relayout on every change
    applyLayout();

    // Reconnect SSE with new band list
    connectSSE();

    // The spot filter follows the selected bands.
    if (filterSpots) _refreshSpotFilters();
}

function toggleBand(name) {
    if (activeBands.has(name)) activeBands.delete(name);
    else                        activeBands.add(name);
    updatePills();
    rebuildPanels();
    savePrefs();
}

function updatePills() {
    document.querySelectorAll('.band-pill').forEach(pill => {
        const name = pill.dataset.band;
        pill.classList.toggle('active', activeBands.has(name));
    });
}

// Reflect the manual/auto state in the toolbar.
function applyDbAutoUI() {
    const btn  = document.getElementById('db-auto');
    const wrap = document.getElementById('range-controls');
    if (btn) {
        btn.textContent = dbAuto ? 'Auto' : 'Manual';
        btn.classList.toggle('active', dbAuto);
    }
    if (wrap) wrap.classList.toggle('auto', dbAuto);
}

// ── Preferences (localStorage) ────────────────────────────────────────────────
function savePrefs() {
    try {
        localStorage.setItem('bandActivity_active', JSON.stringify([...activeBands]));
        localStorage.setItem('bandActivity_dbMin', dbMin);
        localStorage.setItem('bandActivity_dbMax', dbMax);
        localStorage.setItem('bandActivity_dbAuto', dbAuto ? '1' : '0');
        localStorage.setItem('bandActivity_dbSpan', dbAutoMinSpan);
        localStorage.setItem('bandActivity_palette', currentPalette);
        localStorage.setItem('bandActivity_layout', currentLayout);
        localStorage.setItem('bandActivity_peaks', showPeaks ? '1' : '0');
        localStorage.setItem('bandActivity_filterSpots', filterSpots ? '1' : '0');
        localStorage.setItem('bandActivity_showUsers', showUsers ? '1' : '0');
    } catch(e) {}
}

function loadPrefs() {
    try {
        const saved = localStorage.getItem('bandActivity_active');
        if (saved) {
            const arr = JSON.parse(saved);
            activeBands = new Set(arr.filter(n => bandMeta[n]));
        }
        const sMin = localStorage.getItem('bandActivity_dbMin');
        const sMax = localStorage.getItem('bandActivity_dbMax');
        if (sMin) { dbMin = parseFloat(sMin); document.getElementById('db-min').value = dbMin; }
        if (sMax) { dbMax = parseFloat(sMax); document.getElementById('db-max').value = dbMax; }

        // Auto is the default — only an explicitly stored choice overrides it,
        // so a missing key leaves the default intact rather than forcing manual.
        const sAuto = localStorage.getItem('bandActivity_dbAuto');
        if (sAuto !== null) dbAuto = (sAuto === '1');

        const sSpan = parseFloat(localStorage.getItem('bandActivity_dbSpan'));
        if (!isNaN(sSpan)) {
            dbAutoMinSpan = Math.max(AUTO_SPAN_MIN, Math.min(AUTO_SPAN_MAX, sSpan));
        }
        const spanEl = document.getElementById('db-span');
        if (spanEl) spanEl.value = dbAutoMinSpan;

        applyDbAutoUI();

        const sPalette = localStorage.getItem('bandActivity_palette');
        if (sPalette) {
            currentPalette = sPalette;
            CMAP = buildCMAP(currentPalette);
            const sel = document.getElementById('palette-select');
            if (sel) sel.value = currentPalette;
        }

        const sLayout = localStorage.getItem('bandActivity_layout');
        if (sLayout && ['auto','fit','1','2','3','4','5','6'].includes(sLayout)) {
            currentLayout = sLayout;
            const sel = document.getElementById('layout-select');
            if (sel) sel.value = currentLayout;
        }

        // Enabled by default — only an explicitly stored choice overrides it, so
        // a missing key leaves the default intact.
        const sPeaks = localStorage.getItem('bandActivity_peaks');
        if (sPeaks !== null) showPeaks = (sPeaks === '1');
        const peaksEl = document.getElementById('show-peaks');
        if (peaksEl) peaksEl.checked = showPeaks;

        const sFilter = localStorage.getItem('bandActivity_filterSpots');
        if (sFilter !== null) filterSpots = (sFilter === '1');
        const filterEl = document.getElementById('filter-spots');
        if (filterEl) filterEl.checked = filterSpots;

        const sUsers = localStorage.getItem('bandActivity_showUsers');
        if (sUsers !== null) showUsers = (sUsers === '1');
        const usersEl = document.getElementById('show-users');
        if (usersEl) usersEl.checked = showUsers;
    } catch(e) {}
}

// ── Status indicator ──────────────────────────────────────────────────────────
function setStatus(state, text) {
    const dot  = document.getElementById('status-dot');
    const span = document.getElementById('status-text');
    dot.className = state;
    span.textContent = text;
}

// ── Stale-connection watchdog ─────────────────────────────────────────────────
// If no spectrum or heartbeat event arrives within 45 s, force a reconnect.
// The server sends a heartbeat every 30 s, so 45 s gives one missed heartbeat
// of tolerance before we decide the connection is dead.
let _lastEventTime  = 0;
const _STALE_MS     = 45_000;
let _watchdogTimer  = null;

function _touchLastEvent() {
    _lastEventTime = Date.now();
}

// ── Band Conditions panel ─────────────────────────────────────────────────────
// Fetches per-band FT8 SNR (last 10 min) and NOAA space weather every 5 minutes.

const _COND_BANDS_FALLBACK = ['160m','80m','60m','40m','30m','20m','17m','15m','12m','10m','6m'];
let _condTimer = null;

// ── CW Spots (SSE) ───────────────────────────────────────────────────────────
let _cwEnabled      = false;          // set from /api/description
let _cwSSE          = null;           // EventSource instance
let _cwReconnectMs  = 5000;           // backoff: 5 s → 30 s
let _cwRecentSpots  = [];             // ring buffer, newest first, max 50
let _cwSeenCountries = new Map();     // band → Set<country_code>
const _CW_MAX_DISPLAY = 24;
const _CW_RING_SIZE   = 50;

function _cwMakeBadge(spot) {
    const el = document.createElement('span');
    el.className = 'cond-cw-badge' + (spot.isNew ? ' new-country' : '');
    el.title = `${spot.callsign} on ${spot.band} · ${(spot.frequency / 1e6).toFixed(4)} MHz · ${spot.wpm || '?'} WPM`;
    // Read back by the delegated click-to-tune handler
    el.dataset.band = spot.band || '';
    el.dataset.freq = spot.frequency;
    const flag = spot.country_code ? iso2ToFlag(spot.country_code) : '';
    el.innerHTML =
        (flag ? `<span class="ccw-flag">${flag}</span>` : '') +
        `<span class="ccw-call">${_escHtml(spot.callsign)}</span>` +
        `<span class="ccw-band">${_escHtml(spot.band)}</span>` +
        (spot.isNew ? `<span class="ccw-star">★</span>` : '');
    return el;
}

function _renderCWSpots() {
    const el = document.getElementById('cond-cw-spots');
    if (!el) return;
    if (_cwRecentSpots.length === 0) {
        el.style.display = 'none';
        return;
    }
    const visible = filterSpots
        ? _cwRecentSpots.filter(function(s) { return _bandIsActive(s.band); })
        : _cwRecentSpots;
    if (visible.length === 0) {
        el.innerHTML = '';
        el.style.display = 'none';
        return;
    }
    el.innerHTML = '';
    const shown = visible.slice(0, _CW_MAX_DISPLAY);
    for (const spot of shown) el.appendChild(_cwMakeBadge(spot));
    el.style.display = 'flex'; // must override inline style="display:none"
    // Newest render first, so drop trailing (oldest) badges until they all
    // fit the fixed height available under the band pills.
    while (el.lastElementChild && el.scrollHeight > el.clientHeight) {
        el.removeChild(el.lastElementChild);
    }
    // No room for even one badge — hide the strip entirely.
    if (!el.firstElementChild) el.style.display = 'none';
}

function _cwHandleSpot(spot) {
    // Determine if this is a new country on this band
    const band = spot.band || '';
    const cc   = (spot.country_code || '').toUpperCase();
    let isNew = false;
    if (cc) {
        if (!_cwSeenCountries.has(band)) _cwSeenCountries.set(band, new Set());
        const seen = _cwSeenCountries.get(band);
        if (!seen.has(cc)) {
            seen.add(cc);
            isNew = true;
        }
    }
    // Prepend to ring buffer
    _cwRecentSpots.unshift({ ...spot, isNew });
    if (_cwRecentSpots.length > _CW_RING_SIZE) _cwRecentSpots.length = _CW_RING_SIZE;
    _renderCWSpots();
    // Update body padding in case bar grew
    const bar = document.getElementById('conditions-bar');
    if (bar && bar.style.display !== 'none') {
        requestAnimationFrame(() => {
            document.body.style.paddingBottom = bar.offsetHeight + 'px';
            scheduleLayout(); // conditions bar height changes the space 'fit' can use
        });
    }
}

function _startCWSpots() {
    if (_cwSSE) return; // already connected
    // Attempt connection regardless of _cwEnabled — server returns 503 if disabled,
    // which onerror handles with a long backoff so we don't hammer a disabled endpoint.

    function connect() {
        const es = new EventSource('/api/cwskimmer/stream');
        _cwSSE = es;
        let gotMessage = false;

        es.onmessage = (e) => {
            gotMessage = true;
            _cwReconnectMs = 5000; // reset backoff on success
            try {
                const spot = JSON.parse(e.data);
                if (spot.type === 'cw_spot') _cwHandleSpot(spot);
            } catch (_) {}
        };

        // heartbeat events keep the connection alive — treat as success
        es.addEventListener('heartbeat', () => { gotMessage = true; _cwReconnectMs = 5000; });

        es.onerror = () => {
            es.close();
            _cwSSE = null;
            // If we never got a message, the server may have returned 503 —
            // use a longer backoff to avoid hammering a disabled endpoint.
            const delay = gotMessage ? _cwReconnectMs : 30000;
            setTimeout(() => {
                _cwReconnectMs = Math.min(_cwReconnectMs * 2, 30000);
                connect();
            }, delay);
        };
    }

    connect();
}

// ── Notification stream ───────────────────────────────────────────────────────
// Subscribes to /api/notifications/stream — the public, password-protected feed
// enabled under Notifications → Channels in the admin UI. The endpoint answers
// 503 when the operator has not enabled it, so the panel stays completely hidden
// on receivers that don't use it, and 401 when the password is missing or wrong,
// which is what brings up the password box.
//
// The password is kept in localStorage. It is a read-only feed password and this
// page has nowhere else to keep it, so a subscriber does not have to retype it
// on every visit.

const _NOTIF_PW_KEY   = 'bandActivity_notifPassword';
const _NOTIF_DING_KEY = 'bandActivity_notifDing';
const _NOTIF_DING_GAP = 1000;   // never ding more than once a second in a burst
const _NOTIF_MAX      = 3;      // alerts stacked at once in the overlay
const _NOTIF_TTL_MS   = 5000;   // each alert is on screen for 5 seconds
const _NOTIF_FADE_MS  = 500;    // …the last of which is a fade-out
const _NOTIF_URL      = '/api/notifications/stream';

let _notifSSE       = null;
let _notifBackoffMs = 5000;     // network-error backoff: 5 s → 60 s
let _notifRetryTid  = null;
let _notifLastEvent = 0;        // Date.now() of the last notification/heartbeat
let _notifHbSec     = 30;       // heartbeat interval reported by the server
let _notifStaleTid  = null;
let _notifConnecting = false;
let _notifAudioCtx  = null;
let _notifLastDing  = 0;

function _notifGetPassword() {
    try { return localStorage.getItem(_NOTIF_PW_KEY) || ''; } catch (_) { return ''; }
}
function _notifSetPassword(pw) {
    try { localStorage.setItem(_NOTIF_PW_KEY, pw); } catch (_) {}
}
function _notifClearPassword() {
    try { localStorage.removeItem(_NOTIF_PW_KEY); } catch (_) {}
}

function _notifUrl(pw) {
    return _NOTIF_URL + '?password=' + encodeURIComponent(pw);
}

// Ding on arrival — on unless it has been explicitly turned off.
function _notifDingEnabled() {
    try { return localStorage.getItem(_NOTIF_DING_KEY) !== '0'; } catch (_) { return true; }
}
function _notifSetDingEnabled(on) {
    try { localStorage.setItem(_NOTIF_DING_KEY, on ? '1' : '0'); } catch (_) {}
}

// A short two-partial bell, synthesised rather than shipped as an audio file.
// Its own AudioContext, created on first use so the page never opens one it
// does not need, and kept away from the receiver's audio path.
function _notifDing() {
    if (!_notifDingEnabled()) return;
    const now = Date.now();
    if (now - _notifLastDing < _NOTIF_DING_GAP) return;   // a burst gets one ding
    _notifLastDing = now;

    try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!_notifAudioCtx) _notifAudioCtx = new Ctx();
        const ctx = _notifAudioCtx;
        // Browsers suspend contexts created before a user gesture; entering the
        // password is one, so this normally succeeds.
        if (ctx.state === 'suspended') ctx.resume();

        const t = ctx.currentTime;
        const out = ctx.createGain();
        out.gain.setValueAtTime(0.0001, t);
        out.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
        out.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
        out.connect(ctx.destination);

        [[880, 1.0], [1760, 0.35]].forEach(function(pair) {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(pair[0], t);
            const g = ctx.createGain();
            g.gain.value = pair[1];
            osc.connect(g);
            g.connect(out);
            osc.start(t);
            osc.stop(t + 0.5);
        });
    } catch (_) { /* audio is a nicety — never let it break the feed */ }
}

// _notifShow reveals or hides the small indicator beside the clocks. The
// indicator is all that lives in the topbar — the alerts float below it — so
// nothing here can change the topbar's height or make it wrap.
function _notifShow(visible) {
    const badge = document.getElementById('notif-badge');
    if (badge) badge.style.display = visible ? 'flex' : 'none';
    if (!visible) {
        _notifClear();
        _notifHidePasswordBox();
    }
}

// _notifPosition parks the stack directly under the clocks. Measured rather
// than hard-coded because the topbar's first row changes height with the font
// and rewraps as the window narrows.
function _notifPosition() {
    const panel = document.getElementById('notif-panel');
    const bar   = document.getElementById('topbar');
    const clock = document.getElementById('utc-clock');
    if (!panel || !bar || !clock) return;
    const barTop     = bar.getBoundingClientRect().top;
    const clockBottom = clock.getBoundingClientRect().bottom;
    panel.style.top = Math.round(clockBottom - barTop + 6) + 'px';
}

// The overlay is only on screen while it has something to say: an alert, or a
// password box. It floats, so it never resizes anything underneath it.
function _notifSyncPanel() {
    const panel = document.getElementById('notif-panel');
    const auth  = document.getElementById('notif-auth');
    if (!panel) return;
    const list = document.getElementById('notif-list');
    const authOpen = auth && auth.style.display === 'flex';
    const hasItems = list && list.children.length > 0;
    const visible  = authOpen || hasItems;
    panel.style.display = visible ? 'flex' : 'none';
    if (visible) _notifPosition();
}

function _notifSetState(dotClass, text) {
    const dot = document.getElementById('notif-dot');
    const btn = document.getElementById('btn-notif-key');
    if (dot) dot.className = 'notif-dot ' + dotClass;
    // The state has no room of its own now — it lives in the badge's tooltip.
    if (btn) btn.title = 'Notification stream — ' + text;
}

// _notifAskPassword switches the panel into "enter a password" mode. msg is an
// optional reason shown above the box (e.g. a rejected password).
function _notifAskPassword(msg, prefill) {
    const auth = document.getElementById('notif-auth');
    const list = document.getElementById('notif-list');
    const msgEl = document.getElementById('notif-auth-msg');
    const input = document.getElementById('notif-password');
    if (!auth || !list || !msgEl || !input) return;

    _notifShow(true);
    auth.style.display = 'flex';
    list.innerHTML = '';
    if (msg) {
        msgEl.textContent = msg;
        msgEl.style.display = 'block';
    } else {
        msgEl.style.display = 'none';
    }
    if (prefill !== undefined) input.value = prefill;
    _notifSetState('wait', 'password required');
    _notifSyncPanel();
}

function _notifHidePasswordBox() {
    const auth  = document.getElementById('notif-auth');
    const msgEl = document.getElementById('notif-auth-msg');
    if (auth)  auth.style.display = 'none';
    if (msgEl) msgEl.style.display = 'none';
    _notifSyncPanel();
}

// _notifPlain turns a rendered notification into a single line of plain text.
// Rule templates are often written with HTML for Telegram, so tags are stripped
// rather than escaped — otherwise every alert would read "<b>DX</b> spotted".
function _notifPlain(s) {
    return String(s == null ? '' : s)
        .replace(/<br\s*\/?>/gi, ' · ')
        .replace(/<\/(p|div|li|h\d)>/gi, ' · ')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/g, ' ')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"')
        .replace(/&#0?39;/g, "'")
        .replace(/&amp;/g, '&')
        .replace(/\s*[\r\n]+\s*/g, ' · ')
        .replace(/\s+/g, ' ')
        .replace(/(\s*·\s*)+$/, '')
        .trim();
}

function _notifClear() {
    const list = document.getElementById('notif-list');
    if (list) list.innerHTML = '';
    _notifSyncPanel();
}

// Each alert is its own element with its own expiry timer, so a new one
// arriving never restarts the fade of the alerts already on screen.
function _notifPush(payload) {
    const list = document.getElementById('notif-list');
    if (!list) return;
    const text = _notifPlain(payload.message);
    if (!text) return;

    // The server timestamp is authoritative; fall back to now if it is missing.
    let when = new Date(payload.timestamp || Date.now());
    if (isNaN(when.getTime())) when = new Date();
    const time = String(when.getUTCHours()).padStart(2, '0') + ':' +
                 String(when.getUTCMinutes()).padStart(2, '0');

    const item = document.createElement('div');
    item.className = 'notif-item';
    item.title = [text,
                  payload.event ? 'event: ' + payload.event : '',
                  payload.rule  ? 'rule: '  + payload.rule  : '']
                 .filter(Boolean).join('\n');
    item.innerHTML = '<span class="notif-time">' + _escHtml(time) + '</span>' +
                     '<span class="notif-text">' + _escHtml(text) + '</span>';
    // Fade out under its own steam just before the timer removes it, so the two
    // stay in step from the one constant above.
    item.style.animation = 'notifIn 0.3s ease-out, notifOut ' + (_NOTIF_FADE_MS / 1000) +
                           's ease-in ' + ((_NOTIF_TTL_MS - _NOTIF_FADE_MS) / 1000) + 's forwards';

    list.insertBefore(item, list.firstChild);
    while (list.children.length > _NOTIF_MAX) list.removeChild(list.lastChild);
    _notifSyncPanel();

    setTimeout(function() {
        item.remove();
        _notifSyncPanel();
    }, _NOTIF_TTL_MS);
}

function _notifScheduleRetry(ms) {
    if (_notifRetryTid !== null) clearTimeout(_notifRetryTid);
    _notifRetryTid = setTimeout(function() {
        _notifRetryTid = null;
        _notifConnect();
    }, ms);
}

// _notifProbe asks the endpoint whether a subscription would be accepted.
// EventSource never exposes an HTTP status, so this is the only way to tell the
// failure modes apart. ?probe=1 answers without opening a stream, so probing
// costs neither a subscriber slot nor a per-IP connection slot.
//
// Returns { status, reason }: reason is the server's X-Stream-Reason —
// "disabled", "full", "auth-throttled", "ip-limited" or "unauthorized" —
// which distinguishes the two meanings of both 503 and 429.
async function _notifProbe(pw) {
    try {
        const resp = await fetch(_notifUrl(pw) + '&probe=1', { cache: 'no-store' });
        return { status: resp.status, reason: resp.headers.get('X-Stream-Reason') || '' };
    } catch (_) {
        return { status: 0, reason: '' };   // network error / offline
    }
}

async function _notifConnect() {
    if (_notifSSE || _notifConnecting) return;
    _notifConnecting = true;
    try {
        const pw = _notifGetPassword();
        const probe = await _notifProbe(pw);
        const status = probe.status;
        const reason = probe.reason;

        // Only a rejection carrying our own X-Stream-Reason header came from the
        // notification endpoint. A 503 from a reverse proxy, or a 401 from a
        // gateway or WAF in front of the server, says nothing whatsoever about
        // the password — and must never cost the operator the one they stored.
        const ours = reason !== '';

        if (status === 401 && !pw) {
            // Nobody has entered a password on this device, so a 401 is simply
            // "you are not subscribed" — not a failure, and not something to put
            // a prompt or an error in front of a passing visitor. Show the bell,
            // dim, so notifications can be opted into deliberately.
            _notifShow(true);
            _notifHidePasswordBox();
            _notifSetState('', 'available — click to enter the password');
            return;
        }
        if (status === 401 && ours) {
            // A password we hold was genuinely rejected by the stream. Never retry
            // automatically: each attempt counts against the server's
            // failed-authentication budget. Wait for the operator to type a new one.
            _notifClearPassword();
            _notifAskPassword('Password rejected — try again.', pw);
            return;
        }
        if (status === 401) {
            // A password we hold was rejected by something in front of the server
            // (no X-Stream-Reason). Ask, because a 401 does need attention, but
            // keep the stored password: it is probably fine and we have no
            // evidence otherwise.
            _notifAskPassword('Authentication refused upstream — retry or check with the operator.', pw);
            return;
        }
        if (status === 503 && reason === 'full') {
            // The stream is up and our password is fine — it is just at its
            // subscriber limit. Keep the panel and retry soon.
            _notifShow(true);
            _notifHidePasswordBox();
            _notifSetState('error', 'stream full');
            _notifScheduleRetry(30000);
            return;
        }
        if (status === 503 && reason === 'disabled') {
            // Stream not enabled on this receiver — stay out of the way, but keep
            // looking in case the operator turns it on while the page is open.
            _notifShow(false);
            _notifScheduleRetry(120000);
            return;
        }
        if (status === 503) {
            // A 503 without our header is a proxy or gateway, not the stream
            // saying it is switched off. Treat it as the transient outage it is.
            _notifShow(true);
            _notifHidePasswordBox();
            _notifSetState('error', 'offline');
            _notifScheduleRetry(_notifBackoffMs);
            _notifBackoffMs = Math.min(_notifBackoffMs * 2, 60000);
            return;
        }
        if (status === 429 && reason === 'ip-limited') {
            // Too many connections from this address (another tab, usually) —
            // nothing to do with the password. Retry shortly.
            _notifShow(true);
            _notifHidePasswordBox();
            _notifSetState('error', 'too many connections');
            _notifScheduleRetry(15000);
            return;
        }
        if (status === 429) {
            _notifShow(true);
            _notifHidePasswordBox();
            _notifSetState('error', 'too many attempts');
            _notifScheduleRetry(300000);
            return;
        }
        if (status !== 200 && status !== 204) {
            _notifShow(true);
            _notifSetState('error', 'offline');
            _notifScheduleRetry(_notifBackoffMs);
            _notifBackoffMs = Math.min(_notifBackoffMs * 2, 60000);
            return;
        }

        // Authorised — open the stream.
        _notifSetPassword(pw);
        _notifShow(true);
        _notifHidePasswordBox();
        _notifSetState('live', 'connected');
        _notifBackoffMs = 5000;
        _notifLastEvent = Date.now();

        const es = new EventSource(_notifUrl(pw));
        _notifSSE = es;

        es.addEventListener('notification', function(e) {
            _notifLastEvent = Date.now();
            _notifSetState('live', 'connected');
            try {
                _notifPush(JSON.parse(e.data));
                _notifDing();
            } catch (_) {}
        });

        es.addEventListener('heartbeat', function(e) {
            _notifLastEvent = Date.now();
            _notifSetState('live', 'connected');
            try {
                const hb = JSON.parse(e.data);
                if (hb && hb.interval > 0) _notifHbSec = hb.interval;
            } catch (_) {}
        });

        // The server closes the stream when the password is rotated or the
        // channel is disabled. Reconnect through the probe so the new state is
        // classified properly instead of EventSource silently retrying a URL
        // that now returns 401.
        es.addEventListener('closed', function() {
            _notifDisconnect();
            _notifSetState('wait', 'reconnecting');
            _notifScheduleRetry(2000);
        });

        es.onerror = function() {
            _notifDisconnect();
            _notifSetState('error', 'reconnecting');
            _notifScheduleRetry(_notifBackoffMs);
            _notifBackoffMs = Math.min(_notifBackoffMs * 2, 60000);
        };
    } finally {
        _notifConnecting = false;
    }
}

function _notifDisconnect() {
    if (_notifSSE) {
        _notifSSE.onerror = null;
        _notifSSE.close();
        _notifSSE = null;
    }
}

// A dead-but-open connection produces no error event, which is exactly what the
// server's heartbeat exists to expose: no traffic for 2.5 heartbeats means the
// stream is gone even though the socket still looks fine.
function _notifStartStaleWatch() {
    if (_notifStaleTid !== null) return;
    _notifStaleTid = setInterval(function() {
        if (!_notifSSE) return;
        const silentMs = Date.now() - _notifLastEvent;
        if (silentMs > _notifHbSec * 2500) {
            _notifDisconnect();
            _notifSetState('error', 'reconnecting');
            _notifScheduleRetry(1000);
        }
    }, 10000);
}

function _startNotifications() {
    const keyBtn     = document.getElementById('btn-notif-key');
    const connectBtn = document.getElementById('btn-notif-connect');
    const input      = document.getElementById('notif-password');
    const dingBox    = document.getElementById('notif-ding');

    // Saved as soon as it is clicked — the box is also opened just to change it,
    // without ever pressing Connect.
    if (dingBox) {
        dingBox.checked = _notifDingEnabled();
        dingBox.addEventListener('change', function() {
            _notifSetDingEnabled(dingBox.checked);
            if (dingBox.checked) _notifDing();   // confirm it audibly
        });
    }

    if (keyBtn) {
        keyBtn.addEventListener('click', function() {
            const auth = document.getElementById('notif-auth');
            if (auth && auth.style.display === 'flex') {
                // Toggling the box shut returns to whatever the stream was doing.
                _notifHidePasswordBox();
                return;
            }
            _notifDisconnect();
            _notifAskPassword('', _notifGetPassword());
            if (input) input.focus();
        });
    }

    // Clicking the alerts dismisses them — they are also cleared on a timer.
    const listEl = document.getElementById('notif-list');
    if (listEl) {
        listEl.addEventListener('click', _notifClear);
    }

    function submit() {
        const pw = (input ? input.value : '').trim();
        if (!pw) return;
        _notifSetPassword(pw);
        _notifHidePasswordBox();
        _notifSetState('wait', 'Connecting…');
        _notifBackoffMs = 5000;
        if (_notifRetryTid !== null) { clearTimeout(_notifRetryTid); _notifRetryTid = null; }
        _notifDisconnect();
        _notifConnect();
    }

    if (connectBtn) connectBtn.addEventListener('click', submit);
    if (input) {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); submit(); }
        });
    }

    // The clocks move when the topbar rewraps, so the stack follows them.
    window.addEventListener('resize', _notifPosition);

    _notifStartStaleWatch();
    _notifConnect();
}

// Hardware status flags — set from /api/description in init()
// Listener markers: where other users of this receiver are currently tuned,
// taken from the /stats poll that already feeds the Users count.
let showUsers = true;
let _userChannels = [];   // newest /stats channels array

// Spot filter: when on, the CW spot badges and the voice ticker only show
// bands that are currently selected, so the conditions bar matches what is
// actually on screen.
let filterSpots = true;
let _vaLastData = null;   // last voice-activity poll, so the filter can be
                          // re-applied without waiting for the next one

// _bandIsActive reports whether a spot's band is one of the selected bands.
// Spot band names come from the server and may not match this receiver's
// configured names exactly, so they go through the same resolver as click-to-tune.
function _bandIsActive(rawBand) {
    const band = _resolveBandName(rawBand);
    return !!band && activeBands.has(band);
}

// Re-render everything the filter affects. Called when the checkbox changes and
// whenever the set of selected bands changes.
function _refreshSpotFilters() {
    _renderCWSpots();
    if (_vaLastData) _renderVoiceTicker(_vaLastData);
    const bar = document.getElementById('conditions-bar');
    if (bar && bar.style.display !== 'none') {
        requestAnimationFrame(() => {
            document.body.style.paddingBottom = bar.offsetHeight + 'px';
            scheduleLayout(); // conditions bar height changes the space 'fit' can use
        });
    }
}

let _rotatorEnabled  = false;
let _antSwitchEnabled = false;
let _hwTimer = null;   // separate 30 s poll for hardware (changes more often than weather)

// ── Front-end (SDR hardware) status ──────────────────────────────────────────
// Polled every 5 s from /api/frontend-status.  Nothing renders it yet — the
// values are just held here, and on window.frontendStatus, ready to be consumed.
//
// The object is mutated in place rather than replaced, so anything holding a
// reference keeps seeing fresh values.  A failed or incomplete poll clears
// every field back to null, so consumers never read a value we cannot confirm
// is current — `updated === null` means "no data", and hides the section.
let _feTimer  = null;
let _feWarned = false;   // suppress a warning every 5 s if the endpoint is absent

const frontendStatus = {
    healthy:         null,  // bool  — front end reporting OK
    if_power:        null,  // dB    — IF power after gain
    input_power_dbm: null,  // dBm   — power at the antenna input
    rf_gain:         null,  // dB    — current RF gain
    updated:         null,  // Date.now() of the last successful poll, null = never
};
window.frontendStatus = frontendStatus;

// IF power thresholds, matching the admin monitor's SDR front-end panel.
function _feIfPowerClass(v) {
    if (v === null) return '';
    if (v >= -10) return 'cond-fe-hot';    // close to clipping
    if (v >= -45) return 'cond-fe-good';
    return 'cond-fe-weak';                 // plenty of headroom, but weak
}

function _renderFrontendStatus() {
    const el = document.getElementById('cond-frontend');
    if (!el) return;
    const s = frontendStatus;
    // updated is only set when the fetch succeeded *and* every required value
    // parsed, so this covers an unreachable endpoint, a bad response and a
    // partial one alike — the section is hidden rather than half-populated.
    if (s.updated === null) { el.style.display = 'none'; return; }

    const fmt = (v, suffix) => v === null ? '--' : v.toFixed(1) + suffix;

    const healthCls = s.healthy ? 'active' : 'grounded';
    const healthTxt = s.healthy ? 'OK'     : 'FAULT';

    el.innerHTML =
        `<div class="cond-hw-row">
            <span class="cond-hw-label">RF Health</span>
            <span class="cond-hw-badge ${healthCls}">${healthTxt}</span>
         </div>
         <div class="cond-hw-row" title="IF power after gain — green -45 to -10 dBFS, red above -10 (near clipping), amber below -45 (weak)">
            <span class="cond-hw-label">IF</span>
            <span class="cond-hw-value ${_feIfPowerClass(s.if_power)}">${fmt(s.if_power, ' dBFS')}</span>
         </div>
         <div class="cond-hw-row" title="Power at the antenna input">
            <span class="cond-hw-label">Input</span>
            <span class="cond-hw-value">${fmt(s.input_power_dbm, ' dBm')}</span>
         </div>
         <div class="cond-hw-row" title="Current RF gain">
            <span class="cond-hw-label">RF gain</span>
            <span class="cond-hw-value">${fmt(s.rf_gain, ' dB')}</span>
         </div>`;

    el.style.display = '';
}

const _FE_EMPTY = {
    healthy: null, if_power: null, input_power_dbm: null, rf_gain: null, updated: null,
};

async function _refreshFrontendStatus() {
    let parsed = null;
    try {
        const resp = await fetch('/api/frontend-status');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const d = await resp.json();
        const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;
        const p = {
            healthy:         typeof d.healthy === 'boolean' ? d.healthy : null,
            if_power:        num(d.if_power),
            input_power_dbm: num(d.input_power_dbm),
            rf_gain:         num(d.rf_gain),
        };
        // All four are required.  A partial response is treated exactly like a
        // failed fetch — better to show nothing than a section that is half
        // real readings and half dashes.
        if (Object.values(p).some(v => v === null)) {
            throw new Error('missing or invalid values in response');
        }
        parsed = p;
    } catch (err) {
        // Log the first failure only — this polls forever, and a receiver
        // without the endpoint would otherwise spam the console every 5 s.
        if (!_feWarned) {
            _feWarned = true;
            console.warn('[frontend-status] unavailable:', err);
        }
    }

    if (parsed) {
        Object.assign(frontendStatus, parsed, { updated: Date.now() });
        _feWarned = false;
    } else {
        // Clear rather than keep the last good readings, so the section hides
        // and nothing downstream consumes values we can no longer confirm.
        Object.assign(frontendStatus, _FE_EMPTY);
    }

    // Rendered on failure too, so the section disappears when data stops.
    _renderFrontendStatus();

    // The bar may have grown/shrunk — keep the body padding and 'fit' layout in step
    const bar = document.getElementById('conditions-bar');
    if (bar && bar.style.display !== 'none') {
        requestAnimationFrame(() => {
            document.body.style.paddingBottom = bar.offsetHeight + 'px';
            scheduleLayout();
        });
    }
}

function _startFrontendStatusTimer() {
    if (_feTimer !== null) return;
    _refreshFrontendStatus();                              // immediate first fetch
    _feTimer = setInterval(_refreshFrontendStatus, 5_000); // every 5 s
}

function _snrStatus(snr) {
    if (snr === null || snr === undefined) return 'unknown';
    if (snr < 6)  return 'poor';
    if (snr < 20) return 'fair';
    if (snr < 30) return 'good';
    return 'excellent';
}

function _swPropClass(quality) {
    if (!quality) return 'unknown';
    const q = quality.toLowerCase();
    if (q.includes('excell')) return 'excellent';
    if (q.includes('good'))   return 'good';
    if (q.includes('fair'))   return 'fair';
    if (q.includes('poor') || q.includes('bad')) return 'poor';
    return 'unknown';
}

async function _fetchBandConditions() {
    const now  = new Date();
    const from = new Date(now.getTime() - 10 * 60 * 1000).toISOString();
    const to   = now.toISOString();

    // Use only bands that are actually configured on this server
    const bands = allBands.length > 0 ? allBands : _COND_BANDS_FALLBACK;

    const body = {
        primary: { from, to },
        bands,
        fields: ['ft8_snr'],
        interval: 'minute'
    };

    const resp = await fetch('/api/noisefloor/aggregate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    if (!resp.ok) throw new Error(`aggregate HTTP ${resp.status}`);
    const data = await resp.json();

    // Process: average ft8_snr over the window per band
    const states = {};
    const primary = data.primary || {};
    for (const band of bands) {
        const pts = primary[band];
        if (!pts || pts.length === 0) {
            states[band] = { status: 'unknown', snr: null };
            continue;
        }
        let sum = 0, n = 0;
        for (const pt of pts) {
            const v = pt.values?.ft8_snr;
            if (v !== null && v !== undefined) { sum += v; n++; }
        }
        const snr = n > 0 ? sum / n : null;
        states[band] = { status: _snrStatus(snr), snr };
    }
    return states;
}

// ── Voice activity ticker ─────────────────────────────────────────────────────
let _vaTimer = null;

// Tracks when each activity fingerprint (freq|callsign) was first seen so we
// can highlight items that are newly appeared.
// _VA_HIGHLIGHT_MS  — how long to keep the amber highlight after first appearance.
// _VA_NEW_THRESHOLD_MS — how long a station must be absent before it's treated
//                        as "new" again when it reappears.
const _VA_HIGHLIGHT_MS    =  2 * 60 * 1000;  // highlight for 2 minutes
const _VA_NEW_THRESHOLD_MS = 10 * 60 * 1000;  // re-trigger after 10 min absence
const _vaSeenMap = new Map(); // fingerprint → timestamp (ms) when first seen

async function _fetchVoiceActivity() {
    const resp = await fetch('/api/noisefloor/voice-activity/all');
    if (!resp.ok) throw new Error(`voice-activity HTTP ${resp.status}`);
    return resp.json();
}

let _tickerHadItems = false; // true once we've shown at least one item
let _tickerLastKey  = '';    // fingerprint of last rendered item list
const _TICKER_PX_PER_S = 60; // scroll speed

function _renderVoiceTicker(data, _precomputed) {
    const tickerEl = document.getElementById('cond-ticker');
    const trackEl  = document.getElementById('cond-ticker-track');
    if (!tickerEl || !trackEl) return;

    let itemsWithNew;

    if (_precomputed) {
        // Deferred retry path — reuse already-computed items+isNew so we don't
        // re-run the seen-map logic (which would mark everything as not-new).
        itemsWithNew = _precomputed;
    } else {
        // Flatten all activities across all bands into a sorted list
        const items = [];
        const bands = data?.bands || {};
        for (const [band, activities] of Object.entries(bands)) {
            if (filterSpots && !_bandIsActive(band)) continue;
            for (const act of activities) {
                items.push({ band, ...act });
            }
        }

        // Sort by frequency ascending so the ticker reads low-to-high across bands
        items.sort((a, b) =>
            (a.estimated_dial_freq || a.center_freq || 0) -
            (b.estimated_dial_freq || b.center_freq || 0)
        );

        if (items.length === 0) {
            // Nothing on the selected bands: the filter has to clear what is
            // scrolling, or it would keep showing spots it just excluded.
            if (filterSpots) {
                trackEl.innerHTML = '';
                tickerEl.style.display = 'none';
                _tickerLastKey  = '';
                _tickerHadItems = false;
                return;
            }
            // Otherwise keep whatever is already scrolling — don't hide or reset
            if (!_tickerHadItems) tickerEl.style.display = 'none';
            return;
        }
        _tickerHadItems = true;

        // Prune entries older than the re-trigger threshold so the map doesn't grow unbounded
        const _now = Date.now();
        const _cutoff = _now - _VA_NEW_THRESHOLD_MS;
        for (const [fp, ts] of _vaSeenMap) {
            if (ts < _cutoff) _vaSeenMap.delete(fp);
        }

        // Compute isNew for each item BEFORE the fingerprint check so the key
        // includes new/not-new state — a transition triggers a DOM rebuild.
        //
        // isNew = true  while (_now - firstSeen) < _VA_HIGHLIGHT_MS  (highlight window)
        // isNew = true  when firstSeen is absent (never seen, or absent > 10 min → pruned)
        // isNew = false once the highlight window expires
        itemsWithNew = items.map(act => {
            const call = act.dx_callsign || '';
            const fp   = `${act.estimated_dial_freq || act.center_freq}|${call}`;
            const firstSeen = _vaSeenMap.get(fp);
            const isNew = !firstSeen || (_now - firstSeen) < _VA_HIGHLIGHT_MS;
            // Record first-seen timestamp only once; it ages out after _VA_NEW_THRESHOLD_MS
            if (!firstSeen) _vaSeenMap.set(fp, _now);
            return { ...act, _fp: fp, _isNew: isNew };
        });

        // Build a fingerprint — skip DOM rebuild if nothing changed (including new/not-new state)
        const newKey = itemsWithNew.map(a =>
            `${a._fp}|${a._isNew ? 'N' : ''}`
        ).join(',');
        if (newKey === _tickerLastKey) return;
        _tickerLastKey = newKey;
    }

    // Build item element
    function makeItem(act) {
        const freqMHz = ((act.estimated_dial_freq || act.center_freq) / 1e6).toFixed(3);
        const band    = act.band.toUpperCase();
        const mode    = (act.mode || 'USB').toUpperCase();
        const call    = act.dx_callsign || '';
        const cc      = act.dx_country_code || '';
        const flag    = cc ? iso2ToFlag(cc) : '';
        const isNew   = act._isNew;

        const el = document.createElement('span');
        el.className = 'cond-ticker-item' + (isNew ? ' cond-ticker-item--new' : '');
        // Read back by the delegated click-to-tune handler
        el.dataset.band = act.band || '';
        el.dataset.freq = act.estimated_dial_freq || act.center_freq;
        el.dataset.mode = act.mode || '';
        // Identity across rebuilds, used to re-anchor the scroll position
        el.dataset.fp   = act._fp || '';
        el.innerHTML =
            (isNew ? `<span class="cond-ticker-new-star">★</span>` : '') +
            `<span class="cond-ticker-band">${_escHtml(band)}</span>` +
            `<span class="cond-ticker-freq">${_escHtml(freqMHz)} MHz ${_escHtml(mode)}</span>` +
            (call
                ? `<span class="cond-ticker-flag">${flag}</span><span class="cond-ticker-call">${_escHtml(call)}</span>`
                : `<span class="cond-ticker-call" style="color:#888">Voice</span>`);
        return el;
    }

    // Show ticker so layout is computable
    tickerEl.style.display = 'block';

    // Where the track actually is right now, read back from the compositor
    // instead of reconstructed from timestamps.  Exact, and immune to however
    // long the measuring and rebuilding below takes.
    let curOffset = 0;
    try {
        const t = getComputedStyle(trackEl).transform;
        if (t && t !== 'none') curOffset = -(new DOMMatrixReadOnly(t).m41);
    } catch (_) { /* no transform yet — start from 0 */ }

    // Remember the leftmost item still on screen and where it sits, so it can be
    // pinned back to the same place afterwards.  Items are sorted by frequency,
    // so a new spot lands *mid-list* and pushes everything after it along;
    // preserving only the track offset would slide all of that sideways under
    // the viewport, which is the judder.
    let anchorFp = null, anchorX = 0;
    for (const c of trackEl.children) {
        if (c.offsetLeft + c.offsetWidth > curOffset) {
            anchorFp = c.dataset.fp || null;
            anchorX  = c.offsetLeft - curOffset;   // its x within the viewport
            break;
        }
    }

    // Measure single-copy width using a hidden probe element.
    // getBoundingClientRect is fractional; summing per-child offsetWidth rounded
    // every item to a whole pixel, and that accumulated error is what stopped
    // the loop seam from lining up.
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;display:inline-flex;';
    for (const act of itemsWithNew) probe.appendChild(makeItem(act));
    tickerEl.appendChild(probe);
    const singleW = probe.getBoundingClientRect().width;
    tickerEl.removeChild(probe);

    if (singleW < 10) {
        // Can't measure yet — defer and retry, passing the already-computed items
        // so the seen-map logic doesn't run again and wipe the isNew flags.
        setTimeout(() => _renderVoiceTicker(null, itemsWithNew), 120);
        return;
    }

    // How many copies to fill the viewport with at least one spare
    const viewportW = tickerEl.offsetWidth || 800;
    const copies    = Math.max(2, Math.ceil(viewportW / singleW) + 1);

    // Rebuild DOM
    trackEl.innerHTML = '';
    for (let c = 0; c < copies; c++) {
        for (const act of itemsWithNew) trackEl.appendChild(makeItem(act));
    }

    // Re-anchor: put the item that was at the left edge back exactly where it
    // was.  If it has gone from the list, fall back to holding the track offset.
    let offsetPx = curOffset;
    if (anchorFp) {
        for (const c of trackEl.children) {
            if (c.dataset.fp === anchorFp) { offsetPx = c.offsetLeft - anchorX; break; }
        }
    }
    offsetPx = ((offsetPx % singleW) + singleW) % singleW;   // into [0, singleW)

    const duration = singleW / _TICKER_PX_PER_S;    // seconds for one full cycle
    const delayS   = -(offsetPx / _TICKER_PX_PER_S); // negative delay = start mid-cycle

    // Apply CSS animation.  We set all animation properties via inline style
    // so the keyframe can use --ticker-shift for the translate distance.
    // To force the browser to restart the animation (pick up the new delay),
    // we briefly set animation to 'none', force a reflow, then restore it.
    trackEl.style.setProperty('--ticker-shift', `-${singleW}px`);
    trackEl.style.animation = 'none';
    trackEl.offsetWidth; // force reflow — do NOT remove this line
    trackEl.style.animation = `ticker-scroll ${duration}s ${delayS}s linear infinite`;
}

// ── Flag emoji helper ─────────────────────────────────────────────────────────
function iso2ToFlag(code) {
    if (!code || code.length !== 2) return '';
    const c = code.toUpperCase();
    const base = 0x1F1E6 - 0x41;
    try {
        return String.fromCodePoint(base + c.charCodeAt(0), base + c.charCodeAt(1));
    } catch (e) {
        return '';
    }
}

// ── Hardware + session status fetch ──────────────────────────────────────────
async function _fetchHardwareStatus() {
    const results = await Promise.allSettled([
        _rotatorEnabled   ? fetch('/api/rotctl/status').then(r => r.ok ? r.json() : null)    : Promise.resolve(null),
        _antSwitchEnabled ? fetch('/api/ant-switch/status').then(r => r.ok ? r.json() : null) : Promise.resolve(null),
        fetch('/stats').then(r => r.ok ? r.json() : null)
    ]);
    return {
        rot:     results[0].status === 'fulfilled' ? results[0].value : null,
        ant:     results[1].status === 'fulfilled' ? results[1].value : null,
        session: results[2].status === 'fulfilled' ? results[2].value : null
    };
}

function _renderHardware(hw) {
    const el = document.getElementById('cond-hardware');
    if (!el) return;

    el.innerHTML = '';

    const rot     = hw?.rot;
    const ant     = hw?.ant;
    const session = hw?.session;

    // ── Session row (always shown) ──
    {
        const row = document.createElement('div');
        row.className = 'cond-hw-row';

        const label = document.createElement('span');
        label.className = 'cond-hw-label';
        label.textContent = 'Users';

        const count = session?.active_sessions ?? 0;
        const val = document.createElement('span');
        val.className = 'cond-hw-value';
        val.textContent = count;
        val.title = `${count} active session${count !== 1 ? 's' : ''}`;

        row.appendChild(label);
        row.appendChild(val);

        // Unique country flags
        if (session?.channels && session.channels.length > 0) {
            const codes = [...new Set(
                session.channels
                    .map(c => c.country_code)
                    .filter(Boolean)
            )];
            if (codes.length > 0) {
                const flagsEl = document.createElement('span');
                flagsEl.className = 'cond-hw-flags';
                // One element per flag — joined into a single string they were a
                // lone text node with no break opportunities, so they could never
                // wrap.  Column count is capped at 4 but never exceeds the number
                // of flags, so a short list leaves no empty grid tracks behind.
                flagsEl.style.gridTemplateColumns =
                    `repeat(${Math.min(4, codes.length)}, max-content)`;
                for (const cc of codes) {
                    const f = document.createElement('span');
                    f.textContent = iso2ToFlag(cc);
                    flagsEl.appendChild(f);
                }
                row.appendChild(flagsEl);
            }
        }

        el.appendChild(row);
    }

    // ── Rotator row ──
    if (_rotatorEnabled && rot) {
        const row = document.createElement('div');
        row.className = 'cond-hw-row';

        const label = document.createElement('span');
        label.className = 'cond-hw-label';
        label.textContent = 'Rotator';

        if (!rot.connected) {
            const badge = document.createElement('span');
            badge.className = 'cond-hw-badge stopped';
            badge.textContent = 'Offline';
            row.appendChild(label);
            row.appendChild(badge);
        } else {
            const az = typeof rot.position?.azimuth === 'number'
                ? rot.position.azimuth.toFixed(1) + '°'
                : '—';

            const badge = document.createElement('span');
            badge.className = `cond-hw-badge ${rot.moving ? 'moving' : 'stopped'}`;
            const arrow = _azimuthArrow(rot.position?.azimuth);
            badge.textContent = `${arrow} ${az}`;
            if (rot.moving) badge.title = 'Rotating…';

            row.appendChild(label);
            row.appendChild(badge);
        }
        el.appendChild(row);
    }

    // ── Ant-switch row ──
    if (_antSwitchEnabled && ant) {
        const row = document.createElement('div');
        row.className = 'cond-hw-row';

        const label = document.createElement('span');
        label.className = 'cond-hw-label';
        label.textContent = 'Antenna';

        const badge = document.createElement('span');

        if (ant.grounded) {
            badge.className = 'cond-hw-badge grounded';
            badge.textContent = '⚡ Grounded';
        } else {
            const selected = Array.isArray(ant.selected) ? ant.selected : [];
            const labels   = Array.isArray(ant.antenna_labels) ? ant.antenna_labels : [];
            if (selected.length === 0) {
                badge.className = 'cond-hw-badge stopped';
                badge.textContent = 'None';
            } else {
                const names = selected.map(n => labels[n - 1] || `Ant ${n}`);
                badge.className = 'cond-hw-badge active';
                badge.textContent = names.join(', ');
                badge.title = names.join(', ');
            }
        }

        row.appendChild(label);
        row.appendChild(badge);
        el.appendChild(row);
    }

    el.style.display = '';
}

// Returns a simple Unicode compass arrow for an azimuth in degrees
function _azimuthArrow(az) {
    if (az === null || az === undefined) return '↑';
    const dirs = ['↑','↗','→','↘','↓','↙','←','↖'];
    return dirs[Math.round(((az % 360) + 360) % 360 / 45) % 8];
}

async function _refreshHardware() {
    try {
        const hw = await _fetchHardwareStatus();
        _renderHardware(hw);

        // Listener markers come from the same payload as the Users count.
        const channels = (hw && hw.session && Array.isArray(hw.session.channels))
            ? hw.session.channels : [];
        const changed = JSON.stringify(channels.map(c => [c.frequency, c.country_code]))
                     !== JSON.stringify(_userChannels.map(c => [c.frequency, c.country_code]));
        _userChannels = channels;
        // Only force a redraw when who-is-where actually changed: the poll runs
        // every 5 s and the panels are otherwise redrawn on their own schedule.
        if (changed && showUsers) {
            for (const p of Object.values(panels)) p.dirty = true;
        }
        // Adjust body padding in case the bar height changed
        const bar = document.getElementById('conditions-bar');
        if (bar && bar.style.display !== 'none') {
            requestAnimationFrame(() => {
                document.body.style.paddingBottom = bar.offsetHeight + 'px';
                scheduleLayout(); // conditions bar height changes the space 'fit' can use
            });
        }
    } catch (err) {
        console.warn('[conditions] hardware refresh error:', err);
    }
}

function _startHardwareTimer() {
    if (_hwTimer !== null) return;
    _refreshHardware();                                   // immediate first fetch
    _hwTimer = setInterval(_refreshHardware, 5_000);     // every 5 s
}

function _escHtml(str) {
    return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
}

function _windDir(deg) {
    if (deg === null || deg === undefined) return '';
    return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg / 45) % 8];
}

function _renderConditions(bandStates, sw, wx) {
    const bar = document.getElementById('conditions-bar');
    if (!bar) return;

    // ── Band pills ──
    const bandsEl = document.getElementById('cond-bands');
    if (bandsEl) {
        bandsEl.innerHTML = '';
        const bands = allBands.length > 0 ? allBands : _COND_BANDS_FALLBACK;
        let anyBand = false;
        for (const band of bands) {
            const st = bandStates ? bandStates[band] : null;
            if (!st) continue;
            anyBand = true;
            const cls    = st.status;
            const snrTxt = st.snr !== null ? st.snr.toFixed(1) : '—';
            const pill   = document.createElement('div');
            pill.className = `cond-band-pill ${cls}`;
            pill.title = `${band.toUpperCase()} · FT8 SNR ${snrTxt} dB (10-min avg)`;
            pill.innerHTML =
                `<span class="cpill-name">${band.toUpperCase()}</span>` +
                `<span class="cpill-snr">${snrTxt}</span>`;
            bandsEl.appendChild(pill);
        }
        if (!anyBand) {
            bandsEl.innerHTML = '<span style="color:#555;font-size:0.8em">Band data unavailable</span>';
        }
    }

    // ── Local weather ──
    const wxEl = document.getElementById('cond-weather');
    if (wxEl) {
        if (wx && wx.weather && wx.weather.length > 0) {
            wxEl.style.display = '';
            wxEl.innerHTML = '';

            const iconCode  = wx.weather[0].icon;
            const desc      = wx.weather[0].description
                .split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            const tempC     = wx.main?.temp     !== undefined ? Math.round(wx.main.temp)       : null;
            const feelsLike = wx.main?.feels_like !== undefined ? Math.round(wx.main.feels_like) : null;
            const humidity  = wx.main?.humidity  !== undefined ? wx.main.humidity               : null;
            const pressure  = wx.main?.pressure  !== undefined ? wx.main.pressure               : null;
            const windMs    = wx.wind?.speed     !== undefined ? wx.wind.speed                  : null;
            const windKmh   = windMs !== null ? Math.round(windMs * 3.6) : null;
            const windDeg   = wx.wind?.deg       !== undefined ? wx.wind.deg                    : null;
            const gustMs    = wx.wind?.gust      !== undefined ? wx.wind.gust                   : null;
            const gustKmh   = gustMs !== null ? Math.round(gustMs * 3.6) : null;

            const img = document.createElement('img');
            img.className = 'cond-wx-icon';
            img.src = `/weather/${iconCode}_t.png`;
            img.alt = desc;
            img.onerror = () => img.style.display = 'none';
            wxEl.appendChild(img);

            const info = document.createElement('div');
            info.className = 'cond-wx-info';

            const descEl = document.createElement('div');
            descEl.className = 'cond-wx-desc';
            descEl.textContent = desc;
            info.appendChild(descEl);

            const chips = document.createElement('div');
            chips.className = 'cond-wx-chips';

            const addChip = (icon, val, title) => {
                if (val === null || val === undefined) return;
                const c = document.createElement('span');
                c.className = 'cond-wx-chip';
                c.title = title || '';
                c.innerHTML = `${icon} <strong>${val}</strong>`;
                chips.appendChild(c);
            };

            if (tempC !== null) {
                const tip = feelsLike !== null ? `Feels like ${feelsLike}°C` : 'Temperature';
                addChip('🌡️', `${tempC}°C`, tip);
            }
            if (humidity !== null) addChip('💧', `${humidity}%`, 'Relative humidity');
            if (pressure !== null) addChip('🔵', `${pressure} hPa`, 'Atmospheric pressure');
            if (windKmh !== null) {
                const dir = _windDir(windDeg);
                const gust = gustKmh !== null ? ` (gusts ${gustKmh})` : '';
                addChip('💨', `${windKmh} km/h${dir ? ' ' + dir : ''}${gust}`, 'Wind speed');
            }

            info.appendChild(chips);
            wxEl.appendChild(info);
        } else {
            wxEl.style.display = 'none';
        }
    }

    // ── Space weather ──
    const swEl = document.getElementById('cond-sw');
    if (swEl) {
        if (sw) {
            swEl.innerHTML = '';
            swEl.style.display = '';

            const solarFlux = sw.solar_flux      !== undefined ? Math.round(sw.solar_flux)   : null;
            const kIndex    = sw.k_index         !== undefined ? sw.k_index                  : null;
            const aIndex    = sw.a_index         !== undefined ? sw.a_index                  : null;
            const bz        = sw.solar_wind_bz   !== undefined ? sw.solar_wind_bz.toFixed(1) : null;
            const propQual  = sw.propagation_quality || null;
            const kStatus   = sw.k_index_status  || null;

            const rows = [
                { label: 'Solar Flux',    value: solarFlux !== null ? `${solarFlux} SFU` : '—' },
                { label: 'K-Index',       value: kIndex    !== null ? `${kIndex}${kStatus ? ' · ' + kStatus : ''}` : '—' },
                { label: 'A-Index',       value: aIndex    !== null ? `${aIndex}` : '—' },
                { label: 'Solar Wind Bz', value: bz        !== null ? `${bz} nT` : '—' },
            ];

            for (const row of rows) {
                const div = document.createElement('div');
                div.className = 'cond-sw-row';
                div.innerHTML = `<span class="cond-sw-label">${row.label}</span><span class="cond-sw-value">${row.value}</span>`;
                swEl.appendChild(div);
            }

            if (propQual) {
                const div = document.createElement('div');
                div.className = 'cond-sw-row';
                const cls = _swPropClass(propQual);
                div.innerHTML = `<span class="cond-sw-label">Propagation</span><span class="cond-sw-badge ${cls}">${_escHtml(propQual)}</span>`;
                swEl.appendChild(div);
            }
        } else {
            swEl.style.display = 'none';
        }
    }



    bar.style.display = '';
    // Adjust body bottom padding so the fixed bar never covers content
    requestAnimationFrame(() => {
        document.body.style.paddingBottom = bar.offsetHeight + 'px';
        scheduleLayout(); // conditions bar height changes the space 'fit' can use
    });
}

// ── Leaderboard ranks (PSK / WSPR / RBN) ─────────────────────────────────────
// Served from /api/stats/rank-summary, which reads the server's in-memory
// caches — cheap enough to poll alongside the other conditions data. The card
// stays hidden unless at least one rank is actually available: a receiver that
// reports to none of these leaderboards should not carry an empty box.

let _rankStats = null;

async function _fetchRankSummary() {
    const resp = await fetch('/api/stats/rank-summary');
    if (!resp.ok) return null;
    return await resp.json();
}

// _rankRow builds one "LABEL  #12 spots · #45 DXCC" line, or null when the
// component has no rank to show (not fetched yet, or we are not on its board).
function _rankRow(label, title, parts) {
    const shown = parts.filter(p => p && p.rank > 0);
    if (shown.length === 0) return null;

    const row = document.createElement('div');
    row.className = 'cond-hw-row';
    row.title = title;

    const labelEl = document.createElement('span');
    labelEl.className = 'cond-hw-label';
    labelEl.textContent = label;
    row.appendChild(labelEl);

    const val = document.createElement('span');
    val.className = 'cond-hw-value';
    shown.forEach(function(part, i) {
        // Nothing precedes the first entry — including a line break, which would
        // otherwise leave an empty first line when earlier entries are absent.
        if (i > 0) {
            if (part.newline) {
                val.appendChild(document.createElement('br'));
            } else {
                const sep = document.createElement('span');
                sep.className = 'cond-stat-sep';
                sep.textContent = '·';
                val.appendChild(sep);
            }
        }
        const rank = document.createElement('span');
        rank.className = 'cond-stat-rank';
        rank.textContent = '#' + part.rank;
        val.appendChild(rank);

        if (part.unit) {
            const unit = document.createElement('span');
            unit.className = 'cond-stat-unit';
            unit.textContent = part.unit;
            val.appendChild(unit);
        }
    });
    row.appendChild(val);
    return row;
}

// _rankOf pulls one position out of the summary, tolerating a missing section.
function _rankOf(section, key, unit, newline) {
    const pos = section && section.available ? section[key] : null;
    if (!pos) return null;
    return {
        rank: pos.rank || 0, value: pos.value || 0, total: pos.total || 0,
        unit: unit, newline: !!newline,
    };
}

function _renderRankStats(data) {
    const el = document.getElementById('cond-stats');
    if (!el) return;

    el.innerHTML = '';
    if (!data) { el.style.display = 'none'; return; }

    const psk  = data.psk  || null;
    const wspr = data.wspr || null;
    const rbn  = data.rbn  || null;

    const pskSpots  = _rankOf(psk,  'reports',     'spots');
    const pskDXCC   = _rankOf(psk,  'countries',   'DXCC');
    const wspr24    = _rankOf(wspr, 'rolling_24h', '24h');
    const wsprYest  = _rankOf(wspr, 'yesterday',   'yest');
    // Three WSPR windows on one line is what makes this card wide; today drops
    // to a second line, where there is spare height going free.
    const wsprToday = _rankOf(wspr, 'today',       'today', true);
    const rbnSpots  = _rankOf(rbn,  'spots',       '');

    // Totals go in the tooltip so the row itself stays to just the ranks.
    const scale = p => (p && p.total ? ' of ' + p.total : '');

    const rows = [
        _rankRow('PSK', 'PSK Reporter, last 24 h — rank by spots reported' +
            (pskSpots ? ' (#' + pskSpots.rank + scale(pskSpots) + ', ' + pskSpots.value + ' spots)' : '') +
            (pskDXCC ? ', and by countries heard (#' + pskDXCC.rank + scale(pskDXCC) + ', ' + pskDXCC.value + ' countries)' : ''),
            [pskSpots, pskDXCC]),
        _rankRow('WSPR', 'WSPR Live — rank by unique spots over the rolling 24 h, yesterday, and today' +
            (wspr24 ? '. Rolling 24 h: #' + wspr24.rank + scale(wspr24) + ' with ' + wspr24.value + ' unique spots' : ''),
            [wspr24, wsprYest, wsprToday]),
        _rankRow('RBN', 'Reverse Beacon Network — rank among all skimmers by cumulative spot count' +
            (rbnSpots ? ' (#' + rbnSpots.rank + scale(rbnSpots) + ', ' + rbnSpots.value.toLocaleString() + ' spots)' : ''),
            [rbnSpots]),
    ].filter(Boolean);

    if (rows.length === 0) { el.style.display = 'none'; return; }
    for (const row of rows) el.appendChild(row);
    el.style.display = 'flex';
}

// _syncConditionsPadding re-measures the fixed conditions bar and keeps the
// body's bottom padding equal to it, so the bar never covers page content.
function _syncConditionsPadding() {
    const bar = document.getElementById('conditions-bar');
    if (!bar || bar.style.display === 'none') return;
    requestAnimationFrame(() => {
        document.body.style.paddingBottom = bar.offsetHeight + 'px';
        scheduleLayout(); // bar height changes the space 'fit' can use
    });
}

async function _refreshConditions() {
    try {
        const [bandResult, swResult, wxResult, rankResult] = await Promise.allSettled([
            _fetchBandConditions(),
            _fetchSpaceWeather(),
            _fetchWeather(),
            _fetchRankSummary()
        ]);
        const bs     = bandResult.status === 'fulfilled' ? bandResult.value : null;
        const swData = swResult.status   === 'fulfilled' ? swResult.value   : null;
        const wxData = wxResult.status   === 'fulfilled' ? wxResult.value   : null;
        _renderConditions(bs, swData, wxData);
        // Keep the last good summary if this fetch failed, rather than blanking.
        if (rankResult.status === 'fulfilled' && rankResult.value) _rankStats = rankResult.value;
        _renderRankStats(_rankStats);
    } catch (err) {
        console.warn('[conditions] refresh error:', err);
    }
}

function _startConditionsTimer() {
    if (_condTimer !== null) return;
    _refreshConditions();                              // immediate first fetch
    _condTimer = setInterval(_refreshConditions, 5 * 60 * 1000); // every 5 min
}

function _startWatchdog() {
    if (_watchdogTimer !== null) return;
    _watchdogTimer = setInterval(() => {
        if (activeBands.size === 0) return;
        if (_lastEventTime === 0) return; // haven't connected yet
        if (Date.now() - _lastEventTime > _STALE_MS) {
            console.warn('[band-activity] stale SSE connection — reconnecting');
            _lastEventTime = 0;
            connectSSE();
        }
    }, 10_000); // check every 10 s
}

// ── Page-visibility reconnect ─────────────────────────────────────────────────
// When the tab becomes visible again after being hidden, reconnect immediately
// rather than waiting for the backoff timer.
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && activeBands.size > 0) {
        // Only reconnect if we're not already live
        if (!sse || sse.readyState === EventSource.CLOSED) {
            _sseRetryDelay = 2000; // reset backoff
            connectSSE();
        }
    }
});

// ── Initialisation ────────────────────────────────────────────────────────────
async function init() {
    setStatus('wait', 'Loading band config…');

    // Fetch receiver description (callsign / name / location / hardware flags) — best-effort, non-fatal
    try {
        const descResp = await fetch('/api/description');
        if (descResp.ok) {
            const desc = await descResp.json();
            const rx = desc.receiver || {};
            const callsign = (rx.callsign || '').trim();
            const name     = (rx.name     || '').trim();
            const location = (rx.location || '').trim();

            if (callsign) {
                document.getElementById('receiver-callsign').textContent = callsign;
                document.title = `Band Activity Monitor - ${callsign}`;
            }
            if (name) {
                document.getElementById('receiver-name').textContent = name;
            }
            if (location) {
                document.getElementById('receiver-location').textContent = location ? `· ${location}` : '';
            }

            // Detect hardware features for the conditions bar
            _rotatorEnabled   = !!(desc.rotator?.enabled);
            _antSwitchEnabled = !!(desc.ant_switch?.enabled);

            // Receiver local timezone offset (minutes east of UTC)
            const tzOffset = desc.receiver?.timezone_offset;
            if (typeof tzOffset === 'number') _localTzOffsetMin = tzOffset;
            _cwEnabled        = !!(desc.cw_skimmer);
        }
    } catch(_) { /* non-fatal — receiver info is cosmetic */ }

    let cfg;
    try {
        const resp = await fetch('/api/noisefloor/config');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        cfg = await resp.json();
    } catch(err) {
        setStatus('error', `Failed to load config: ${err.message}`);
        return;
    }

    if (!cfg.bands || cfg.bands.length === 0) {
        setStatus('error', 'No bands configured on server');
        return;
    }

    // Build metadata map and ordered list, sorted by start frequency (lowest first)
    allBands = [];
    for (const b of cfg.bands) {
        bandMeta[b.name] = b;
        allBands.push(b.name);
    }
    allBands.sort((a, b) => bandMeta[a].start - bandMeta[b].start);

    // Wideband metadata lives in its own top-level field, not cfg.bands — kept
    // out of allBands deliberately (see WIDEBAND_NAME).
    if (cfg.wideband) bandMeta[WIDEBAND_NAME] = cfg.wideband;

    // Load saved preferences (which bands were active, dB range)
    loadPrefs();
    // Re-assert outside loadPrefs's try/catch: if localStorage threw part-way,
    // the toolbar must still match whatever dbAuto actually ended up as.
    applyDbAutoUI();

    // Default: prefer the key HF ham bands; fall back to all bands if none exist
    if (activeBands.size === 0) {
        const preferred = ['40m', '20m', '15m', '10m'];
        for (const name of preferred) {
            if (bandMeta[name]) activeBands.add(name);
        }
        // If none of the preferred bands are configured, show everything
        if (activeBands.size === 0) {
            for (const name of allBands) activeBands.add(name);
        }
    }

    // Build band pills. Wideband goes first and outside the "All" selection —
    // not part of allBands, so it's never included in that loop below, and the
    // user must click it explicitly to enable it (see WIDEBAND_NAME).
    const pillsEl = document.getElementById('band-pills');
    if (bandMeta[WIDEBAND_NAME]) {
        const meta = bandMeta[WIDEBAND_NAME];
        const pill = document.createElement('button');
        pill.className = 'band-pill wideband-pill' + (activeBands.has(WIDEBAND_NAME) ? ' active' : '');
        pill.dataset.band = WIDEBAND_NAME;
        pill.textContent = 'WIDE';
        pill.title = `Wideband · ${(meta.start/1e6).toFixed(3)}–${(meta.end/1e6).toFixed(3)} MHz · ${meta.bin_count} bins · ${meta.bin_bandwidth} Hz/bin (not included in "All")`;
        pill.addEventListener('click', () => toggleBand(WIDEBAND_NAME));
        pillsEl.appendChild(pill);
    }
    for (const name of allBands) {
        const pill = document.createElement('button');
        pill.className = 'band-pill' + (activeBands.has(name) ? ' active' : '');
        pill.dataset.band = name;
        const meta = bandMeta[name];
        const bwKHz = Math.round(meta.bin_bandwidth * meta.bin_count / 1000);
        pill.textContent = name.toUpperCase();
        pill.title = `${(meta.start/1e6).toFixed(3)}–${(meta.end/1e6).toFixed(3)} MHz · ${meta.bin_count} bins · ${meta.bin_bandwidth} Hz/bin`;
        pill.addEventListener('click', () => toggleBand(name));
        pillsEl.appendChild(pill);
    }

    // All / None buttons
    document.getElementById('btn-all').addEventListener('click', () => {
        activeBands = new Set(allBands);
        updatePills();
        rebuildPanels();
        savePrefs();
    });
    document.getElementById('btn-none').addEventListener('click', () => {
        activeBands = new Set();
        updatePills();
        rebuildPanels();
        savePrefs();
    });

    // dB range controls
    document.getElementById('db-min').addEventListener('change', e => {
        dbMin = parseFloat(e.target.value) || -130;
        savePrefs();
        // Re-colour history too, so the whole waterfall shares one scale
        for (const p of Object.values(panels)) p._rangeChanged();
    });
    document.getElementById('db-max').addEventListener('change', e => {
        dbMax = parseFloat(e.target.value) || -60;
        savePrefs();
        for (const p of Object.values(panels)) p._rangeChanged();
    });

    // Manual / auto dB range toggle
    document.getElementById('db-auto').addEventListener('click', () => {
        dbAuto = !dbAuto;
        applyDbAutoUI();
        savePrefs();
        for (const p of Object.values(panels)) p._rangeChanged();
    });

    // Minimum dynamic range for auto mode
    document.getElementById('db-span').addEventListener('change', e => {
        const v = parseFloat(e.target.value);
        dbAutoMinSpan = Math.max(AUTO_SPAN_MIN,
                                 Math.min(AUTO_SPAN_MAX, isNaN(v) ? AUTO_SPAN_DEFAULT : v));
        e.target.value = dbAutoMinSpan;   // reflect the clamp back to the user
        savePrefs();
        for (const p of Object.values(panels)) p._rangeChanged();
    });

    // Palette selector
    document.getElementById('palette-select').addEventListener('change', e => {
        currentPalette = e.target.value;
        CMAP = buildCMAP(currentPalette);
        _paletteVersion++;   // makes each panel re-colour its cached waterfall
        savePrefs();
        // Redraw all panels with the new colour map
        for (const p of Object.values(panels)) p.dirty = true;
    });

    // Click-to-tune from CW spot badges and the voice activity ticker.
    // Delegated to the containers: both rebuild their children constantly (the
    // ticker renders several duplicated copies for the marquee), so per-element
    // listeners would be re-attached on every refresh.
    const cwStrip = document.getElementById('cond-cw-spots');
    if (cwStrip) cwStrip.addEventListener('click', e => {
        const badge = e.target.closest('.cond-cw-badge');
        if (!badge || !badge.dataset.band) return;
        const hz = parseFloat(badge.dataset.freq);
        _tuneFromSpot(badge.dataset.band, hz, _cwModeForFreq(hz));
    });

    const tickerTrack = document.getElementById('cond-ticker-track');
    if (tickerTrack) tickerTrack.addEventListener('click', e => {
        const item = e.target.closest('.cond-ticker-item');
        if (!item || !item.dataset.band) return;
        const hz = parseFloat(item.dataset.freq);
        // The ticker reports its own mode (it already displays it); fall back to
        // the sideband convention if it is missing or unrecognised.
        const m = (item.dataset.mode || '').toLowerCase();
        _tuneFromSpot(item.dataset.band, hz,
                      _VALID_MODES.has(m) ? m : _voiceModeForFreq(hz));
    });

    // Peak marker toggle
    document.getElementById('show-peaks').addEventListener('change', e => {
        showPeaks = e.target.checked;
        savePrefs();
        for (const p of Object.values(panels)) p.dirty = true;
    });

    // Spot filter — restrict the CW badges and voice ticker to selected bands
    document.getElementById('filter-spots').addEventListener('change', e => {
        filterSpots = e.target.checked;
        savePrefs();
        _refreshSpotFilters();
    });

    // Listener markers on the spectra
    document.getElementById('show-users').addEventListener('change', e => {
        showUsers = e.target.checked;
        savePrefs();
        for (const p of Object.values(panels)) p.dirty = true;
    });

    // Layout (grid arrangement) selector
    document.getElementById('layout-select').addEventListener('change', e => {
        currentLayout = e.target.value;
        savePrefs();
        applyLayout();
    });

    // Single global resize handler — relayouts the grid, then resizes every
    // panel's canvases to match.
    window.addEventListener('resize', scheduleLayout);
    // The conditions bar is fixed, so the body carries bottom padding equal to
    // its height. Crossing the mobile breakpoint changes that height without any
    // render happening, so keep the padding in step with it.
    window.addEventListener('resize', _syncConditionsPadding);

    // Build initial panels and connect SSE
    rebuildPanels();

    // Start stale-connection watchdog (checks every 10 s, fires after 45 s silence)
    _startWatchdog();
    // Start 1s status text timer (decoupled from data events so it never flickers)
    _startStatusTimer();
    // Start band conditions + space weather panel (refreshes every 5 min)
    _startConditionsTimer();
    // Start rotator / ant-switch status poll (refreshes every 5 s)
    _startHardwareTimer();
    // Start SDR front-end status poll (refreshes every 5 s)
    _startFrontendStatusTimer();
    // Start voice activity ticker (refreshes every 5 s)
    _startVoiceTickerTimer();
    // Start CW spots SSE stream (if CW skimmer is enabled)
    _startCWSpots();
    // Start the notification stream (hidden unless the operator enabled it)
    _startNotifications();
}

init();
</script>

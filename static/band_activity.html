<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Band Activity Monitor</title>
<script src="opus-decoder.min.js"></script>
<script src="minimal-radio.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
}

/* ── Top bar ── */
#topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #111118;
    border-bottom: 1px solid #222;
    flex-wrap: wrap;
    position: relative;   /* anchors the floating notification overlay */
}

#topbar h1 {
    font-size: 1.1em;
    font-weight: 600;
    color: #7ec8e3;
    white-space: nowrap;
    margin-right: 4px;
}

#receiver-info {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8em;
    white-space: nowrap;
    overflow: hidden;
}
#receiver-callsign {
    font-weight: 700;
    color: #a0d8a0;
    font-size: 0.85em;   /* slightly smaller than the h1 title */
}
#receiver-name {
    color: #aaa;
}
#receiver-location {
    color: #777;
}

#status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
    transition: background 0.4s;
}
#status-dot.live   { background: #4caf50; box-shadow: 0 0 6px #4caf5088; }
#status-dot.error  { background: #f44336; }
#status-dot.wait   { background: #ff9800; }

#status-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;          /* fill remaining space on the first topbar row */
    min-width: 0;
}

#status-text {
    font-size: 0.82em;
    color: #888;
    white-space: nowrap;
}

#utc-clock {
    margin-left: auto;   /* push to far right of the status row */
    font-size: 1.05em;
    font-weight: 700;
    line-height: 1;      /* keep layout height the same as surrounding text */
    color: #7ec8e3;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    letter-spacing: 0.03em;
}

#local-clock {
    font-size: 1.05em;
    font-weight: 700;
    line-height: 1;
    color: #a0d8a0;      /* same greenish as receiver callsign */
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    letter-spacing: 0.03em;
}

/* ── Notification stream ── */
/* A tiny indicator rides beside the clocks; the alerts themselves float below
   the topbar so they never change its height or force it to wrap. */
#notif-badge {
    display: none;            /* revealed only when the stream is reachable */
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
}
#notif-badge .notif-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
    transition: background 0.4s;
}
#notif-badge .notif-dot.live  { background: #4caf50; box-shadow: 0 0 5px #4caf5088; }
#notif-badge .notif-dot.error { background: #f44336; }
#notif-badge .notif-dot.wait  { background: #ff9800; }

#btn-notif-key {
    background: none;
    border: 1px solid #2a2a36;
    border-radius: 4px;
    color: #888;
    font-size: 0.78em;
    line-height: 1;
    padding: 2px 4px;
    cursor: pointer;
}
#btn-notif-key:hover { border-color: #555; color: #ccc; }

#notif-panel {
    /* Toast stack: floats just under the clocks, over whatever is below — so it
       costs no layout space whether or not it has anything in it. The container
       itself is invisible; each toast carries its own chrome. */
    display: none;
    position: absolute;
    /* Just below the clocks, not below the whole topbar — which is several rows
       tall once the band pills and controls wrap. _notifPosition() measures the
       exact offset; this is only the value used before it first runs. */
    top: 34px;
    right: 16px;
    z-index: 60;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    width: max-content;
    max-width: calc(100vw - 32px);
    /* The stack overlays the topbar controls, so only the toasts themselves
       take clicks — the gaps between them stay see-through to what is below. */
    pointer-events: none;
}
#notif-auth, #notif-auth-msg, #notif-list { pointer-events: auto; }

/* Password prompt — same corner, but it stays until it is dealt with. */
#notif-auth {
    display: none;
    align-items: center;
    gap: 5px;
    padding: 6px 8px;
    background: rgba(14, 14, 21, 0.97);
    border: 1px solid #2a2a3a;
    border-radius: 6px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.6);
}
/* Scoped to the password field: a bare `input` selector here also caught the
   Ding checkbox and stretched it to the same 180px box. */
#notif-password {
    background: #0d0d14;
    border: 1px solid #333;
    border-radius: 4px;
    color: #ddd;
    padding: 3px 6px;
    font-size: 0.75em;
    width: 180px;
    min-width: 0;
}
#notif-password:focus { outline: none; border-color: #7ec8e3; }
#notif-ding-label {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 0.72em;
    color: #aaa;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
}
#notif-ding-label input {
    width: auto;
    margin: 0;
    cursor: pointer;
}

#notif-auth button {
    padding: 3px 9px;
    border-radius: 4px;
    border: 1px solid #333;
    background: #1a1a24;
    color: #aaa;
    font-size: 0.72em;
    cursor: pointer;
    white-space: nowrap;
}
#notif-auth button:hover { border-color: #555; color: #ddd; }

#notif-auth-msg {
    display: none;
    font-size: 0.7em;
    color: #e57373;
    background: rgba(14, 14, 21, 0.97);
    border: 1px solid #3a2626;
    border-radius: 4px;
    padding: 3px 7px;
}

#notif-list {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    cursor: pointer;
    max-width: 100%;
}

.notif-item {
    display: flex;
    gap: 6px;
    align-items: baseline;
    max-width: min(420px, 100%);
    padding: 5px 9px;
    background: rgba(21, 21, 30, 0.97);
    border: 1px solid #2a2a3a;
    border-left: 2px solid #7ec8e3;
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
    font-size: 0.74em;
    line-height: 1.35;
    color: #c8c8d0;
}
.notif-item .notif-time {
    color: #666;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
}
.notif-item .notif-text {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;   /* full text in the tooltip */
    line-clamp: 2;
    overflow: hidden;
    word-break: break-word;
}

/* Toasts slide in from the right edge and leave the same way. The timings are
   set inline from _NOTIF_TTL_MS / _NOTIF_FADE_MS so they cannot drift apart
   from the timer that removes the element. */
@keyframes notifIn {
    from { opacity: 0; transform: translateX(14px); }
    to   { opacity: 1; transform: none; }
}
@keyframes notifOut {
    from { opacity: 1; transform: none; }
    to   { opacity: 0; transform: translateX(14px); }
}

/* band selector pills — always on their own row when the topbar wraps */
#band-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1 1 100%;   /* grow to fill, but also force a new row when topbar wraps */
    min-width: 0;
}

.band-pill {
    padding: 3px 10px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #1a1a24;
    color: #aaa;
    font-size: 0.78em;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
    white-space: nowrap;
}
.band-pill.active {
    border-color: #7ec8e3;
    background: #1a2a34;
    color: #7ec8e3;
}
.band-pill:hover { border-color: #555; }

/* Wideband pill — visually distinct from named-band pills since it's a
   separate 0-30 MHz channel, not part of the "All" bulk selection, and a
   small gap from the regular pills reinforces that it's not one of them. */
.wideband-pill {
    margin-right: 10px;
    border-color: #7a5a2e;
    color: #d9a15b;
}
.wideband-pill.active {
    border-color: #d9a15b;
    background: #34240f;
    color: #f0b96e;
}
.wideband-pill:hover { border-color: #e0b370; }

#btn-all, #btn-none {
    padding: 3px 10px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1a24;
    color: #aaa;
    font-size: 0.78em;
    cursor: pointer;
    white-space: nowrap;
}
#btn-all:hover, #btn-none:hover { border-color: #555; color: #ddd; }

/* dB range controls */
#range-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8em;
    color: #888;
    white-space: nowrap;
}
#range-controls input[type=number] {
    width: 56px;
    padding: 2px 5px;
    background: #1a1a24;
    border: 1px solid #333;
    border-radius: 4px;
    color: #ccc;
    font-size: 0.9em;
    text-align: center;
}
/* swap the manual min/max for the auto span setting */
#range-controls .auto-only   { display: none; }
#range-controls.auto .manual-only { display: none; }
#range-controls.auto .auto-only   { display: inline; }

#db-auto {
    padding: 3px 10px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1a24;
    color: #aaa;
    font-size: 0.95em;
    cursor: pointer;
    white-space: nowrap;
}
#db-auto:hover { border-color: #555; color: #ddd; }
#db-auto.active {
    border-color: #7ec8e3;
    background: #1a2a34;
    color: #7ec8e3;
}

/* palette selector */
#palette-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8em;
    color: #888;
    white-space: nowrap;
}
#palette-select {
    padding: 2px 6px;
    background: #1a1a24;
    border: 1px solid #333;
    border-radius: 4px;
    color: #ccc;
    font-size: 0.9em;
    cursor: pointer;
    appearance: auto;
}
#palette-select:focus { outline: none; border-color: #555; }

/* layout (grid arrangement) selector — same styling as the palette control */
#layout-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8em;
    color: #888;
    white-space: nowrap;
}
#layout-select {
    padding: 2px 6px;
    background: #1a1a24;
    border: 1px solid #333;
    border-radius: 4px;
    color: #ccc;
    font-size: 0.9em;
    cursor: pointer;
    appearance: auto;
}
#layout-select:focus { outline: none; border-color: #555; }

/* peak marker toggle */
#peaks-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.8em;
    color: #888;
    white-space: nowrap;
}
#peaks-controls label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
}
#peaks-controls input[type=checkbox] {
    cursor: pointer;
    accent-color: #7ec8e3;
}

@keyframes audio-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(229,115,115,0); }
    50%       { box-shadow: 0 0 6px 2px rgba(229,115,115,0.35); }
}

/* stop button on band header (shown while audio is playing) */
.band-stop-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 7px;
    border-radius: 10px;
    border: 1px solid #e57373;
    background: #2a1a1a;
    color: #e57373;
    font-size: 0.72em;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    margin-right: 6px;
    animation: audio-pulse 1.2s ease-in-out infinite;
    line-height: 1.4;
}
.band-stop-btn:hover { background: #3a1a1a; border-color: #ef9a9a; color: #ef9a9a; }

/* ── Grid of band panels ── */
#grid {
    --grid-gap: 10px;
    --spec-h: 80px;   /* overridden by applyLayout() in non-auto modes */
    --wf-h: 120px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: var(--grid-gap);
    padding: 10px;
}

/* Explicit column count (Fit / 1-6) uses flexbox rather than grid.  Grid places
   items into fixed tracks, so a partial last row is stuck against the left edge
   with a gap on the right and no per-row alignment to fix it.  Flexbox has no
   tracks: it fills a line, wraps, and justify-content aligns each line on its
   own — full lines exactly fill the width so centring is a no-op for them, and
   only the short last line moves. */
#grid.grid-fixed {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}
/* A percentage flex-basis resolves against the container's content box, which
   is the same width applyLayout() solves against — so the browser does the
   division and there is no rounding drift that could wrap a card early. */
#grid.grid-fixed .band-panel {
    flex: 0 0 calc((100% - (var(--grid-cols, 3) - 1) * var(--grid-gap)) / var(--grid-cols, 3));
    /* The flex equivalent of grid's minmax(0, 1fr): without it a flex item's
       automatic minimum size is content-based, and a wide band header could
       push a card past its basis and wrap a column early. */
    min-width: 0;
}

/* ── Individual band panel ── */
.band-panel {
    background: #111118;
    border: 1px solid #1e1e2e;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.band-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
    background: #16161f;
    border-bottom: 1px solid #1e1e2e;
    font-size: 0.82em;
}

.band-name {
    font-weight: 700;
    color: #7ec8e3;
    font-size: 1em;
}

.band-freq-range {
    color: #666;
    font-size: 0.85em;
}

.band-stats {
    display: flex;
    gap: 10px;
    font-size: 0.78em;
    color: #888;
}

.band-stats span { white-space: nowrap; }
.band-stats .val {
    color: #ccc;
    font-weight: 600;
    display: inline-block;
    min-width: 4.5ch;        /* wide enough for "-102.5" */
    text-align: right;
    font-variant-numeric: tabular-nums;
}

/* spectrum line canvas */
.spectrum-canvas {
    display: block;
    width: 100%;
    height: var(--spec-h, 80px);
    background: #0a0a0f;
    cursor: crosshair;
}

/* waterfall canvas */
.waterfall-canvas {
    display: block;
    width: 100%;
    height: var(--wf-h, 120px);
    background: #000;
    image-rendering: pixelated;
}

/* zoom overlay canvas — sits on top of spec+wf, pointer-events only when dragging */
.zoom-overlay {
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    pointer-events: none;
    z-index: 10;
}

/* wrapper that holds spec+wf+overlay stacked */
.canvas-stack {
    position: relative;
    display: flex;
    flex-direction: column;
}

/* frequency axis */
.freq-axis {
    height: 18px;
    background: #0d0d14;
    position: relative;
    font-size: 0.65em;
    color: #555;
    border-top: 1px solid #1a1a24;
    overflow: visible;
}

.freq-label {
    position: absolute;
    transform: translateX(-50%);
    top: 4px;
    white-space: nowrap;
    color: #888;
    font-size: 0.9em;
}
/* tick mark above each label */
.freq-label::before {
    content: '';
    position: absolute;
    left: 50%;
    top: -4px;
    transform: translateX(-50%);
    width: 1px;
    height: 3px;
    background: #444;
}
/* first label: left-align so it doesn't clip */
.freq-label.first {
    transform: none;
}
.freq-label.first::before { left: 0; transform: none; }
/* last label: right-align so it doesn't clip */
.freq-label.last {
    transform: translateX(-100%);
}
.freq-label.last::before { left: 100%; transform: translateX(-100%); }

/* zoom indicator badge shown in top-right of spectrum when zoomed */
.zoom-badge {
    position: absolute;
    top: 4px;
    right: 6px;
    background: rgba(126,200,227,0.18);
    border: 1px solid rgba(126,200,227,0.4);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.68em;
    color: #7ec8e3;
    pointer-events: none;
    z-index: 11;
    display: none;
}

/* waiting overlay */
.panel-waiting {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 220px;
    color: #444;
    font-size: 0.85em;
}

/* ── Tooltip ── */
#tooltip {
    position: fixed;
    background: rgba(0,0,0,0.85);
    border: 1px solid #333;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.75em;
    color: #ddd;
    pointer-events: none;
    display: none;
    z-index: 100;
    white-space: nowrap;
}

/* ── No-data message ── */
#no-data {
    display: none;
    text-align: center;
    padding: 60px 20px;
    color: #555;
    font-size: 1em;
}

/* ── Band Conditions bar — fixed to bottom of viewport ── */
#conditions-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 50;
    background: #111118;
    border-top: 1px solid #1e1e2e;
    overflow: hidden;
}


#conditions-bar .cond-body {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    align-items: flex-start;
}

/* ── Right panel: weather + space weather always side-by-side ── */
#conditions-bar .cond-right {
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;   /* never stack on mobile */
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    align-items: flex-start;
}

/* ── Left column: band pills with CW spots filling the space below ── */
#conditions-bar .cond-left {
    flex: 1 1 auto;
    min-width: 0;
    align-self: stretch;   /* match the right panel's height so spots can fill the gap */
    display: flex;
    flex-direction: column;
}

/* ── Band SNR section ── */
#conditions-bar .cond-bands {
    padding: 10px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: flex-start;
    min-width: 0;
}

.cond-band-pill {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 9px;
    border-radius: 10px;
    border: 1px solid transparent;
    font-size: 0.72em;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    cursor: default;
    transition: opacity 0.2s;
}
.cond-band-pill .cpill-name { font-size: 1em; letter-spacing: 0.03em; }
.cond-band-pill .cpill-snr  { font-size: 0.82em; font-weight: 400; opacity: 0.8; font-variant-numeric: tabular-nums; }

/* status colours */
.cond-band-pill.excellent { background: rgba(76,175,80,0.18);  border-color: rgba(76,175,80,0.5);  color: #81c784; }
.cond-band-pill.good      { background: rgba(139,195,74,0.18); border-color: rgba(139,195,74,0.5); color: #aed581; }
.cond-band-pill.fair      { background: rgba(255,152,0,0.18);  border-color: rgba(255,152,0,0.5);  color: #ffb74d; }
.cond-band-pill.poor      { background: rgba(244,67,54,0.15);  border-color: rgba(244,67,54,0.4);  color: #e57373; }
.cond-band-pill.unknown   { background: rgba(80,80,80,0.18);   border-color: rgba(80,80,80,0.4);   color: #777; }

/* ── Space weather section ── */
#conditions-bar .cond-sw {
    /* Content-sized: basis auto rather than 0, so each card is only as wide as
       it needs to be.  Still allowed to shrink (never grow) so a narrow viewport
       compresses them instead of overflowing. */
    flex: 0 1 auto;
    min-width: 0;
    padding: 10px 10px;
    border-left: 1px solid #1e1e2e;
    display: flex;
    flex-direction: column;
    gap: 4px;
    justify-content: flex-start;
}

.cond-sw-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78em;
}

.cond-sw-label {
    color: #666;
    min-width: 60px;
    flex-shrink: 1;
}

.cond-sw-value {
    color: #ccc;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

.cond-sw-badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 8px;
    font-size: 0.85em;
    font-weight: 700;
    letter-spacing: 0.04em;
}
.cond-sw-badge.excellent { background: rgba(76,175,80,0.22);  color: #81c784; border: 1px solid rgba(76,175,80,0.4); }
.cond-sw-badge.good      { background: rgba(139,195,74,0.22); color: #aed581; border: 1px solid rgba(139,195,74,0.4); }
.cond-sw-badge.fair      { background: rgba(255,152,0,0.22);  color: #ffb74d; border: 1px solid rgba(255,152,0,0.4); }
.cond-sw-badge.poor      { background: rgba(244,67,54,0.18);  color: #e57373; border: 1px solid rgba(244,67,54,0.4); }
.cond-sw-badge.unknown   { background: rgba(80,80,80,0.18);   color: #777;    border: 1px solid rgba(80,80,80,0.4); }

/* ── CW spots grid ── */
@media (max-width: 767px) {
    #cond-cw-spots { display: none !important; }
    /* The five right-hand cards — ranks, users/hardware, front end, weather and
       space weather — need more width than a phone has. Hiding the container
       rather than each card also covers anything added there later; the cards'
       own inline display from JS is irrelevant once the parent is gone. */
    #conditions-bar .cond-right { display: none; }
}

#conditions-bar .cond-cw-spots {
    /* Badges must not contribute to the left column's intrinsic width,
       or adding badges pushes .cond-right onto a new row. */
    contain: inline-size;
    /* Fill only the leftover height under the pills — never grow the bar. */
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    border-top: 1px solid #1e1e2e;
    padding: 4px 12px 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: flex-start;
    align-content: flex-start;
}

.cond-cw-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    /* Click-to-tune target: the default I-beam reads as selectable text, and
       drag-selecting a scrolling badge is never what was intended. */
    cursor: pointer;
    user-select: none;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 0.70em;
    white-space: nowrap;
    width: 130px;
    border: 1px solid rgba(80,80,80,0.3);
    background: rgba(40,40,50,0.5);
    color: #888;
    overflow: hidden;
    text-overflow: ellipsis;
}
.cond-cw-badge.new-country {
    border-color: rgba(255,152,0,0.55);
    background: rgba(255,152,0,0.09);
    color: #ffb74d;
}
.cond-cw-badge .ccw-flag  { font-size: 1.1em; line-height: 1; flex-shrink: 0; }
.cond-cw-badge .ccw-call  { font-weight: 700; letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; }
.cond-cw-badge .ccw-band  { color: #7ec8e3; font-size: 0.88em; flex-shrink: 0; }
.cond-cw-badge .ccw-star  { color: #ffb74d; flex-shrink: 0; }

/* ── Voice activity ticker ── */
#conditions-bar .cond-ticker {
    flex: 1 1 100%;
    border-top: 1px solid #1e1e2e;
    overflow: hidden;
    height: 26px;
    position: relative;
    /* visibility toggled via JS: style.display = 'block' / 'none' */
}

@keyframes ticker-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(var(--ticker-shift)); }
}

#conditions-bar .cond-ticker-track {
    display: inline-flex;
    align-items: center;
    gap: 0;
    white-space: nowrap;
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    will-change: transform;
    /* animation applied entirely via JS once width is known */
}

.cond-ticker-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    /* Click-to-tune target — see .cond-cw-badge */
    cursor: pointer;
    user-select: none;
    padding: 0 18px;
    font-size: 0.76em;
    color: #aaa;
    border-right: 1px solid #1e1e2e;
    height: 100%;
}

.cond-ticker-item--new {
    background: rgba(255,152,0,0.10);
    border-left: 2px solid rgba(255,152,0,0.55);
    padding-left: 10px; /* compensate for the 2px border so total stays ~18px */
}

.cond-ticker-item--new .cond-ticker-call {
    color: #ffb74d;
}

.cond-ticker-item--new .cond-ticker-new-star {
    color: #ffb74d;
    font-size: 0.85em;
    flex-shrink: 0;
}

.cond-ticker-band {
    font-weight: 700;
    color: #7ec8e3;
    font-size: 0.9em;
    letter-spacing: 0.04em;
}

.cond-ticker-freq {
    color: #888;
    font-variant-numeric: tabular-nums;
}

.cond-ticker-call {
    color: #a0d8a0;
    font-weight: 600;
}

.cond-ticker-flag {
    font-size: 1.1em;
    line-height: 1;
}

.cond-ticker-snr {
    color: #666;
    font-size: 0.88em;
}

/* ── Hardware status section (rotator / ant-switch) ── */
#conditions-bar .cond-stats {
    /* Same content-sized card as its neighbours: only as wide as it needs to
       be, allowed to shrink but never grow. */
    flex: 0 1 auto;
    min-width: 0;
    padding: 10px 10px;
    border-left: 1px solid #1e1e2e;
    display: flex;
    flex-direction: column;
    gap: 4px;
    justify-content: flex-start;
}

/* The hardware card reserves 52px for labels like "RF Health"; PSK/WSPR/RBN
   need far less, and the reserved space showed up as a gap. Just enough to keep
   the three values aligned in a column. */
#cond-stats .cond-hw-label {
    min-width: 34px;
}
#cond-stats .cond-hw-row {
    gap: 5px;
    align-items: baseline;   /* label sits on the first line of a wrapped value */
}
/* Values run onto a second line here, so the hardware card's single-line
   ellipsis treatment does not apply.
   Block with a real <br>, not a wrapping flex row: a wrapping flex container's
   intrinsic width is measured as if nothing wrapped, so the card reserved room
   for all three WSPR entries side by side and then wrapped anyway — leaving a
   dead margin to the right of every row. A forced break splits the max-content
   measurement properly, so the card ends up as wide as its widest line. */
#cond-stats .cond-hw-value {
    display: block;
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    line-height: 1.5;
}

/* One rank reads as "#12 spots": the number carries the weight, the unit is
   there to say what it counts without spelling it out. */
.cond-stat-rank {
    color: #ccc;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}
.cond-stat-unit {
    color: #666;
    font-size: 0.9em;
    margin-left: 2px;
}
.cond-stat-sep {
    color: #333;
    margin: 0 4px;
}

#conditions-bar .cond-hardware {
    /* Content-sized: basis auto rather than 0, so each card is only as wide as
       it needs to be.  Still allowed to shrink (never grow) so a narrow viewport
       compresses them instead of overflowing. */
    flex: 0 1 auto;
    min-width: 0;
    padding: 10px 10px;
    border-left: 1px solid #1e1e2e;
    display: flex;
    flex-direction: column;
    gap: 4px;
    justify-content: flex-start;
}

.cond-hw-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78em;
}

.cond-hw-label {
    color: #666;
    min-width: 52px;
    flex-shrink: 1;
    /* Now that the cards size to their content, a two-word label like
       "RF Health" must not wrap, or it would narrow the card instead. */
    white-space: nowrap;
}

.cond-hw-value {
    color: #ccc;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.cond-hw-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 7px;
    border-radius: 8px;
    font-size: 0.85em;
    font-weight: 700;
    letter-spacing: 0.03em;
    white-space: nowrap;
}
.cond-hw-badge.moving  { background: rgba(255,152,0,0.22);  color: #ffb74d; border: 1px solid rgba(255,152,0,0.4); }
.cond-hw-badge.stopped { background: rgba(80,80,80,0.18);   color: #999;    border: 1px solid rgba(80,80,80,0.4); }
.cond-hw-badge.grounded{ background: rgba(244,67,54,0.18);  color: #e57373; border: 1px solid rgba(244,67,54,0.4); }
.cond-hw-badge.active  { background: rgba(76,175,80,0.18);  color: #81c784; border: 1px solid rgba(76,175,80,0.4); }

.cond-hw-flags {
    /* At most 4 flags per line; the column count is narrowed further in JS when
       there are fewer than 4.  Grid rather than flex-wrap because the card is
       content-sized, so there is no width for wrapping to trigger against. */
    display: grid;
    grid-template-columns: repeat(4, max-content);
    gap: 2px;
    font-size: 1em;
    line-height: 1;
}

/* ── SDR front-end status section ── */
#conditions-bar .cond-frontend {
    /* Content-sized: basis auto rather than 0, so each card is only as wide as
       it needs to be.  Still allowed to shrink (never grow) so a narrow viewport
       compresses them instead of overflowing. */
    flex: 0 1 auto;
    min-width: 0;
    padding: 10px 10px;
    border-left: 1px solid #1e1e2e;
    display: flex;
    flex-direction: column;
    gap: 4px;
    justify-content: flex-start;
}
/* Dark-theme equivalents of the admin monitor's IF power thresholds:
   ≥ -10 dBFS too hot, -45..-10 good, below -45 weak. */
.cond-fe-good { color: #81c784; }
.cond-fe-weak { color: #ffb74d; }
.cond-fe-hot  { color: #e57373; }

/* ── Local weather section ── */
#conditions-bar .cond-weather {
    /* Content-sized: basis auto rather than 0, so each card is only as wide as
       it needs to be.  Still allowed to shrink (never grow) so a narrow viewport
       compresses them instead of overflowing. */
    flex: 0 1 auto;
    min-width: 0;
    padding: 10px 10px;
    border-left: 1px solid #1e1e2e;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    overflow: hidden;
}

.cond-wx-icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    object-fit: contain;
}

.cond-wx-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
}

.cond-wx-desc {
    font-size: 0.8em;
    font-weight: 600;
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.cond-wx-chips {
    /* One reading per line.  These used to rely on wrapping inside a card of
       fixed width; now the card sizes to its content there is nothing to wrap
       against, so the stacking is explicit — and it matches the label/value
       rows of the neighbouring cards. */
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.cond-wx-chip {
    font-size: 0.72em;
    color: #999;
    white-space: nowrap;
}
.cond-wx-chip strong {
    color: #ccc;
    font-weight: 600;
}
</style>

<body>

<div id="topbar">
    <h1>📡 Band Activity <span id="receiver-callsign"></span></h1>
    <div id="receiver-info">
        <span id="receiver-name"></span>
        <span id="receiver-location"></span>
    </div>
    <div id="status-row">
        <div id="status-dot" class="wait"></div>
        <span id="status-text">Connecting…</span>
        <span id="utc-clock"></span>
        <span id="local-clock" style="display:none"></span>
        <!-- Notification stream indicator — hidden unless the operator has
             enabled the public notification stream (the endpoint answers 503). -->
        <span id="notif-badge">
            <span id="notif-dot" class="notif-dot wait"></span>
            <button id="btn-notif-key" type="button" title="Notification stream">&#x1F514;</button>
        </span>
    </div>
    <div id="band-pills"></div>
    <button id="btn-all">All</button>
    <button id="btn-none">None</button>
    <div id="range-controls" class="auto">
        <button id="db-auto" class="active" title="Auto: each band picks its own dB range to keep its noise floor at the bottom of the scale">Auto</button>
        <label class="manual-only">dB min <input type="number" id="db-min" value="-130" step="5"></label>
        <label class="manual-only">max <input type="number" id="db-max" value="-60" step="5"></label>
        <label class="auto-only" title="Smallest dB range auto mode will show. Quiet bands are widened upward, so the noise floor stays at the bottom.">
            <input type="number" id="db-span" value="60" step="5" min="10" max="100"> dB</label>
    </div>
    <div id="palette-controls">
        <select id="palette-select" title="Waterfall colour palette">
            <option value="jet">Jet</option>
            <option value="turbo">Turbo</option>
            <option value="viridis">Viridis</option>
            <option value="plasma">Plasma</option>
            <option value="sonar-green">Sonar Green</option>
            <option value="sonar-orange">Sonar Orange</option>
            <option value="night-vision">Night Vision</option>
        </select>
    </div>
    <div id="layout-controls">
        <select id="layout-select" title="How the band panels are arranged">
            <option value="auto">Auto</option>
            <option value="fit" selected>Fit to window</option>
            <option value="1">1 column</option>
            <option value="2">2 columns</option>
            <option value="3">3 columns</option>
            <option value="4">4 columns</option>
            <option value="5">5 columns</option>
            <option value="6">6 columns</option>
        </select>
    </div>
    <div id="peaks-controls">
        <label for="show-peaks" title="Show the top-3 signal markers on each spectrum">
            <input type="checkbox" id="show-peaks" checked> Peaks
        </label>
        <label for="filter-spots" title="Only show CW and voice spots for enabled bands">
            <input type="checkbox" id="filter-spots" checked> Filter
        </label>
        <label for="show-users" title="Mark where other listeners are tuned, with the flag of each listener's country">
            <input type="checkbox" id="show-users" checked> Users
        </label>
    </div>

    <!-- Alerts float below the clocks, over the top of the grid: they never
         change the topbar's height or take a row of their own. -->
    <div id="notif-panel">
        <div id="notif-auth">
            <input type="password" id="notif-password" placeholder="Notification password"
                   autocomplete="off" spellcheck="false">
            <label id="notif-ding-label" title="Play a sound when an alert arrives">
                <input type="checkbox" id="notif-ding" checked> Ding
            </label>
            <button id="btn-notif-connect" type="button">Connect</button>
        </div>
        <div id="notif-auth-msg"></div>
        <div id="notif-list" title="Click to dismiss"></div>
    </div>
</div>

<div id="grid"></div>
<div id="no-data">No bands selected — use the pills above to choose bands.</div>
<div id="tooltip"></div>

<div id="conditions-bar" style="display:none">
    <div class="cond-body">
        <div class="cond-left">
            <div class="cond-bands" id="cond-bands">

<script>
'use strict';

// ── Waterfall colour map ──────────────────────────────────────────────────────
// Colour schemes ported from spectrum-display.js getColorScheme() / interpolateColors()
function _paletteGetColorScheme(name) {
    const schemes = {
        // Full 256-entry Turbo palette (Google AI / SDRPlusPlus)
        turbo: [
            [48,18,59],[50,21,67],[51,24,74],[52,27,81],[53,30,88],[54,33,95],[55,36,102],[56,39,109],
            [57,42,115],[58,45,121],[59,47,128],[60,50,134],[61,53,139],[62,56,145],[63,59,151],[63,62,156],
            [64,64,162],[65,67,167],[65,70,172],[66,73,177],[66,75,181],[67,78,186],[68,81,191],[68,84,195],
            [68,86,199],[69,89,203],[69,92,207],[69,94,211],[70,97,214],[70,100,218],[70,102,221],[70,105,224],
            [70,107,227],[71,110,230],[71,113,233],[71,115,235],[71,118,238],[71,120,240],[71,123,242],[70,125,244],
            [70,128,246],[70,130,248],[70,133,250],[70,135,251],[69,138,252],[69,140,253],[68,143,254],[67,145,254],
            [66,148,255],[65,150,255],[64,153,255],[62,155,254],[61,158,254],[59,160,253],[58,163,252],[56,165,251],
            [55,168,250],[53,171,248],[51,173,247],[49,175,245],[47,178,244],[46,180,242],[44,183,240],[42,185,238],
            [40,188,235],[39,190,233],[37,192,231],[35,195,228],[34,197,226],[32,199,223],[31,201,221],[30,203,218],
            [28,205,216],[27,208,213],[26,210,210],[26,212,208],[25,213,205],[24,215,202],[24,217,200],[24,219,197],
            [24,221,194],[24,222,192],[24,224,189],[25,226,187],[25,227,185],[26,228,182],[28,230,180],[29,231,178],
            [31,233,175],[32,234,172],[34,235,170],[37,236,167],[39,238,164],[42,239,161],[44,240,158],[47,241,155],
            [50,242,152],[53,243,148],[56,244,145],[60,245,142],[63,246,138],[67,247,135],[70,248,132],[74,248,128],
            [78,249,125],[82,250,122],[85,250,118],[89,251,115],[93,252,111],[97,252,108],[101,253,105],[105,253,102],
            [109,254,98],[113,254,95],[117,254,92],[121,254,89],[125,255,86],[128,255,83],[132,255,81],[136,255,78],
            [139,255,75],[143,255,73],[146,255,71],[150,254,68],[153,254,66],[156,254,64],[159,253,63],[161,253,61],
            [164,252,60],[167,252,58],[169,251,57],[172,251,56],[175,250,55],[177,249,54],[180,248,54],[183,247,53],
            [185,246,53],[188,245,52],[190,244,52],[193,243,52],[195,241,52],[198,240,52],[200,239,52],[203,237,52],
            [205,236,52],[208,234,52],[210,233,53],[212,231,53],[215,229,53],[217,228,54],[219,226,54],[221,224,55],
            [223,223,55],[225,221,55],[227,219,56],[229,217,56],[231,215,57],[233,213,57],[235,211,57],[236,209,58],
            [238,207,58],[239,205,58],[241,203,58],[242,201,58],[244,199,58],[245,197,58],[246,195,58],[247,193,58],
            [248,190,57],[249,188,57],[250,186,57],[251,184,56],[251,182,55],[252,179,54],[252,177,54],[253,174,53],
            [253,172,52],[254,169,51],[254,167,50],[254,164,49],[254,161,48],[254,158,47],[254,155,45],[254,153,44],
            [254,150,43],[254,147,42],[254,144,41],[253,141,39],[253,138,38],[252,135,37],[252,132,35],[251,129,34],
            [251,126,33],[250,123,31],[249,120,30],[249,117,29],[248,114,28],[247,111,26],[246,108,25],[245,105,24],
            [244,102,23],[243,99,21],[242,96,20],[241,93,19],[240,91,18],[239,88,17],[237,85,16],[236,83,15],
            [235,80,14],[234,78,13],[232,75,12],[231,73,12],[229,71,11],[228,69,10],[226,67,10],[225,65,9],
            [223,63,8],[221,61,8],[220,59,7],[218,57,7],[216,55,6],[214,53,6],[212,51,5],[210,49,5],
            [208,47,5],[206,45,4],[204,43,4],[202,42,4],[200,40,3],[197,38,3],[195,37,3],[193,35,2],
            [190,33,2],[188,32,2],[185,30,2],[183,29,2],[180,27,1],[178,26,1],[175,24,1],[172,23,1],
            [169,22,1],[167,20,1],[164,19,1],[161,18,1],[158,16,1],[155,15,1],[152,14,1],[149,13,1],
            [146,11,1],[142,10,1],[139,9,2],[136,8,2],[133,7,2],[129,6,2],[126,5,2],[122,4,3]
        ],
        viridis: [
            [68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]
        ],
        plasma: [
            [13,8,135],[126,3,168],[204,71,120],[248,149,64],[240,249,33]
        ],
        jet: [
            [0,0,143],[0,0,255],[0,255,255],[255,255,0],[255,0,0],[128,0,0]
        ],
        'sonar-green': [
            [0,0,0],[0,80,0],[0,180,0],[0,255,0],[160,255,160],[240,255,255]
        ],
        'sonar-orange': [
            [0,0,0],[100,30,0],[210,80,0],[255,150,30],[255,210,120],[255,248,220]
        ],
        'night-vision': [
            [0,0,0],[100,0,0],[210,10,10],[255,60,60],[255,160,160],[255,235,235]
        ]
    };
    return schemes[name] || schemes.jet;
}

function _paletteInterpolate(colors, t) {
    const segments = colors.length - 1;
    const segment  = Math.min(Math.floor(t * segments), segments - 1);
    const localT   = t * segments - segment;
    const c1 = colors[segment];
    const c2 = colors[segment + 1];
    const r = Math.round(c1[0] + (c2[0] - c1[0]) * localT);
    const g = Math.round(c1[1] + (c2[1] - c1[1]) * localT);
    const b = Math.round(c1[2] + (c2[2] - c1[2]) * localT);
    return [r, g, b];
}

function buildCMAP(paletteName) {
    const colors = _paletteGetColorScheme(paletteName);
    const c = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
        const [r, g, b] = _paletteInterpolate(colors, i / 255);
        c[i] = 0xFF000000 | (b << 16) | (g << 8) | r; // ABGR for ImageData
    }
    return c;
}

let CMAP = buildCMAP('jet'); // default palette

// Bumped whenever CMAP changes, so each panel knows to re-colour its cached
// waterfall bitmap from the stored (palette-independent) row values.
let _paletteVersion = 0;

// ── Palette-derived trace colours ─────────────────────────────────────────────
// The spectrum trace is coloured from the same map as the waterfall, so a signal
// at a given level reads as the same colour in both.  The cold end of most
// palettes is near-black though, which would make the trace vanish against the
// panel background — so dark entries are lifted toward white, preserving hue
// while keeping the noise floor legible.
// Bounds on the measured inter-arrival gap.  The server ticker is
// background_poll_period_ms, itself clamped to 100–2000 ms, so anything outside
// this range is a stall or a scheduling artefact rather than the real rate.
const ROW_PERIOD_MIN = 60;
const ROW_PERIOD_MAX = 4000;

const TRACE_MIN_BRIGHT = 105;
function _traceColor(idx, alpha) {
    const v = CMAP[Math.max(0, Math.min(255, idx))];
    let r = v & 0xFF, g = (v >> 8) & 0xFF, b = (v >> 16) & 0xFF;  // CMAP is ABGR
    // Blend luma with the strongest channel.  Luma alone badly under-rates
    // saturated colours — jet's hot end (190,0,0) scores 40, so a pure-luma test
    // would wash the iconic red peak out to pink even though a red line reads
    // perfectly well on near-black.  The max term keeps saturated colours intact
    // while still catching genuinely dark ones like a deep blue floor.
    const bright = 0.6 * Math.max(r, g, b) + 0.4 * (0.2126 * r + 0.7152 * g + 0.0722 * b);
    if (bright < TRACE_MIN_BRIGHT) {
        const t = (1 - bright / TRACE_MIN_BRIGHT) * 0.75;
        r += (255 - r) * t;
        g += (255 - g) * t;
        b += (255 - b) * t;
    }
    return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${alpha})`;
}

// Respect the OS "reduce motion" setting — when set we snap to each new data
// frame instead of gliding between them.
const _reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── Auto dB range tuning ──────────────────────────────────────────────────────
// The aim is to sit the noise floor just above the bottom of the scale, so the
// whole vertical axis and colour ramp are spent on real signal.  Everything
// here exists to make that happen *slowly*: a scale that chases each burst of
// traffic is far worse to look at than one that is slightly wrong.
const AUTO_NOISE_PCT  = 0.10;   // percentile taken as the noise floor
const AUTO_SIGNAL_PCT = 0.995;  // percentile taken as the signal ceiling —
                                // ignores single-bin spikes that would otherwise
                                // stretch the top of the scale on their own
const AUTO_NOISE_MARGIN = 6;    // dB of scale left below the noise floor
const AUTO_HEADROOM     = 10;   // dB of scale left above the strongest signal
const AUTO_EMA          = 0.02; // ≈12 s time constant at 4 Hz updates
const AUTO_STEP         = 2;    // applied values move in steps of this many dB
const AUTO_DEADBAND     = 3;    // smoothed target must drift this far to move it
const AUTO_MIN_INTERVAL = 2000; // ms — hard floor on how often the scale changes
                                // Together these two cap the slew at AUTO_STEP
                                // per AUTO_MIN_INTERVAL (1 dB/s).  Bounding the
                                // interval alone is not enough: if the target
                                // has run 10 dB away in the meantime, a single
                                // "snap to target" would move all 10 dB at once.

// ── Global state ──────────────────────────────────────────────────────────────
// Synthetic pseudo-band (0-30 MHz) backed by the same wideband channel the
// spectrogram uses — see /api/noisefloor/config's separate "wideband" field
// and /api/noisefloor/spectrum/stream's ?band=wideband. Deliberately kept out
// of allBands: it must never be pulled in by the "All" button or the default
// band selection, only by the user explicitly clicking its pill.
const WIDEBAND_NAME = 'wideband';
let bandMeta    = {};   // name → {start, end, center_frequency, bin_count, bin_bandwidth}
let allBands    = [];   // ordered list of band names (excludes WIDEBAND_NAME)
let activeBands = new Set(); // currently selected band names (may include WIDEBAND_NAME)
let panels      = {};   // name → BandPanel instance
let sse         = null; // EventSource
let dbMin       = -130;
let dbMax       = -60;
let dbAuto      = true;  // true (default) = each panel picks its own range;
                         // false = manual, the dbMin/dbMax above apply to all
// Auto mode never shows less range than this.  A quiet band makes up the span
// by lifting the ceiling, never by dropping the floor, so the noise still sits
// at the very bottom of the scale.
const AUTO_SPAN_DEFAULT = 60;
const AUTO_SPAN_MIN     = 10;
const AUTO_SPAN_MAX     = 100;
let dbAutoMinSpan = AUTO_SPAN_DEFAULT;
let currentPalette = 'jet'; // active waterfall palette name
let currentLayout  = 'fit'; // 'auto' | 'fit' | '1'…'6'
let showPeaks      = true;  // draw the top-3 signal markers on each spectrum
let _localTzOffsetMin = null; // receiver timezone offset in minutes (from /api/description)

// ── Grid layout ───────────────────────────────────────────────────────────────
// 'auto'  → CSS auto-fill at a 340px minimum, canvases keep their default
//           80px/120px heights (the original behaviour).
// 'fit'   → pick the column count that makes the cards as large as possible
//           while still fitting every *enabled* band in the viewport.
// '1'-'6' → that many columns, card height derived from card width.
//
// In every non-auto mode the canvas block keeps its native proportions: the
// spectrum+waterfall area is CANVAS_ASPECT × the card width, split 40/60
// between spectrum and waterfall — the same ratio as the 340×(80+120) default.
const CANVAS_ASPECT = 200 / 340;   // canvas-block height ÷ card width
const SPEC_FRACTION = 80 / 200;    // spectrum's share of that block
const MIN_CANVAS_H  = 110;         // never squash below this
const MAX_CANVAS_H  = 560;         // nor stretch beyond it
const MIN_CARD_W    = 260;         // narrower than this is unreadable → drop a column

// Height of everything in a card that is *not* the two canvases (header, freq
// axis, borders).  Measured from a live panel so it tracks any CSS change.
function _cardChromeHeight() {
    const p = Object.values(panels)[0];
    if (!p || !p.el) return 46;
    const h = p.el.offsetHeight - p.specCanvas.offsetHeight - p.wfCanvas.offsetHeight;
    return h > 0 ? h : 46;
}

// Vertical space the grid can use before the fixed conditions bar covers it.
function _availableGridHeight() {
    const grid = document.getElementById('grid');
    const bar  = document.getElementById('conditions-bar');
    const barH = (bar && bar.style.display !== 'none') ? bar.offsetHeight : 0;
    const padY = 20; // #grid padding top+bottom
    return window.innerHeight - grid.getBoundingClientRect().top - barH - padY;
}

// Last layout actually applied, so repeat calls can be skipped.  Sizing a card
// can itself make the page scrollbar appear or disappear, which changes
// grid.clientWidth and would otherwise let the layout oscillate between two
// near-identical solutions every time a timer fires.
let _lastLayout = null;   // {mode, cols, canvasH}
const LAYOUT_EPSILON = 8; // px — ignore height changes smaller than this

function applyLayout() {
    const grid = document.getElementById('grid');
    const n    = Object.keys(panels).length;

    if (currentLayout === 'auto' || n === 0) {
        if (_lastLayout === null && !grid.classList.contains('grid-fixed')) return;
        _lastLayout = null;
        grid.classList.remove('grid-fixed');
        grid.style.removeProperty('--grid-cols');
        grid.style.removeProperty('--spec-h');
        grid.style.removeProperty('--wf-h');
        for (const p of Object.values(panels)) p._resize();
        return;
    }

    const gap     = 10;
    const innerW  = grid.clientWidth - 20; // minus #grid horizontal padding
    if (innerW <= 0) return;

    // Card width for a given column count.
    const widthFor = c => (innerW - (c - 1) * gap) / c;

    let cols, canvasH;

    if (currentLayout === 'fit') {
        const chrome = _cardChromeHeight();
        const availH = _availableGridHeight();
        let best = null;
        for (let c = 1; c <= Math.min(8, n); c++) {
            const cardW = widthFor(c);
            if (cardW < MIN_CARD_W && c > 1) continue;
            const rows  = Math.ceil(n / c);
            // Largest canvas height that respects both the aspect ratio (so cards
            // never get absurdly tall) and the viewport (so nothing scrolls).
            const byWidth  = cardW * CANVAS_ASPECT;
            const byHeight = (availH - (rows - 1) * gap - rows * chrome) / rows;
            const h = Math.min(byWidth, byHeight, MAX_CANVAS_H);
            if (!best || h > best.h) best = { c, h };
        }
        if (!best) best = { c: 1, h: widthFor(1) * CANVAS_ASPECT };
        cols    = best.c;
        canvasH = best.h;
    } else {
        const want = parseInt(currentLayout, 10) || 3;
        // Never ask for more columns than the window can show legibly.
        cols    = Math.max(1, Math.min(want, Math.floor((innerW + gap) / (MIN_CARD_W + gap)) || 1));
        canvasH = widthFor(cols) * CANVAS_ASPECT;
    }

    canvasH = Math.round(Math.max(MIN_CANVAS_H, Math.min(MAX_CANVAS_H, canvasH)));

    // Nothing meaningful changed → leave the DOM (and the canvases) alone.
    if (_lastLayout &&
        _lastLayout.mode === currentLayout &&
        _lastLayout.cols === cols &&
        Math.abs(_lastLayout.canvasH - canvasH) < LAYOUT_EPSILON) {
        return;
    }
    _lastLayout = { mode: currentLayout, cols, canvasH };

    const specH = Math.round(canvasH * SPEC_FRACTION);

    grid.classList.add('grid-fixed');
    grid.style.setProperty('--grid-cols', cols);
    grid.style.setProperty('--spec-h', specH + 'px');
    grid.style.setProperty('--wf-h', (canvasH - specH) + 'px');

    // Canvas backing stores must follow their new CSS size.
    for (const p of Object.values(panels)) p._resize();
}

// Coalesce resize storms into one relayout per frame.
let _layoutRAF = null;
function scheduleLayout() {
    if (_layoutRAF !== null) return;
    _layoutRAF = requestAnimationFrame(() => {
        _layoutRAF = null;
        applyLayout();
    });
}

// ── Bandwidth tracking ────────────────────────────────────────────────────────
let _bpsAccum    = 0;       // bytes accumulated in current 1s window
let _bpsLastTime = 0;       // timestamp of last kbps update
let _bpsCurrent  = null;    // last computed kbps string (null = no data yet)

// ── Audio (MinimalRadio) ──────────────────────────────────────────────────────
let radio        = null;    // MinimalRadio instance (lazy-created on first use)
let audioFreqHz  = null;    // currently tuned frequency (Hz), null = stopped
let audioBandName = null;   // band name of currently playing audio

// Position the shared tooltip, flipping left of cursor when near the right viewport edge.
function _positionTooltip(text, cx, cy) {
    const tip = document.getElementById('tooltip');
    tip.textContent = text;
    tip.style.left  = '-9999px';   // off-screen so we can measure width
    tip.style.top   = '-9999px';
    tip.style.display = 'block';
    const tw = tip.offsetWidth;
    const margin = 12;
    let x = cx + margin;
    if (x + tw > window.innerWidth - 4) {
        x = cx - margin - tw;   // flip to left of cursor
    }
    tip.style.left = `${x}px`;
    tip.style.top  = `${cy - 20}px`;
}

function _getRadio() {
    if (!radio && window.MinimalRadio) {
        radio = new MinimalRadio();
    }
    return radio;
}

// Start audio at a specific frequency (Hz). Switches frequency if already playing.
// `mode` is optional — null lets MinimalRadio auto-detect LSB/USB from frequency,
// which is what clicking on a spectrum does.
async function startAudioAt(freqHz, bandName, mode = null) {
    const r = _getRadio();
    if (!r) { console.warn('MinimalRadio not available'); return; }

    // Remove playing indicator from previous band and force its redraw
    if (audioBandName && audioBandName !== bandName) {
        _setBandPlayingIndicator(audioBandName, false);
        if (panels[audioBandName]) panels[audioBandName].dirty = true;
    }

    audioFreqHz   = freqHz;
    audioBandName = bandName;

    if (r.isPlaying) {
        // Already playing — just retune
        r.changeFrequency(freqHz, mode);
        _setBandPlayingIndicator(bandName, true);
    } else {
        try {
            await r.startPreview(freqHz, mode);
            _setBandPlayingIndicator(bandName, true);
        } catch (err) {
            console.error('Audio start failed:', err);
            audioFreqHz = null; audioBandName = null;
            return;
        }
    }
    // Force immediate redraw so cursor appears right away
    if (panels[bandName]) panels[bandName].dirty = true;
}

// ── Click-to-tune from CW spot badges / voice activity ticker ────────────────
// Both carry a band name from the server, which may not match the receiver's
// configured band list exactly (case, or a band this receiver doesn't cover).
function _resolveBandName(name) {
    if (!name) return null;
    if (bandMeta[name]) return name;
    const lower = String(name).toLowerCase();
    if (bandMeta[lower]) return lower;
    return allBands.find(b => b.toLowerCase() === lower) || null;
}

// Same convention as the main receiver UI: below 10 MHz the CW/voice pair sits
// on the lower sideband, at or above it on the upper.
function _cwModeForFreq(hz)    { return hz < 10000000 ? 'cwl' : 'cwu'; }
function _voiceModeForFreq(hz) { return hz < 10000000 ? 'lsb' : 'usb'; }
const _VALID_MODES = new Set(['usb','lsb','am','sam','fm','nfm','cwu','cwl']);

// Tune to a spot.  Enables the band first if it isn't already showing; does
// nothing at all if this receiver has no such band.
async function _tuneFromSpot(rawBand, freqHz, mode) {
    const band = _resolveBandName(rawBand);
    if (!band || !isFinite(freqHz) || freqHz <= 0) return;

    if (!activeBands.has(band)) {
        activeBands.add(band);
        updatePills();
        rebuildPanels();   // creates the panel and reconnects the spectrum stream
        savePrefs();
    }
    await startAudioAt(freqHz, band, mode);
}

async function stopAudio() {
    const r = _getRadio();
    const prevBand = audioBandName;
    if (r) await r.stopPreview();
    if (prevBand) _setBandPlayingIndicator(prevBand, false);
    audioFreqHz = null; audioBandName = null;
    // Force redraw to remove cursor
    if (prevBand && panels[prevBand]) panels[prevBand].dirty = true;
}

function _setBandPlayingIndicator(bandName, playing) {
    if (!bandName) return;
    const panel = panels[bandName];
    if (!panel) return;
    const header = panel.el.querySelector('.band-header');
    if (!header) return;
    let btn = header.querySelector('.band-stop-btn');
    if (playing) {
        if (!btn) {
            btn = document.createElement('button');
            btn.className = 'band-stop-btn';
            btn.title = 'Stop audio';
            btn.textContent = '■ Stop';
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                stopAudio();
            });
            header.insertBefore(btn, header.firstChild);
        }
    } else {
        if (btn) btn.remove();
    }
}

// Clips a frequency window's raw (unclamped) canvas-X edges to the visible
// canvas, then widens it to a minimum pixel width so it stays visible even
// when its true Hz span rounds to a sliver. The wideband chart spans 30 MHz
// across the same pixel width a per-band chart uses for a few hundred kHz,
// so a 3 kHz FT8 window or a ~1 kHz CW passband can otherwise shrink to a
// fraction of a pixel and vanish. Returns null if the window is fully
// off-screen (both edges past the same side).
function _clipHighlightX(x1raw, x2raw, cw, minPx = 2) {
    if (x2raw <= 0 || x1raw >= cw) return null;
    const x1 = Math.max(0, x1raw);
    const x2 = Math.max(Math.min(cw, x2raw), Math.min(cw, x1 + minPx));
    return [x1, x2];
}

// ── BandPanel — one spectrum+waterfall per band ───────────────────────────────
class BandPanel {
    constructor(name, meta) {
        this.name = name;
        this.meta = meta;
        this.bins = null;          // Uint8Array — current decoded state
        this.waterfallRows  = [];  // array of Float32Array (full n bins, normalised 0-1)
        this.waterfallTimes = [];  // array of Date.now() timestamps, parallel to waterfallRows
        this.maxRows = 120;
        this._tickPositions = []; // [{nextTick, rowPos}] — recomputed once per arrival, see _computeTickPositions
        this.el = null;
        this.specCanvas = null;
        this.specCtx = null;
        this.wfCanvas = null;
        this.wfCtx = null;
        this.overlayCanvas = null;
        this.overlayCtx = null;
        this.animFrame = null;
        this.dirty = false;        // true when something needs a redraw

        // ── Smooth animation state ───────────────────────────────────────────
        // Data arrives on a fixed server ticker (background_poll_period_ms —
        // 250 ms typically), which is far slower than the display refresh.  We
        // render every frame and interpolate between the last two data frames,
        // so the trace glides and the waterfall scrolls continuously instead of
        // snapping once per arrival.
        this._prevVals   = null;   // Float32Array(n) — dBFS at previous arrival
        this._curVals    = null;   // Float32Array(n) — dBFS at latest arrival
        this._lerpVals   = null;   // Float32Array(n) — scratch for interpolation
        this._lastRowTime = 0;     // timestamp of latest arrival
        this._rowPeriod  = 250;    // robust estimate of inter-arrival gap (ms)
        this._rowPeriodSeeded = false;
        this._rowOutliers = 0;     // consecutive gaps rejected as implausible
        this._statP5     = null;   // cached stats — recomputed only on arrival
        this._statPeak   = null;

        // ── Auto dB range (per band) ──────────────────────────────────────────
        this._autoMin    = null;   // applied floor (quantised, changes rarely)
        this._autoMax    = null;   // applied ceiling
        this._autoMinEma = null;   // heavily smoothed target
        this._autoMaxEma = null;
        this._autoLastChange = 0;  // when the applied values last moved

        // ── Waterfall render cache ───────────────────────────────────────────
        // Offscreen bitmap holding one pixel row per data row at full bin
        // resolution.  New rows are written into it as a ring buffer, so a
        // frame costs a couple of drawImage blits instead of an O(w×h) JS
        // pixel loop — which is what makes per-frame rendering affordable.
        this._wfOff     = null;    // canvas: binCount × maxRows (ring buffer)
        this._wfOffCtx  = null;
        this._wfInter   = null;    // canvas: wfW × maxRows (horizontally resampled)
        this._wfInterCtx = null;
        this._wfHead    = 0;       // ring index of the newest row
        this._wfRowPx   = null;    // ImageData(binCount × 1) scratch for row writes
        this._wfRowBuf  = null;    // Uint32 view onto _wfRowPx
        this._wfInterKey = '';     // cache key for the pass-1 result
        this._wfPaletteVersion = -1;

        // ── Cached spectrum background (dB grid + labels) ─────────────────────
        this._specBg    = null;
        this._specBgKey = '';

        // ── Cached palette-matched trace gradients ────────────────────────────
        this._traceKey  = '';
        this._lineGrad  = null;
        this._fillGrad  = null;

        // ── Peak marker cache ────────────────────────────────────────────────
        this._peaks        = [];   // [{i, db}] in zoomed-slice coordinates
        this._peaksZoomKey = '';   // invalidates the cache when zoom changes

        // ── Peak hold buffer (for top-3 markers) ─────────────────────────────
        // Rolling max over ~3 s of frames. Indexed by bin position (full band).
        this._peakHold    = null;  // Float32Array(n) — max dBFS seen per bin
        this._peakHoldAge = null;  // Uint16Array(n)  — frames since last update
        this._peakHoldMax = 15;    // frames to hold a peak (~3 s at ~5 fps)

        // ── Zoom state ──────────────────────────────────────────────────────
        this.zoomStart = 0;        // fraction [0,1] of full bin array
        this.zoomEnd   = 1;

        // ── Drag-to-select / pan state ───────────────────────────────────────
        this._dragStart = null;    // canvas-fraction where drag began
        this._dragLast  = null;    // canvas-fraction at previous mousemove (for pan delta)
        this._dragging  = false;

        // ── Pinch-to-zoom state ──────────────────────────────────────────────
        this._pinchDist0  = null;  // initial finger distance
        this._pinchZoom0  = null;  // {start, end} at pinch start
        this._pinchCenter = null;  // fraction of pinch midpoint

        // ── Double-tap / single-finger pan detection ─────────────────────────
        this._lastTap       = 0;
        this._touchPanLast  = null;  // canvas-fraction of previous touch X (for pan)
        this._touchTapStart = null;  // {x, y, frac} at touchstart — for tap-vs-pan

        // ── Click-vs-drag disambiguation ─────────────────────────────────────
        this._lastClickWasDrag = false;  // set true in onMouseUp after a drag commit

        this._buildDOM();
        this._startRenderLoop();
    }

    _buildDOM() {
        const panel = document.createElement('div');
        panel.className = 'band-panel';
        panel.id = `panel-${this.name}`;

        const startMHz = (this.meta.start / 1e6).toFixed(3);
        const endMHz   = (this.meta.end   / 1e6).toFixed(3);

        panel.innerHTML = `
            <div class="band-header">
                <span class="band-name">${this.name.toUpperCase()}</span>
                <span class="band-freq-range">${startMHz}–${endMHz} MHz</span>
                <div class="band-stats">
                    <span>P5: <span class="val" id="stat-p5-${this.name}">--</span> dB</span>
                    <span>Peak: <span class="val" id="stat-peak-${this.name}">--</span> dB</span>
                </div>
            </div>
            <div class="canvas-stack" id="stack-${this.name}">
                <canvas class="spectrum-canvas" id="spec-${this.name}"></canvas>
                <canvas class="waterfall-canvas" id="wf-${this.name}"></canvas>
                <canvas class="zoom-overlay" id="overlay-${this.name}"></canvas>
                <div class="zoom-badge" id="zoom-badge-${this.name}"></div>
            </div>
            <div class="freq-axis" id="axis-${this.name}"></div>
        `;

        this.el = panel;

        // Append to grid
        document.getElementById('grid').appendChild(panel);

        // Grab canvas refs after DOM insertion
        this.specCanvas    = document.getElementById(`spec-${this.name}`);
        this.wfCanvas      = document.getElementById(`wf-${this.name}`);
        this.overlayCanvas = document.getElementById(`overlay-${this.name}`);
        this.specCtx       = this.specCanvas.getContext('2d');
        this.wfCtx         = this.wfCanvas.getContext('2d');
        this.overlayCtx    = this.overlayCanvas.getContext('2d');

        // Size canvases to their CSS pixel size.  Window resizes are handled by
        // the single global listener in init(), which recomputes the grid
        // layout and then resizes every panel.
        this._resize();

        // Tooltip on spectrum hover
        this.specCanvas.addEventListener('mousemove', e => this._onSpecHover(e));
        this.specCanvas.addEventListener('mouseleave', () => {
            document.getElementById('tooltip').style.display = 'none';
        });

        // Tooltip on waterfall hover (shows frequency + dB at cursor X)
        this.wfCanvas.addEventListener('mousemove', e => this._onWfHover(e));
        this.wfCanvas.addEventListener('mouseleave', () => {
            document.getElementById('tooltip').style.display = 'none';
        });

        // ── Hover crosshair line on overlay ──────────────────────────────────
        const stackEl = document.getElementById(`stack-${this.name}`);
        stackEl.addEventListener('mousemove', (e) => {
            if (this._dragging) return; // don't draw during drag
            const rect = stackEl.getBoundingClientRect();
            const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            this._drawHoverLine(frac);
        });
        stackEl.addEventListener('mouseleave', () => {
            this._clearHoverLine();
        });

        // ── Zoom interaction handlers ────────────────────────────────────────
        this._setupZoomHandlers();

        // Build frequency axis labels
        this._updateAxis();
    }

    _resize() {
        const w = this.specCanvas.offsetWidth;
        if (w === 0) return;

        // Assigning canvas.width/height *clears* the canvas, so bail out when the
        // backing store already matches the CSS size.  Without this, any spurious
        // relayout (the conditions-bar refresh timers fire every few seconds)
        // blanks every panel until its next draw — which reads as a flicker.
        const sH = this.specCanvas.offsetHeight;
        const wH = this.wfCanvas.offsetHeight;
        if (this.specCanvas.width  === w  && this.specCanvas.height === sH &&
            this.wfCanvas.width    === w  && this.wfCanvas.height   === wH) {
            return;
        }

        this.specCanvas.width  = w;
        this.specCanvas.height = sH;
        this.wfCanvas.width    = w;
        this.wfCanvas.height   = wH;
        // Overlay spans the full stack height (spec + wf)
        const stackH = this.specCanvas.offsetHeight + this.wfCanvas.offsetHeight;
        this.overlayCanvas.width  = w;
        this.overlayCanvas.height = stackH;
        this.overlayCanvas.style.height = stackH + 'px';
        this.dirty = true;
    }

    // Dynamic frequency axis — rebuilt whenever zoom changes
    _updateAxis() {
        const axis = document.getElementById(`axis-${this.name}`);
        axis.innerHTML = '';
        const startHz = this.meta.start + this.zoomStart * (this.meta.end - this.meta.start);
        const endHz   = this.meta.start + this.zoomEnd   * (this.meta.end - this.meta.start);
        const spanHz  = endHz - startHz;
        const steps   = 5;
        for (let i = 0; i <= steps; i++) {
            const frac = i / steps;
            const hz   = startHz + frac * spanHz;
            const mhz  = (hz / 1e6).toFixed(3);
            const lbl  = document.createElement('span');
            let cls = 'freq-label';
            if (i === 0)     cls += ' first';
            if (i === steps) cls += ' last';
            lbl.className = cls;
            lbl.style.left = `${frac * 100}%`;
            lbl.textContent = mhz;
            axis.appendChild(lbl);
        }
        // Update zoom badge
        const badge = document.getElementById(`zoom-badge-${this.name}`);
        if (badge) {
            const zoomed = (this.zoomEnd - this.zoomStart) < 0.999;
            badge.style.display = zoomed ? 'block' : 'none';
            if (zoomed) {
                const spanMHz = (spanHz / 1e6).toFixed(3);
                badge.textContent = `${spanMHz} MHz  ×${(1/(this.zoomEnd-this.zoomStart)).toFixed(1)}`;
            }
        }
    }

    // ── Zoom helpers ──────────────────────────────────────────────────────────
    _resetZoom() {
        this.zoomStart = 0;
        this.zoomEnd   = 1;
        this._updateAxis();
        this.dirty = true;
    }

    // Apply a zoom centred on `centreFrac` (fraction of current view) by `factor`
    // factor > 1 = zoom in, factor < 1 = zoom out
    _applyZoom(centreFrac, factor) {
        const span    = this.zoomEnd - this.zoomStart;
        const newSpan = Math.min(1, Math.max(0.01, span / factor));
        // Centre in absolute fraction space
        const absCenter = this.zoomStart + centreFrac * span;
        let newStart = absCenter - centreFrac * newSpan;
        let newEnd   = newStart + newSpan;
        // Clamp to [0,1]
        if (newStart < 0) { newEnd -= newStart; newStart = 0; }
        if (newEnd   > 1) { newStart -= (newEnd - 1); newEnd = 1; }
        newStart = Math.max(0, newStart);
        newEnd   = Math.min(1, newEnd);
        this.zoomStart = newStart;
        this.zoomEnd   = newEnd;
        this._updateAxis();
        this.dirty = true;
    }

    // ── All zoom interaction handlers ─────────────────────────────────────────
    _setupZoomHandlers() {
        const spec    = this.specCanvas;
        const wf      = this.wfCanvas;
        const overlay = this.overlayCanvas;

        // ── Scroll wheel zoom (on spec or wf) ────────────────────────────────
        const onWheel = (e) => {
            e.preventDefault();
            const rect = e.currentTarget.getBoundingClientRect();
            const frac = (e.clientX - rect.left) / rect.width;
            // deltaY > 0 = scroll down = zoom out; < 0 = zoom in
            const factor = e.deltaY < 0 ? 1.4 : 1 / 1.4;
            this._applyZoom(frac, factor);
        };
        spec.addEventListener('wheel', onWheel, { passive: false });
        wf.addEventListener('wheel', onWheel, { passive: false });

        // ── Drag-to-select on overlay ─────────────────────────────────────────
        // The overlay sits over the full stack; we track drag in spec-fraction space.
        // Drag is initiated on mousedown anywhere in the stack.
        const stack = document.getElementById(`stack-${this.name}`);

        // ── Double-click / double-tap to reset zoom ───────────────────────────
        // Listen on the stack so it fires regardless of which child was clicked.
        stack.addEventListener('dblclick', (e) => {
            e.preventDefault();
            this._resetZoom();
        });

        // ── Right-click: reset zoom + stop audio ──────────────────────────────
        stack.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            this._resetZoom();
            if (audioBandName === this.name) stopAudio();
        });

        // ── Single click → tune audio to clicked frequency ────────────────────
        // Fires only for genuine single clicks (not drags, not double-clicks).
        stack.addEventListener('click', (e) => {
            if (e.detail >= 2) return;           // ignore double-click
            if (this._lastClickWasDrag) { this._lastClickWasDrag = false; return; }
            if (!this.bins) return;

            const rect   = stack.getBoundingClientRect();
            const frac   = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            // Map cursor fraction linearly across the visible Hz range (1 Hz resolution)
            const startHz = this.meta.start + this.zoomStart * (this.meta.end - this.meta.start);
            const endHz   = this.meta.start + this.zoomEnd   * (this.meta.end - this.meta.start);
            const freqHz  = Math.round(startHz + frac * (endHz - startHz));

            startAudioAt(freqHz, this.name);
        });

        const onMouseDown = (e) => {
            if (e.button !== 0) return;
            // Ignore the second click of a double-click — let dblclick handle it
            if (e.detail >= 2) return;
            const rect = stack.getBoundingClientRect();
            this._dragStart = (e.clientX - rect.left) / rect.width;
            this._dragLast  = this._dragStart;
            this._dragging  = false;
            const zoomed = (this.zoomEnd - this.zoomStart) < 0.999;
            overlay.style.pointerEvents = 'auto';
            overlay.style.cursor = zoomed ? 'grab' : 'col-resize';
        };

        const onMouseMove = (e) => {
            if (this._dragStart === null) return;
            const rect = stack.getBoundingClientRect();
            const cur  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            const dist = Math.abs(cur - this._dragStart);
            if (dist > 0.01) this._dragging = true;
            if (!this._dragging) return;

            const zoomed = (this.zoomEnd - this.zoomStart) < 0.999;

            if (zoomed) {
                // ── Pan mode: shift zoom window by delta ──────────────────────
                // Scale delta by zoom span so 1px mouse = 1px content at any zoom level.
                overlay.style.cursor = 'grabbing';
                const span  = this.zoomEnd - this.zoomStart;
                const delta = (cur - this._dragLast) * span;
                let newStart = this.zoomStart - delta;
                let newEnd   = this.zoomEnd   - delta;
                if (newStart < 0) { newEnd -= newStart; newStart = 0; }
                if (newEnd   > 1) { newStart -= (newEnd - 1); newEnd = 1; }
                this.zoomStart = Math.max(0, newStart);
                this.zoomEnd   = Math.min(1, newEnd);
                this._updateAxis();
                this.dirty = true;
                // Clear any selection rect
                this.overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
            } else {
                // ── Zoom-select mode: draw selection rectangle ────────────────
                const oCtx = this.overlayCtx;
                const ow = overlay.width;
                const oh = overlay.height;
                oCtx.clearRect(0, 0, ow, oh);
                const x1 = Math.min(this._dragStart, cur) * ow;
                const x2 = Math.max(this._dragStart, cur) * ow;
                oCtx.fillStyle   = 'rgba(126,200,227,0.12)';
                oCtx.fillRect(x1, 0, x2 - x1, oh);
                oCtx.strokeStyle = 'rgba(126,200,227,0.7)';
                oCtx.lineWidth   = 1;
                oCtx.strokeRect(x1, 0, x2 - x1, oh);
            }
            this._dragLast = cur;
        };

        const onMouseUp = (e) => {
            if (this._dragStart === null) return;
            const rect = stack.getBoundingClientRect();
            const cur  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));

            // Clear overlay
            this.overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
            overlay.style.pointerEvents = 'none';
            overlay.style.cursor = '';

            const zoomed = (this.zoomEnd - this.zoomStart) < 0.999;

            if (this._dragging && Math.abs(cur - this._dragStart) > 0.01) {
                if (!zoomed) {
                    // Commit zoom-to-selection (only at full zoom)
                    const span = this.zoomEnd - this.zoomStart;
                    const a = this.zoomStart + Math.min(this._dragStart, cur) * span;
                    const b = this.zoomStart + Math.max(this._dragStart, cur) * span;
                    this.zoomStart = Math.max(0, a);
                    this.zoomEnd   = Math.min(1, b);
                    this._updateAxis();
                    this.dirty = true;
                }
                // Tell the click handler that this mouseup ended a drag
                this._lastClickWasDrag = true;
            }
            this._dragStart = null;
            this._dragLast  = null;
            this._dragging  = false;
        };

        stack.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup',   onMouseUp);

        // ── Touch: pinch-to-zoom + single-finger pan + double-tap reset ───────
        const onTouchStart = (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                this._touchPanLast = null; // cancel any single-finger pan
                this._touchTapStart = null; // cancel tap tracking
                const t1 = e.touches[0], t2 = e.touches[1];
                this._pinchDist0  = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                this._pinchZoom0  = { start: this.zoomStart, end: this.zoomEnd };
                const rect = spec.getBoundingClientRect();
                const midX = (t1.clientX + t2.clientX) / 2;
                this._pinchCenter = (midX - rect.left) / rect.width;
            } else if (e.touches.length === 1) {
                // Record tap start position for tap-vs-pan disambiguation
                const rect = stack.getBoundingClientRect();
                this._touchTapStart = {
                    x: e.touches[0].clientX,
                    y: e.touches[0].clientY,
                    frac: (e.touches[0].clientX - rect.left) / rect.width,
                };

                // Double-tap detection
                const now = Date.now();
                if (now - this._lastTap < 350) {
                    e.preventDefault();
                    this._resetZoom();
                    this._touchPanLast = null;
                    this._touchTapStart = null;
                } else {
                    // Start single-finger pan tracking (only when zoomed)
                    const zoomed = (this.zoomEnd - this.zoomStart) < 0.999;
                    if (zoomed) {
                        this._touchPanLast = (e.touches[0].clientX - rect.left) / rect.width;
                        e.preventDefault(); // prevent page scroll while panning
                    } else {
                        this._touchPanLast = null;
                    }
                }
                this._lastTap = now;
            }
        };

        const onTouchMove = (e) => {
            if (e.touches.length === 2 && this._pinchDist0 !== null) {
                e.preventDefault();
                const t1 = e.touches[0], t2 = e.touches[1];
                const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                const factor = dist / this._pinchDist0;
                // Apply zoom relative to pinch-start state
                const z0    = this._pinchZoom0;
                const span0 = z0.end - z0.start;
                const newSpan = Math.min(1, Math.max(0.01, span0 / factor));
                const absCenter = z0.start + this._pinchCenter * span0;
                let newStart = absCenter - this._pinchCenter * newSpan;
                let newEnd   = newStart + newSpan;
                if (newStart < 0) { newEnd -= newStart; newStart = 0; }
                if (newEnd   > 1) { newStart -= (newEnd - 1); newEnd = 1; }
                this.zoomStart = Math.max(0, newStart);
                this.zoomEnd   = Math.min(1, newEnd);
                this._updateAxis();
                this.dirty = true;
            } else if (e.touches.length === 1 && this._touchPanLast !== null) {
                // Single-finger pan when zoomed
                // Scale delta by zoom span so 1px touch = 1px content at any zoom level.
                e.preventDefault();
                const rect  = stack.getBoundingClientRect();
                const cur   = (e.touches[0].clientX - rect.left) / rect.width;
                const span  = this.zoomEnd - this.zoomStart;
                const delta = (cur - this._touchPanLast) * span;
                let newStart = this.zoomStart - delta;
                let newEnd   = this.zoomEnd   - delta;
                if (newStart < 0) { newEnd -= newStart; newStart = 0; }
                if (newEnd   > 1) { newStart -= (newEnd - 1); newEnd = 1; }
                this.zoomStart = Math.max(0, newStart);
                this.zoomEnd   = Math.min(1, newEnd);
                this._updateAxis();
                this.dirty = true;
                this._touchPanLast = cur;
            }
        };

        const onTouchEnd = (e) => {
            if (e.touches.length < 2) {
                this._pinchDist0  = null;
                this._pinchZoom0  = null;
                this._pinchCenter = null;
            }
            if (e.touches.length === 0) {
                // Tap-to-audio: fire if finger lifted close to where it landed
                // (i.e. it was a tap, not a pan drag).
                const ts = this._touchTapStart;
                if (ts && this.bins) {
                    const touch = e.changedTouches[0];
                    const dx = touch.clientX - ts.x;
                    const dy = touch.clientY - ts.y;

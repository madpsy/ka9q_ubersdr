<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b0e14">

    <!-- Everything below down to the manifest is rendered per-receiver by
         handleV2IndexPage / buildV2PageMeta, from the callsign, name, location
         and coordinates in config.yaml. Crawlers and link unfurlers see the
         receiver rather than a generic UberSDR page — and both are the only
         readers that matter here, since App.jsx overwrites document.title with
         the tuned frequency as soon as the app starts. -->
    <title>{{.Meta.Title}}</title>
    <meta name="description" content="{{.Meta.Description}}">
    <link rel="canonical" href="{{.Meta.CanonicalURL}}">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{.Meta.ShortName}}">
    <meta property="og:title" content="{{.Meta.Title}}">
    <meta property="og:description" content="{{.Meta.Description}}">
    <meta property="og:url" content="{{.Meta.CanonicalURL}}">
    <meta property="og:image" content="{{.Meta.ImageURL}}">

    <!-- summary, not summary_large_image: the only artwork every install is
         guaranteed to have is the square app icon. -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{.Meta.Title}}">
    <meta name="twitter:description" content="{{.Meta.Description}}">
    <meta name="twitter:image" content="{{.Meta.ImageURL}}">

    <script type="application/ld+json">{{.Meta.JSONLD}}</script>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="{{.Meta.ShortName}}">

    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <!-- The installed app's manifest, served from Go so its name carries the
         receiver's callsign — see handleManifest. Its start_url points here, so
         installing from either interface opens this one. -->
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="dist/v2.css">
    {{.CustomHeadHTML}}
</head>
<body>
    <div id="root"></div>

    <!-- React 18 UMD (vendored — see vendor/README.md) -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <!-- Opus decoder shared with the v1 frontend; exposes window["opus-decoder"] -->
    <script src="/opus-decoder.min.js"></script>

    <!-- The receiver's frequency limits, inlined so radio/constants.js can read them
         synchronously at module scope. /api/description carries the same values for
         anything that can wait for a fetch; this cannot, because the ?freq= share link
         and the restored tuning are clamped against MAX_FREQ on first render. Absent or
         zero fields fall back to 10 kHz-30 MHz. -->
    <script>window.__UBERSDR__ = {{.TuningRange}};</script>

    <script src="dist/v2.js"></script>

    <!-- The service worker exists to satisfy the install criteria, not to serve
         anything from cache: this is a live receiver and a stale spectrum is
         worse than none. It is network-first throughout and keeps only the app
         shell, so an offline launch says so instead of showing a blank page.
         Registered at the root, and shared with v1 — one app, one worker. -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function (err) {
                    console.warn('[SW] Registration failed:', err);
                });
            });
        }
    </script>

    <!-- server.custom_body_html, the same value v1 is given. Placed outside
         #root so React never owns it: everything React renders lives inside
         that div and is replaced wholesale on re-render. Widgets are not
         injected here — those are v1-only. -->
    {{.CustomBodyHTML}}
</body>
</html>
